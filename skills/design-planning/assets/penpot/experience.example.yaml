          label: Save
    states:
      - id: editing
        visible: Editable fields and save action.
      - id: saving
        visible: Saving feedback; repeat submission disabled.
      - id: saved
        visible: Success confirmation.
      - id: failed
        visible: Error feedback; input preserved.
    actions:
      - id: save
        from: editing
        to: saving
        trigger: Activate save with valid input.
        requirement_ids: [UI-001]
      - id: success
        from: saving
        to: saved
        trigger: The save operation succeeds.
        requirement_ids: [UI-001]
      - id: failure
        from: saving
        to: failed
        trigger: The save operation fails.
        requirement_ids: [UI-001]
      - id: retry
        from: failed
        to: saving
        trigger: Activate retry.
        requirement_ids: [UI-001]
