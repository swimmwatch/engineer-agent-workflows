name: Bug report
description: Report a reproducible, non-sensitive defect.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Do not include credentials, private repository content, personal data,
        Prompt MCP answers, or vulnerability details.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what behavior did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest complete steps or fixture.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Provide the exact release, tag, or commit when known.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant OS, architecture, Node.js, Codex, and Claude Code versions.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: This report contains no secret, private answer, credential, or unrelated private source content.
          required: true
