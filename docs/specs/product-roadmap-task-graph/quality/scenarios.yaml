    fixture: Diamond/redundant edge, longest-path branch, Backlog round trip, unknown external prerequisite, explicit status/Stage/Sprint/tag variants, permuted inputs.
    observe: Compare complete/active/reduced edges, reachability, layer numbers, exact status, Ready/Blocked and Needs Spec independently.
    expected: Equal normalized inputs are deterministic; every invalid internal component is identified; Backlog source edges survive; no phantom Ready or dependency.
    check_to_create: product-graph.test.mjs
    command: rtk proxy node --test packages/engineer-agent-workflow-mcp/test/product-graph.test.mjs
    red: Behavioral mismatch before the kernel is implemented; an absent import is harness evidence only.
    prove: Individually remove a source edge, use shortest-path layers, or treat Testing as Done; each relevant assertion must fail.
    threshold:
      maximum_tasks: 1000
      maximum_source_dependencies: 10000
