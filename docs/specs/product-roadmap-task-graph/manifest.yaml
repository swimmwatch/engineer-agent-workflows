  - One integrated Product Roadmap planning outcome; preserve the confirmed Idea Refine scope in docs/ideas/product-roadmap-task-graph.md without reopening settled choices.
  - Deep coverage is warranted by external board authority, interacting graph/projection states, multiple public surfaces, durable state and partial-failure recovery.
