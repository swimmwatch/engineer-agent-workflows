      results: [ { item_index: 0, item_key: source:scope.manifest, verdict: covered, explanation: "The confirmed Standard scope keeps core workflow behavior, local stdio MCP interfaces and durable journal data active; the specification authority section preserves the existing Node/host boundaries and excludes global configuration/publication. SRC/REQ/COV define the workflow, REV defines the service and durable review state, and SKL/USE/LEG preserve host and consumer boundaries. The single declared MCP contract is appropriate; no inactive profile deliverable is introduced.", requirement_ids: [ SRC-001, SRC-002, REQ-001, REQ-002, COV-001, REV-001, REV-002, SKL-001, SKL-002, USE-001, LEG-001, VAL-001 ], source_refs: [] }, { item_index: 1, item_key: source:eab9b8dd-cf17-479f-b31c-876f2280a6f0, verdict: not_applicable, explanation: This source explicitly classifies the earlier repository observation as bootstrap context. Its fact only says the bundle existed and contained twelve requirements; it does not independently justify their behavior. The preserved original implementation request supplies the actual behavioral provenance. The predecessor links do not turn this self-reference into a user requirement., requirement_ids: [], source_refs: [ { id: 954bbd73-9d90-4632-966f-870867f23a9c, revision: 1 } ] }, { item_index: 2, item_key: source:6e6129ab-f66f-41e9-9929-ac233960a65a, verdict: covered, explanation: "REV-001 expressly requires check-state to remember an observed author-made Approved transition, invalidate a later return to Draft across restarts, and never assign approval. It also retains the stated observation limit: edits made and reverted entirely between calls cannot be observed. This matches both the affirmative reply and its recorded question context.", requirement_ids: [ REV-001 ], source_refs: [] }, { item_index: 3, item_key: source:954bbd73-9d90-4632-966f-870867f23a9c, verdict: covered, explanation: "SRC-001/002 preserve verbatim initial/follow-up/edit sources, provenance, stable IDs, partial-amendment obligations and critical context exclusions. REQ-001/002 retain the exact heading contract, pinned structural parser, complete bounded reads and journal-owned links. COV/REV require server-owned inventory, source/question/history evidence, durable versioned results, complete unchanged-input reviews, visible bounds/retry failures and no MCP model launching or approval. SKL-001/002 retain a separate unbiased reviewer at every depth, active-profile relevance, concrete findings, author-owned corrections and automatic approval only after checks. USE/LEG preserve freshness ownership, packet boundaries and honest legacy behavior. VAL-001 retains the named deterministic/model cases, two unchanged successful passes, repair-stop rule and final validation/evidence gates. Authority prose preserves the expressly excluded global/live/publication actions.", requirement_ids: [ SRC-001, SRC-002, REQ-001, REQ-002, COV-001, REV-001, REV-002, SKL-001, SKL-002, USE-001, LEG-001, VAL-001 ], source_refs: [] }, { item_index: 4, item_key: source:2f77d5a9-05bd-4394-9500-2d17ba7671d2, verdict: covered, explanation: "The follow-up permits controlled removal of conditions at unchanged IDs after a disputed historical scenario, without coaching the reviewer or requiring literal wording. VAL-001 requires unchanged-ID deletion and equivalent-paraphrase controls, independent fresh contexts and the evidence journal; SKL-001 supplies original evidence and excludes expected answers or suspected defects. The specification context retains private baseline archives and checkpoint evidence, so the prior historical result remains evidence rather than becoming an invented semantic failure. These obligations preserve the unchanged original-source basis and the purpose of the approved negative control.", requirement_ids: [ VAL-001, SKL-001, SRC-001 ], source_refs: [] }, { item_index: 5, item_key: requirement:SRC-001, verdict: covered, explanation: "The original request explicitly requires verbatim non-sensitive initial/follow-up instruction capture, known user-edit provenance, preservation before transformation, no repeated customer question and no substitution by repository facts. SRC-001 states those observable obligations, the named capture operation and related requirement/predecessor references. Its visible overflow failure and consent limitation preserve the original bounded-input and MCP trust boundaries.", requirement_ids: [], source_refs: [ { id: 954bbd73-9d90-4632-966f-870867f23a9c, revision: 1 } ] }, { item_index: 6, item_key: requirement:SRC-002, verdict: covered, explanation: "The source requires stable decision identities and revision history, authoritative decision_link_requirements, no mandatory nested IDs, partial edits retaining unrelated obligations, clarification of materially unknown provenance, and justified non-behavioral context classification. SRC-002 retains each condition and expressly excludes automatic treatment of functional limits/prohibitions as context.", requirement_ids: [], source_refs: [ { id: 954bbd73-9d90-4632-966f-870867f23a9c, revision: 1 } ] }, { item_index: 7, item_key: requirement:REQ-001, verdict: covered, explanation: "REQ-001 faithfully restates the source's level-three ID/title definition, equal-or-higher heading termination including nested content, duplicate/empty/missing-definition rejection, false-positive exclusion for prose/quotes/code/examples, preservation of IDs and exact mdast-util-from-markdown@2.0.3 pin. Structural parsing is explicitly required instead of whole-file regex matching.", requirement_ids: [], source_refs: [ { id: 954bbd73-9d90-4632-966f-870867f23a9c, revision: 1 } ] }, { item_index: 8, item_key: requirement:REQ-002, verdict: covered, explanation: "The original requirement-list/get contract calls for bounded IDs, exact text, document positions, source versions and derived decision refs, with complete continuations and no second manual mapping. REQ-002 preserves those fields and limits, and stale/cross-context rejection follows the original stale/foreign-context and unchanged-boundary requirements.", requirement_ids: [], source_refs: [ { id: 954bbd73-9d90-4632-966f-870867f23a9c, revision: 1 } ] }, { item_index: 9, item_key: requirement:COV-001, verdict: covered, explanation: "The source's mechanical-coverage layer requires all current sources and valid links, while the review layer also checks unsupported requirements, unanswered questions, active profiles and disputed context exclusions. COV-001 assigns inventory to MCP and prevents the author from making coverage complete by choosing a subset. This is supported by the original coverage and invariant sections.", requirement_ids: [], source_refs: [ { id: 954bbd73-9d90-4632-966f-870867f23a9c, revision: 1 } ] }, { item_index: 10, item_key: requirement:REV-001, verdict: covered, explanation: "The original plan requires typed versioned review metadata in decisions.yaml, outside product search and without copied specification text; versions bind specification, confirmed scope and sources while report writes remain stable and only Draft-to-Approved is exempt. REV-001 retains those rules, including source history needed for amendment review. The later explicit status-observation reply supports persistent detection of an observed downgrade and the limit for unseen edit/revert cycles.", requirement_ids: [], source_refs: [ { id: 954bbd73-9d90-4632-966f-870867f23a9c, revision: 1 }, { id: 6e6129ab-f66f-41e9-9929-ac233960a65a, revision: 1 } ] }, { item_index: 11, item_key: requirement:REV-002, verdict: covered, explanation: "REV-002 maps to all four named review scenario operations plus expanded check-state, original question/amendment portions, evidence-bearing verdicts and completion rejection for missing portions/results/findings/staleness. It preserves existing atomic/path/bounds/retry behavior, exact retries and unchanged-run resume, requires fresh review without verdict reuse after input changes, uses existing Zod/public-schema generation, and excludes generic YAML editing, model launching and MCP approval/semantic proof.", requirement_ids: [], source_refs: [ { id: 954bbd73-9d90-4632-966f-870867f23a9c, revision: 1 } ] }, { item_index: 12, item_key: requirement:SKL-001, verdict: covered, explanation: "SKL-001 follows the source's independent separate-context review after Draft at every depth, targeted reviewer reference, original evidence without expected answers, only active profile references and explicit condition/exception/alternative checks. It retains concrete counterexamples, reviewer non-editing, restoration of unambiguous source-supported omissions, questions only for new material decisions and incomplete status when an independent reviewer is unavailable.", requirement_ids: [], source_refs: [ { id: 954bbd73-9d90-4632-966f-870867f23a9c, revision: 1 } ] }, { item_index: 13, item_key: requirement:SKL-002, verdict: covered, explanation: "SKL-002 preserves the original automatic author-made Approved transition only after required checks/corrections, without a second approval question; specification/planning/design/implementation remain separate explicit invocations. No new skill is added, canonical shared sources generate isolated hosts, inactive profiles are not loaded, and model recommendations remain advisory through existing host templates.", requirement_ids: [], source_refs: [ { id: 954bbd73-9d90-4632-966f-870867f23a9c, revision: 1 } ] }, { item_index: 14, item_key: requirement:USE-001, verdict: covered, explanation: "USE-001 is directly supported by the original consumer section: planning checks the registered review and pins a source reference, incremental checks freshness before execution and completion and reads packet-linked requirements/contracts, stale or incomplete work returns to specification ownership, and no packet/test ledger is added to MCP. Test-first, one authorized packet, current checklist/handoff and optional reviews/commits remain intact.", requirement_ids: [], source_refs: [ { id: 954bbd73-9d90-4632-966f-870867f23a9c, revision: 1 } ] }, { item_index: 15, item_key: requirement:LEG-001, verdict: covered, explanation: "The source explicitly leaves old specifications unverified by the new process without automatic blocking or migration, activates the new process on creation/change and preserves former consumer checks. LEG-001 keeps those distinctions and compatible existing public operations where new policy is not active; it does not relabel unavailable checks as verified.", requirement_ids: [], source_refs: [ { id: 954bbd73-9d90-4632-966f-870867f23a9c, revision: 1 } ] }, { item_index: 16, item_key: requirement:VAL-001, verdict: covered, explanation: "VAL-001 preserves the original checkpoint RED/GREEN plus stdio discipline, complete deterministic failure/recovery matrix, isolated model scenarios outside npm test/CI, all named semantic controls, two consecutive unchanged-skill passes, stop-and-agree rule after two same-cause failed repairs, complete final validation gates and honest evidence limitations. The later answer supports controlled deletion with unchanged IDs; equivalent-paraphrase and original-evidence reviewer obligations prevent turning disputed wording into a mandatory false finding.", requirement_ids: [], source_refs: [ { id: 954bbd73-9d90-4632-966f-870867f23a9c, revision: 1 }, { id: 2f77d5a9-05bd-4394-9500-2d17ba7671d2, revision: 3 } ] }, { item_index: 17, item_key: profile:core, verdict: covered, explanation: "The active core profile concerns an extension of existing workflow tooling, not a new CLI or installation surface. SRC/REQ/COV define sources, structural Markdown and deterministic bounded reads; REV defines repeat/interrupted/stale behavior; SKL/USE define invocation and consumer ownership; LEG preserves old input compatibility. Existing Node/host contracts and canonical generation remain explicit. The declared MCP contract describes context, continuations, retry bounds and errors. Within this confirmed local scope I found no further material core scenario requiring a new requirement or artifact.", requirement_ids: [ SRC-001, SRC-002, REQ-001, REQ-002, COV-001, REV-001, REV-002, SKL-001, SKL-002, USE-001, LEG-001, VAL-001 ], source_refs: [] }, { item_index: 18, item_key: profile:backend, verdict: covered, explanation: "The backend profile applies to local stdio MCP operations with the existing process-permission boundary. REQ-002 and REV-002 cover addressed inputs/outputs, bounded continuations, stale/cross-context rejection, evidence-dependent completion, atomic writes and exact retry/resume; REV-001 binds freshness and status observation; LEG-001 preserves legacy consumers. The declared contracts/mcp.md preserves dependency rechecks and overflow errors. No new network identity, transport, rate-limit or independently deployed service is introduced, so those would be speculative additions rather than missing scoped behavior.", requirement_ids: [ REQ-002, REV-001, REV-002, LEG-001, VAL-001 ], source_refs: [] }, { item_index: 19, item_key: profile:data, verdict: covered, explanation: "The data profile's material risks are lost provenance/history, duplicated mappings, corrupted or partial review state, stale snapshots and forced legacy migration. SRC-001/002 preserve exact source identity and append-only amendments; REQ-002 derives reverse links; REV-001/002 define typed versioned metadata, non-self-invalidating writes, complete evidence, retry/restart recovery and new runs after changes; LEG-001 makes enrollment explicit. Existing per-file atomic writes, dependency checks and visible bounds are preserved. No deletion/backfill or new retention domain is introduced; I found no additional material data decision in confirmed scope.", requirement_ids: [ SRC-001, SRC-002, REQ-002, REV-001, REV-002, LEG-001, VAL-001 ], source_refs: [] }, { item_index: 20, item_key: context:specification, verdict: covered, explanation: "The complete non-requirement prose keeps Draft status, the confirmed Standard core/backend/data scope, existing Node/host contracts and excluded global/live/publication actions consistent with the requirements and original request. Bootstrap prose distinguishes implementing the new scenario capabilities from the existing requirement to use an available workflow MCP for protected state; it requires adoption/current-state evidence rather than declaring checks passed. Checkpoint/handoff and repository evidence plus private baseline archives complement VAL-001. I found no contradictory product promise hidden outside the twelve requirement blocks.", requirement_ids: [ SRC-001, REV-001, REV-002, SKL-002, LEG-001, VAL-001 ], source_refs: [ { id: scope.manifest, revision: 3 }, { id: 954bbd73-9d90-4632-966f-870867f23a9c, revision: 1 } ] } ]
      approval_observed: true
