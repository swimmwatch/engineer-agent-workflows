      outcome: gaps
      results: [ { item_index: 0, item_key: source:scope.manifest, verdict: covered, explanation: "The confirmed Standard proposal selects core workflow behavior, local stdio MCP interfaces, and durable journal metadata. SRC-001/SRC-002, REQ-001/REQ-002, COV-001, and REV-001/REV-002 provide those behaviors; SKL-002 preserves host generation and explicit workflow stages. The specification scope keeps UI, Penpot, global configuration, publication, and commits excluded. Scope revisions 1 and 2 contain the same proposal with no accepted replacement scope; revision 3 records its explicit confirmation.", requirement_ids: [ SRC-001, SRC-002, REQ-001, REQ-002, COV-001, REV-001, REV-002, SKL-002 ], source_refs: [] }, { item_index: 1, item_key: source:eab9b8dd-cf17-479f-b31c-876f2280a6f0, verdict: not_applicable, explanation: Revision 3 explicitly classifies this as the bootstrap observation that a specification bundle existed. Its fact and prior revisions do not contain an independent requested product behavior. The source appropriately removes the old circular requirement links and points to the separately preserved original implementation request as the behavioral authority., requirement_ids: [], source_refs: [] }, { item_index: 2, item_key: source:6e6129ab-f66f-41e9-9929-ac233960a65a, verdict: covered, explanation: "REV-001 explicitly requires check-state to remember an observed author-made Approved status, invalidate a later return to Draft across restarts, never assign approval itself, and acknowledge that edits reverted entirely between calls cannot be observed. This preserves the recorded question context and the selected answer.", requirement_ids: [ REV-001 ], source_refs: [] }, { item_index: 3, item_key: source:954bbd73-9d90-4632-966f-870867f23a9c, verdict: gap, explanation: "Several explicit conditions in the complete approved plan are absent from the current requirements and non-requirement prose. (1) SRC-002 omits the prohibition on mandatory nested decision IDs and the allowed one-decision-to-many-requirements relation. (2) REQ-001 reduces the mandated mdast-util-from-markdown@2.0.3 parser to any structural parser. (3) The exact public operations decision_record_instruction, decision_mark_context, requirement_list/get, specification_review_start/get/record/complete and specification_check_state are not specified; neither is review_start enrollment/version pinning, check_state's legacy/pending/findings/stale/success output contract, existing Zod/public-schema generation, the prohibition on YAML payloads/arbitrary field paths/generic editing, or the explicit prohibition on MCP launching models. (4) The targeted reviewer reference must not copy the whole author workflow; the current generic short-entrypoint/selective-reference wording does not preserve this explicit packaging constraint. (5) VAL-001 omits the actual three known cases (participant identity, reprocessing counters, optional charset), fresh isolated contexts, the profile-gap and valid not_applicable controls, and the partial-amendment/resume-without-reinterview model controls. (6) The final full npm test, lint, foundation validation, generation of both bundles, generate:check, size checks, affected Codex-artifact checks, git diff --check, and MCP/skill documentation updates are not required. (7) The explicit exclusions of global installations, client configuration and live Claude runs, and the prohibition on bypassing an unavailable workflow MCP by editing protected YAML, are not all retained. These are lost agreed conditions, not proposed new scope.", counterexample: "A conforming implementation under the current wording could require child decision IDs, use a different structural parser version, rename the public scenario tools, expose generic YAML editing, launch a model from the MCP, and omit check_state coverage states. A reviewer reference could contain the copied complete author workflow. Qualification could use arbitrary three omission examples in reused model contexts, skip valid not_applicable and resume controls, and finish after focused tests without lint, full suite, generated-bundle checks or documentation updates. The original plan explicitly rejects these alternatives.", requirement_ids: [ SRC-002, REQ-001, REQ-002, REV-002, SKL-001, SKL-002, VAL-001 ], source_refs: [] }, { item_index: 4, item_key: requirement:SRC-001, verdict: covered, explanation: "The initial plan explicitly requires exact non-sensitive initial/follow-up instructions with provenance, known user edits, no redundant interview merely to save them, and no relabeling as repository facts; its preservation and size-limit invariants justify explicit input rejection without truncation. The consent limitation accurately preserves the existing native-question/MCP ownership boundary.", requirement_ids: [], source_refs: [ { id: 954bbd73-9d90-4632-966f-870867f23a9c, revision: 1 } ] }, { item_index: 5, item_key: requirement:SRC-002, verdict: gap, explanation: "The requirement faithfully preserves stable IDs, append-only revisions, predecessor/affected-requirement references, narrow amendment semantics, uncertain authorship, clarification, and justified context classification. However, the original Sources and links section additionally forbids mandatory nested decision IDs and explicitly permits one decision to support multiple separately verifiable requirements; neither condition is preserved elsewhere.", counterexample: "An implementation can retain stable append-only parent decisions yet require a separate child decision ID for every linked requirement, rejecting one broad decision linked to two requirements. SRC-002 does not prohibit this, while the approved source explicitly does.", requirement_ids: [], source_refs: [ { id: 954bbd73-9d90-4632-966f-870867f23a9c, revision: 1 } ] }, { item_index: 6, item_key: requirement:REQ-001, verdict: gap, explanation: "The heading/block boundaries, duplicate/empty/missing-definition failures, negative ID-match cases and stable identifiers faithfully derive from the source. The approved plan also explicitly pins mdast-util-from-markdown@2.0.3; 'Parse Markdown structurally' omits this authorized compatibility constraint.", counterexample: "A different structural parser or an unpinned later parser release satisfies REQ-001 as written, although the approved plan requires mdast-util-from-markdown@2.0.3.", requirement_ids: [], source_refs: [ { id: 954bbd73-9d90-4632-966f-870867f23a9c, revision: 1 } ] }, { item_index: 7, item_key: requirement:REQ-002, verdict: covered, explanation: "The plan requires bounded exact requirement listing/reading with positions, decision refs, source version and continuations, and derives reverse links from the decision journal without a second hand-maintained table. Its stale/cross-context tests justify the explicit rejection rules. This requirement faithfully expresses that behavior; the omitted exact public operation names are recorded against the original source and REV-002 interface contract.", requirement_ids: [], source_refs: [ { id: 954bbd73-9d90-4632-966f-870867f23a9c, revision: 1 } ] }, { item_index: 8, item_key: requirement:COV-001, verdict: covered, explanation: "The source makes MCP, not the author, enumerate current inputs and explicitly requires detecting uncovered sources, unsupported requirements, false links, unanswered questions and disputed context exclusions. COV-001 preserves those conditions without treating mechanical links as semantic proof.", requirement_ids: [], source_refs: [ { id: 954bbd73-9d90-4632-966f-870867f23a9c, revision: 1 } ] }, { item_index: 9, item_key: requirement:REV-001, verdict: covered, explanation: "The approved plan requires typed versioned service metadata in existing decisions.yaml, review history/references/findings without another spec copy, exclusion from product-decision search, version binding, self-write stability, and only the designated Draft-to-Approved exception. Reading historical source revisions is needed for its partial-amendment rule. The separate observed-status answer expressly supports checkpointing Approved and detecting a later downgrade across restart, with the stated observability limit.", requirement_ids: [], source_refs: [ { id: 954bbd73-9d90-4632-966f-870867f23a9c, revision: 1 }, { id: 6e6129ab-f66f-41e9-9929-ac233960a65a, revision: 1 } ] }, { item_index: 10, item_key: requirement:REV-002, verdict: gap, explanation: "The requirement covers complete evidence, unfinished/stale/gap failure, bounded atomic retry-safe operations and path protections. It omits the approved public review tool names/responsibilities, review_start enrollment/version capture, the five check_state coverage/review states, the existing Zod-to-public-schema contract, and the prohibitions on YAML payloads/arbitrary field paths/generic editing and MCP-launched models. Generic 'dedicated scenario tools' and 'does not prove independence' do not preserve those interfaces and negative obligations.", counterexample: "A server can expose differently named review operations, fail to enroll policy at review_start, return only a boolean from check_state, accept generic YAML mutations, and launch a reviewer model while disclaiming semantic proof. Such behavior can satisfy REV-002 but contradicts the original approved MCP contract.", requirement_ids: [], source_refs: [ { id: 954bbd73-9d90-4632-966f-870867f23a9c, revision: 1 } ] }, { item_index: 11, item_key: requirement:SKL-001, verdict: covered, explanation: "The source requires a separate context at every depth, a short Lite review, neutral complete original inputs, comparison against active-profile requirements, concrete behavioral counterexamples, no reviewer spec edits, author-owned corrections/new questions and an incomplete result when separate review is unavailable. SKL-001 preserves these semantic responsibilities. 'Active profile requirements' is reasonably read as the existing confirmed profile guidance, which includes undisclosed material scenarios; equivalent wording does not require copying that checklist into the specification. The explicit targeted-reference packaging omission is recorded against the original source.", requirement_ids: [], source_refs: [ { id: 954bbd73-9d90-4632-966f-870867f23a9c, revision: 1 } ] }, { item_index: 12, item_key: requirement:SKL-002, verdict: covered, explanation: "The source explicitly preserves automatic Approved after successful review and state checks, separate explicit specification/planning/design/incremental invocations, no new skill, canonical-source generation for both hosts, selectively loaded references and advisory host-model recommendations. SKL-002 preserves these product boundaries; detailed omitted validation and reviewer-reference constraints are recorded under their specific items.", requirement_ids: [], source_refs: [ { id: 954bbd73-9d90-4632-966f-870867f23a9c, revision: 1 } ] }, { item_index: 13, item_key: requirement:USE-001, verdict: covered, explanation: "The approved consumer section requires planning to check the registered review, read exact requirements and save a version reference; incremental checks before work/completion and loads linked requirements/contracts. It returns stale/incomplete product contracts to specification ownership and preserves test-first, one authorized packet, checklist/handoff, no mandatory review/commit, and no MCP execution registry. USE-001 corresponds to each behavior.", requirement_ids: [], source_refs: [ { id: 954bbd73-9d90-4632-966f-870867f23a9c, revision: 1 } ] }, { item_index: 14, item_key: requirement:LEG-001, verdict: covered, explanation: "The approved plan expressly retains existing checks for old specifications, labels their new completeness assurance unavailable, forbids automatic migration/blocking, and enrolls newly created or changed specifications in the new workflow. LEG-001 preserves that compatibility distinction and does not claim unavailable checks passed.", requirement_ids: [], source_refs: [ { id: 954bbd73-9d90-4632-966f-870867f23a9c, revision: 1 } ] }, { item_index: 15, item_key: requirement:VAL-001, verdict: gap, explanation: "The requirement preserves test-first checkpoints, broad deterministic cases, two unchanged-skill focused passes, the repeated-cause discussion threshold, and the limit on claims about the old matrix. It omits material mandated qualification details: the actual participant-identity/reprocessing-counter/optional-charset omissions; fresh isolated model contexts; profile-gap and correct not_applicable controls; partial-edit preservation and resume without repeated interview; and the final full npm test, lint, foundation validation, both bundle generation, generate:check, size checks, affected Codex-artifact checks, git diff --check and MCP/skill documentation updates. The source also explicitly lists uncovered-source, incorrect-context exclusion, duplicate/deleted definition and unfinished-report deterministic controls, which are not all retained in the acceptance text.", counterexample: "Two focused passes could use any three generic omissions in a reused context, omit profile-gap/not_applicable and amendment/resume scenarios, then declare completion without full suite, lint, foundation validation, generation consistency, size/artifact checks, whitespace checks or documentation updates. VAL-001 and the remaining prose permit this reduced qualification, while the approved plan does not.", requirement_ids: [], source_refs: [ { id: 954bbd73-9d90-4632-966f-870867f23a9c, revision: 1 } ] }, { item_index: 16, item_key: profile:core, verdict: gap, explanation: "Core relevance is the existing explicit skill invocations, Markdown requirement contract, generated host artifacts and completion checks, not a new CLI/configuration product. SRC/REQ/COV/SKL/USE/LEG cover actors, normal/invalid/repeated reads, output identity and consumer freshness. The material remaining core gaps are the explicit parser pin, decision-link cardinality, final generated-artifact/validation gates already identified in the original source. No unrelated CLI flags, new platform or extra artifact is required by this review.", counterexample: "The current core contract allows using another parser, requiring nested decisions and declaring completion without required generated-output checks. These violate agreed behavior of this existing workflow product.", requirement_ids: [ SRC-002, REQ-001, SKL-001, SKL-002, USE-001, LEG-001, VAL-001 ], source_refs: [] }, { item_index: 17, item_key: profile:backend, verdict: gap, explanation: "Backend relevance is the local stdio scenario API. REQ-002/REV-001/REV-002 cover paging, stale/cross-context rejection, durable retries, atomic writes and review completion failures; no HTTP authentication, rate limit or new remote service is in scope. The material gap is the loss of the expressly selected public tool interfaces, enrollment and check_state states, public schema generation and restricted typed mutation surface. These are existing agreed operation contracts, not new speculative backend requirements.", counterexample: "A local provider with generic YAML-editing tools, renamed review operations and a boolean check_state can satisfy the generic specification while breaking the approved consumer-facing stdio contract.", requirement_ids: [ REQ-002, REV-001, REV-002, LEG-001 ], source_refs: [] }, { item_index: 18, item_key: profile:data, verdict: covered, explanation: "The durable-state change is confined to the existing decision journal and review metadata. SRC-001/SRC-002 preserve non-sensitive exact sources, stable identities and append-only amendment history. REV-001 defines version binding, metadata separation, status-transition invalidation and restart behavior; REV-002 preserves atomic writes, retry recovery and stale rejection. LEG-001 covers unchanged legacy behavior and explicit enrollment instead of implicit migration; VAL-001 requires restart/retry/stale controls. Existing storage/path protections remain in scope, with no new datastore, export/retention or irreversible-deletion workflow requiring a new product decision.", requirement_ids: [ SRC-001, SRC-002, REV-001, REV-002, LEG-001, VAL-001 ], source_refs: [ { id: 954bbd73-9d90-4632-966f-870867f23a9c, revision: 1 }, { id: 6e6129ab-f66f-41e9-9929-ac233960a65a, revision: 1 } ] }, { item_index: 19, item_key: context:specification, verdict: gap, explanation: "The non-requirement prose correctly states Draft, the confirmed Standard core/backend/data scope and existing host/runtime boundaries, and its bootstrap statement concerns the new deliverable tools rather than dispensing with the existing workflow MCP. However, its exclusions retain only part of the original final paragraph: global installations and live Claude runs are not explicitly excluded, and the explicit prohibition on bypassing unavailable workflow MCP with direct protected-YAML edits is absent. The selected source is behavioral, so these negative obligations should survive in scope/requirements rather than remain solely in source history.", counterexample: "The specification text alone permits adding global skill installation or live Claude qualification to completion and leaves open direct protected-YAML authoring when MCP is unavailable, while the original plan expressly excludes those actions.", requirement_ids: [ SRC-001, REV-002, SKL-002 ], source_refs: [ { id: 954bbd73-9d90-4632-966f-870867f23a9c, revision: 1 } ] } ]
