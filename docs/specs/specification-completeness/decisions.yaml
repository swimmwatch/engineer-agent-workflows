      results: [ { item_index: 0, item_key: source:scope.manifest, verdict: covered, explanation: "The complete scope question, invalid-response predecessor and explicit answered revision confirm Standard with core/backend/data only and contracts/mcp.md as the planning artifact. COV-001 and SKL-001 use active profiles; SKL-002 preserves separate workflows and host artifacts. The specification context preserves the local stdio, existing runtime and exclusion boundaries. This confirmation adds no new product interface.", requirement_ids: [ COV-001, SKL-001, SKL-002, REV-002 ], source_refs: [ { id: scope.manifest, revision: 3 }, { id: 954bbd73-9d90-4632-966f-870867f23a9c, revision: 1 } ] }, { item_index: 1, item_key: source:eab9b8dd-cf17-479f-b31c-876f2280a6f0, verdict: not_applicable, explanation: "This source is explicitly classified as non-behavioral bootstrap context. It observes that a bundle existed and does not establish any feature, exception or prohibition. Its earlier circular links are removed in the current revision; original user instruction 954bbd73-9d90-4632-966f-870867f23a9c@1 supplies the behavioral authority.", requirement_ids: [], source_refs: [ { id: eab9b8dd-cf17-479f-b31c-876f2280a6f0, revision: 3 }, { id: 954bbd73-9d90-4632-966f-870867f23a9c, revision: 1 } ] }, { item_index: 2, item_key: source:6e6129ab-f66f-41e9-9929-ac233960a65a, verdict: covered, explanation: "REV-001 preserves the actual follow-up and its question context: check-state remembers observed author-made Approved across restarts, a later return to Draft invalidates the run, MCP never assigns approval, and changes reverted entirely between observations are explicitly unobservable.", requirement_ids: [ REV-001 ], source_refs: [ { id: 6e6129ab-f66f-41e9-9929-ac233960a65a, revision: 1 } ] }, { item_index: 3, item_key: source:954bbd73-9d90-4632-966f-870867f23a9c, verdict: gap, explanation: "The original Specification section requires preserving original user instructions before transforming them into requirements. SRC-001 requires exact capture, provenance and no repeat question, but does not preserve this explicit ordering; neither SKL-001 nor the remaining text adds it. The original acceptance rule requires cause analysis and agreement on the further approach after two failed repairs of the same cause. VAL-001 requires discussion of the cause and next approach, but does not require agreement before further attempts. Other material source conditions are represented across the twelve requirements and scope prose: exact tools/parser pin, partial amendments, context exclusions, bounded review/versioning, independent active-profile checking, consumer and legacy boundaries, model scenarios and final gates.", counterexample: "An author first derives and writes requirement blocks from the conversation, then records the original message afterwards. Exact wording and links can still satisfy SRC-001, although the source expressly requires source capture before transformation. After a second failed repair, the agent discusses its proposed next approach and immediately starts a third repair without obtaining agreement. VAL-001 permits discussion-only continuation, while the original requires agreement on that further approach.", requirement_ids: [ SRC-001, SRC-002, REQ-001, REQ-002, COV-001, REV-001, REV-002, SKL-001, SKL-002, USE-001, LEG-001, VAL-001 ], source_refs: [ { id: 954bbd73-9d90-4632-966f-870867f23a9c, revision: 1 } ] }, { item_index: 4, item_key: requirement:SRC-001, verdict: gap, explanation: "The original Specification section requires preserving original user instructions before transforming them into requirements. SRC-001 requires exact capture, provenance and no repeat question, but does not preserve this explicit ordering; neither SKL-001 nor the remaining text adds it. This is a lost source-supported temporal condition, not a new product question.", counterexample: "An author first derives and writes requirement blocks from the conversation, then records the original message afterwards. Exact wording and links can still satisfy SRC-001, although the source expressly requires source capture before transformation.", requirement_ids: [ SRC-001, SKL-001 ], source_refs: [ { id: 954bbd73-9d90-4632-966f-870867f23a9c, revision: 1 } ] }, { item_index: 5, item_key: requirement:SRC-002, verdict: covered, explanation: "The source explicitly preserves stable IDs and history, authoritative decision_link_requirements, predecessor/affected-requirement links for edits and surviving unrelated clauses. It also requires uncertainty about authorship to be clarified, contextual classification only for resolved non-behavioral sources with reasons, and no automatic exclusion of limits/prohibitions. SRC-002 faithfully retains each condition and does not require nested IDs.", requirement_ids: [ SRC-002 ], source_refs: [ { id: 954bbd73-9d90-4632-966f-870867f23a9c, revision: 1 } ] }, { item_index: 6, item_key: requirement:REQ-001, verdict: covered, explanation: "The original requires structural Markdown parsing with exactly mdast-util-from-markdown@2.0.3, a ### ID: title definition including nested sections until the next same/higher heading, preserving existing IDs and rejecting duplicate/empty/missing definitions and incidental mentions. REQ-001 matches these boundaries without broadening them.", requirement_ids: [ REQ-001 ], source_refs: [ { id: 954bbd73-9d90-4632-966f-870867f23a9c, revision: 1 } ] }, { item_index: 7, item_key: requirement:REQ-002, verdict: covered, explanation: "The source calls for requirement_list/get with bounded IDs, exact text, positions, decision references and versions, complete continuation of large blocks, and derived reverse links rather than a manual second table. REQ-002 preserves these outputs and continuation fidelity; stale/cross-context rejection is supported by the original deterministic scenarios and path/version safeguards.", requirement_ids: [ REQ-002 ], source_refs: [ { id: 954bbd73-9d90-4632-966f-870867f23a9c, revision: 1 } ] }, { item_index: 8, item_key: requirement:COV-001, verdict: covered, explanation: "COV-001 implements the source's mechanical layer and server-enumerated inventory, preserving detection of omitted sources, unsupported definitions, false/missing links, unanswered questions and disputed context exclusions. The author cannot satisfy coverage by choosing a convenient subset, as expressly required by the source invariants.", requirement_ids: [ COV-001 ], source_refs: [ { id: 954bbd73-9d90-4632-966f-870867f23a9c, revision: 1 } ] }, { item_index: 9, item_key: requirement:REV-001, verdict: covered, explanation: "REV-001 follows the original versioned review section in decisions.yaml, separation from product search, reference/finding storage without a second specification, binding to specification/scope/source inputs and report-write exemption. The source history and partial-amendment invariants justify binding historical inputs too. The only status exemption and observed downgrade checkpoint exactly preserve the follow-up; MCP does not approve.", requirement_ids: [ REV-001 ], source_refs: [ { id: 954bbd73-9d90-4632-966f-870867f23a9c, revision: 1 }, { id: 6e6129ab-f66f-41e9-9929-ac233960a65a, revision: 1 } ] }, { item_index: 10, item_key: requirement:REV-002, verdict: covered, explanation: "The source names all four review scenario operations and check-state outcomes, full originals/question context, evidence or concrete findings, no successful incomplete/stale/gapped run, typed generated contracts, no universal YAML editing, bounded atomic/path-safe retry behavior and no MCP model launch/approval. REV-002 retains these. Resuming an unchanged partial run is consistent with restart/retry recovery; no per-item reuse after changed inputs preserves the explicit first-version boundary.", requirement_ids: [ REV-002 ], source_refs: [ { id: 954bbd73-9d90-4632-966f-870867f23a9c, revision: 1 } ] }, { item_index: 11, item_key: requirement:SKL-001, verdict: covered, explanation: "SKL-001 matches the original separate checker at every depth, short Lite review, targeted reference, full unprimed original evidence, only active-profile rules, counterexamples, unsupported requirements and disputed context exclusions. It preserves author/checker ownership, restoration of unambiguous omissions, genuinely new user questions and incomplete status when an independent context is unavailable.", requirement_ids: [ SKL-001 ], source_refs: [ { id: 954bbd73-9d90-4632-966f-870867f23a9c, revision: 1 } ] }, { item_index: 12, item_key: requirement:SKL-002, verdict: covered, explanation: "The source retains automatic Approved after successful checks without another approval question, separate explicit specification/planning/design/incremental invocations, no new skill, concise entrypoints with selective references, generated matching host templates and advisory model choice. SKL-002 preserves these boundaries.", requirement_ids: [ SKL-002 ], source_refs: [ { id: 954bbd73-9d90-4632-966f-870867f23a9c, revision: 1 } ] }, { item_index: 13, item_key: requirement:USE-001, verdict: covered, explanation: "USE-001 retains the source's planning review freshness/read/reference handoff, incremental version checks before work and completion, only linked requirements/contracts, and return of stale/incomplete work to the specification owner. It preserves test-first, one authorized packet, checklist/handoff, optional review/commit and the explicit ban on adding packet/test execution bookkeeping to MCP.", requirement_ids: [ USE-001 ], source_refs: [ { id: 954bbd73-9d90-4632-966f-870867f23a9c, revision: 1 } ] }, { item_index: 14, item_key: requirement:LEG-001, verdict: covered, explanation: "LEG-001 preserves the source's explicit unverified legacy state without automatic migration or blocking, continued legacy checks/public operations, and mandatory new cycle when specification is created or changed through the new workflow. It does not mislabel legacy or unavailable evidence as new assurance.", requirement_ids: [ LEG-001 ], source_refs: [ { id: 954bbd73-9d90-4632-966f-870867f23a9c, revision: 1 } ] }, { item_index: 15, item_key: requirement:VAL-001, verdict: gap, explanation: "The original acceptance rule requires cause analysis and agreement on the further approach after two failed repairs of the same cause. VAL-001 requires discussion of the cause and next approach, but does not require agreement before further attempts. The remaining specified qualification scenarios, two successive focused passes without skill changes, isolation from normal tests/CI, final gates and explicit unavailable evidence are source-supported. The lost agreement requirement is material because it determines whether another repair may begin.", counterexample: "After a second failed repair, the agent discusses its proposed next approach and immediately starts a third repair without obtaining agreement. VAL-001 permits discussion-only continuation, while the original requires agreement on that further approach.", requirement_ids: [ VAL-001 ], source_refs: [ { id: 954bbd73-9d90-4632-966f-870867f23a9c, revision: 1 } ] }, { item_index: 16, item_key: profile:core, verdict: gap, explanation: "The active core reference requires relevant invocation/lifecycle ordering and failure behavior. Interfaces, generation, exact source/requirement handling and legacy/freshness boundaries are otherwise covered. Two already-agreed workflow conditions remain missing: source capture before requirement transformation, and agreement on the next approach after two failed repairs. These are source-derived gaps rather than additional profile features.", counterexample: "An author first derives and writes requirement blocks from the conversation, then records the original message afterwards. Exact wording and links can still satisfy SRC-001, although the source expressly requires source capture before transformation. After a second failed repair, the agent discusses its proposed next approach and immediately starts a third repair without obtaining agreement. VAL-001 permits discussion-only continuation, while the original requires agreement on that further approach.", requirement_ids: [ SRC-001, VAL-001, SKL-001, SKL-002 ], source_refs: [ { id: 954bbd73-9d90-4632-966f-870867f23a9c, revision: 1 } ] }, { item_index: 17, item_key: profile:backend, verdict: covered, explanation: "For the existing local stdio MCP boundary, SRC-001/002 and REQ-001/002 define source/definition inputs, validation, exact bounded outputs and continuations. REV-001/002 define state effects, errors preventing completion, version binding, atomic/path-safe writes, retries and restart recovery; LEG-001 covers existing consumers. The context preserves current transport/runtime and trust boundaries. No network authentication, deployment, rate-limited service or new asynchronous transport is in confirmed scope, so these profile lenses create no further material question.", requirement_ids: [ SRC-001, SRC-002, REQ-001, REQ-002, REV-001, REV-002, LEG-001 ], source_refs: [ { id: 954bbd73-9d90-4632-966f-870867f23a9c, revision: 1 }, { id: scope.manifest, revision: 3 } ] }, { item_index: 18, item_key: profile:data, verdict: covered, explanation: "The durable-data scope is existing decisions.yaml with stable source identity, append-only revisions and typed review metadata. SRC-001/002 protect exact non-sensitive provenance and partial amendments; REV-001/002 define version/currentness invariants, atomic writes, retries and restart/partial-run recovery without a second specification copy. LEG-001 prevents automatic legacy migration and preserves compatibility. No new retention/deletion/export or destructive migration is introduced; existing protections remain in force. No additional material data scenario follows from the confirmed scope.", requirement_ids: [ SRC-001, SRC-002, REV-001, REV-002, LEG-001 ], source_refs: [ { id: 954bbd73-9d90-4632-966f-870867f23a9c, revision: 1 }, { id: scope.manifest, revision: 3 } ] }, { item_index: 19, item_key: context:specification, verdict: covered, explanation: "Non-requirement prose matches confirmed Standard core/backend/data scope and the original local implementation boundaries. It preserves runtime/host contracts and explicitly excludes global installation/configuration, publication, commit and live Claude/Penpot work, and requires usable workflow MCP for protected YAML. Bootstrap adoption and evidence locations describe this bundle's authoring context, not an additional product feature or permission. Draft status makes no unsupported approval claim. The prose does not repair the two separately recorded requirement gaps or add a conflicting promise.", requirement_ids: [ REV-002, SKL-002, USE-001, LEG-001, VAL-001 ], source_refs: [ { id: 954bbd73-9d90-4632-966f-870867f23a9c, revision: 1 }, { id: scope.manifest, revision: 3 } ] } ]
