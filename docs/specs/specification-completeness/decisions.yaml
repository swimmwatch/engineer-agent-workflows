  - category: implementation-request
    state: instructed
    provenance: user
    instruction:
      text: |-
        PLEASE IMPLEMENT THIS PLAN:
        # Контроль полноты спецификации: MCP и скиллы

        ## 1. Результат и зафиксированные границы

        Реализовать три взаимодополняющих проверки:

        - **Механическое покрытие:** все актуальные источники учтены, ссылки корректны.
        - **Сохранность смысла:** отдельный проверяющий сопоставляет исходные указания и требования, обнаруживает потерянные условия.
        - **Профильная полнота:** проверяются существенные сценарии активных профилей, которые могли вообще не обсуждаться.

        Согласованные решения:

        - Охватываем исходный запрос, последующие указания, ответы и известные пользовательские правки.
        - Требования остаются в редактируемом Markdown; каждое получает отдельный заголовок с ID.
        - Проверяющий работает в отдельном контексте на любой глубине; Lite получает короткую проверку.
        - Результаты проверки хранятся через MCP в существующем `decisions.yaml`, без отдельного обязательного файла.
        - Planning и incremental проверяют актуальность спецификации и используют точные ссылки. Реестр исполнения пакетов и тестов в MCP не добавляем.
        - Старые спецификации остаются явно непроверенными по новому правилу, но не блокируются автоматически. Новый порядок обязателен при их создании или изменении.

        Новый скилл не создаём. Автоматический `Approved`, отдельные вызовы planning/design-planning/incremental и отсутствие обязательного код-ревью в incremental сохраняются.

        ## 2. Чекпоинт 1 — источники, определения требований и механическое покрытие в MCP

        **Сначала проверки:** зафиксировать существующий сбой и добавить тесты на непокрытое решение и ложную ссылку, когда ID встречается только в примере или обычном тексте.

        ### Источники и связи

        - Сохранить существующие decision ID, историю ревизий и `decision_link_requirements` как авторитетное место связи решений с требованиями.
        - Добавить `decision_record_instruction` для дословной фиксации несекретного пользовательского запроса или последующего указания с указанием источника. Не подменять его фактом из репозитория и не задавать пользователю повторный вопрос ради сохранения.
        - Известные пользовательские правки фиксировать новой записью со ссылками на затронутые требования и предшествующие решения. Частичная правка не отменяет весь широкий ответ.
        - При неизвестном происхождении изменения не приписывать его пользователю автоматически; существенное расхождение требует уточнения.
        - Добавить `decision_mark_context` для разрешённого решения, которое не задаёт поведение приложения. Требовать объяснение; исключения из функциональности, ограничения и запреты не считать автоматически «просто контекстом».
        - Не вводить обязательные вложенные decision ID. Одно решение может поддерживать несколько отдельно проверяемых требований.

        ### Разметка и чтение требований

        - Для новых и изменяемых спецификаций закрепить блок `### <ID>: <title>`. Блок включает вложенные подразделы и заканчивается следующим заголовком того же или более высокого уровня. Существующие ID не переименовывать.
        - Разбирать Markdown через закреплённый `mdast-util-from-markdown@2.0.3`, а не искать определения регулярным выражением по всему файлу. [Документация парсера](https://github.com/syntax-tree/mdast-util-from-markdown).
        - Добавить `requirement_list` и `requirement_get`: ограниченная выдача ID, точного текста, положения в документе, связанных decision refs и версии источника. Большие блоки выдавать полностью через продолжения, без пересказа.
        - Отклонять повторные определения, пустые блоки и ссылки на отсутствующие определения. Упоминание ID в коде, цитате или обычном предложении не является определением.
        - Обратные связи и отчёты вычислять из журнала. Не создавать вторую вручную поддерживаемую таблицу связей в спецификации.

        **Выход чекпоинта:** unit- и stdio E2E-тесты подтверждают определения, ссылки, контекстные решения и совместимость прежних операций.

        ## 3. Чекпоинт 2 — сохраняемый протокол проверки полноты в MCP

        Добавить типизированную версионируемую служебную секцию в контракт `decisions.yaml`. Она хранит историю проверок, ссылки и выводы, но не вторую копию спецификации. Служебные записи не должны попадать в поиск продуктовых решений.

        ### Сценарные инструменты

        | Инструмент | Ответственность |
        |---|---|
        | `specification_review_start` | Начать проверку, включить новый порядок для спецификации и зафиксировать версии входов |
        | `specification_review_get` | Выдать очередную ограниченную порцию первоисточников, связанных требований и необходимого контекста |
        | `specification_review_record` | Сохранить структурированные выводы проверяющего по источникам, требованиям и активным профилям |
        | `specification_review_complete` | Проверить полноту зарегистрированных результатов и актуальность входов; завершить запись проверки |
        | `specification_check_state` | Дополнительно вернуть состояние покрытия и проверки: legacy, незавершена, есть замечания, устарела либо зарегистрирована успешно |

        Контракты инструментов описать через существующие Zod-определения и генерацию публичных схем. Не добавлять YAML-пейлоады, произвольные пути полей или универсальные операции редактирования.

        ### Инварианты

        - Перечень проверяемых источников составляет MCP из текущего состояния, а не автор спецификации из выбранного подмножества.
        - Проверяющий получает полный исходный запрос/ответ с контекстом вопроса, а не только авторскую разбивку на условия. Дополнительные требования доступны адресно через MCP.
        - Результат содержит подтверждающие ссылки либо конкретный пропуск/противоречие. Проверяются также требования без обоснованного источника и спорные исключения `context`.
        - Частичная замена условия учитывается вместе с исходным решением и новым указанием; остальные обязательства исходного решения сохраняются.
        - Незавершённые порции, непроверенные источники, незакрытые замечания и устаревшие результаты запрещают успешное завершение новой проверки.
        - Версия проверки зависит от содержания спецификации, подтверждённого scope и актуальных источников. Запись самого отчёта её не инвалидирует. Единственное исключение для текста спецификации — переход строки статуса `Draft → Approved`.
        - В первой версии любое другое изменение входов требует новой проверки. Инкрементальное переиспользование отдельных вердиктов откладываем.
        - Сохранить ограничения размеров, атомарность одиночных записей, защиту путей и восстановление после потерянного ответа. Превышение лимита не приводит к усечению и ложному успеху.
        - MCP регистрирует вывод агента, но не удостоверяет его независимость или смысловую правильность. Он не запускает модели и не присваивает `Approved`.

        **Выход чекпоинта:** E2E проходит через перезапуск MCP, повтор запроса, изменение входов и попытку завершить неполную проверку.

        ## 4. Чекпоинт 3 — доработка скиллов и потребителей

        ### Specification

        - Сохранять исходные пользовательские указания до их преобразования в требования.
        - Писать требования в согласованном формате, связывать с источниками через MCP и устранять механические пробелы.
        - После готовности Draft запускать отдельного проверяющего. Его инструкции вынести в адресный reference; не копировать туда весь основной скилл.
        - Проверяющему передавать первоисточники, текущую спецификацию и только активные профили. Не передавать ожидаемый ответ, подозрения автора или готовое заключение о полноте.
        - Проверять сохранность условий, исключений, ограничений, приоритетов и разрешённых альтернатив. Для замечания требовать конкретный пример поведения, которое неполная спецификация ошибочно разрешает или запрещает.
        - Использовать существующие профильные правила для поиска необсуждённых существенных сценариев. Не добавлять одинаковые большие опросники во все профили.
        - Проверяющий не исправляет спецификацию. Автор устраняет однозначные пропуски по источникам; новые материальные решения уточняет у пользователя.
        - Если отдельный контекст недоступен, оставлять проверку незавершённой и сообщать необходимый следующий шаг. Не заменять её молча самопроверкой.
        - Только после успешного нового цикла и проверки состояния устанавливать `Approved`, без дополнительного вопроса об одобрении.

        ### Planning и incremental

        - Planning проверяет актуальность зарегистрированной проверки, читает точные требования через MCP и фиксирует ссылку на проверенную версию в плановых артефактах.
        - Incremental сверяет версию перед работой и завершением пакета; загружает только связанные требования и контракты.
        - Если новая проверка устарела или незавершена, возвращать затронутую работу владельцу спецификации. Самостоятельно менять продуктовый контракт нельзя.
        - Для legacy-спецификаций сохранять прежние проверки и явно отмечать отсутствие нового подтверждения полноты; не запускать миграцию автоматически.
        - Сохранить test-first, ровно один разрешённый пакет, обновление checklist/handoff и отсутствие обязательного ревью или коммита.

        Обновлять авторитетные исходники и общие reference-файлы, затем генерировать оба клиентских набора. Рекомендации моделей остаются консультативными через существующие host-шаблоны.

        ## 5. Чекпоинт 4 — испытания, генерация и критерии завершения

        После каждого чекпоинта: наблюдаемый RED → минимальная реализация → GREEN → соответствующий stdio E2E. При найденном дефекте сначала закреплять различающую проверку.

        ### Детерминированные сценарии

        - Решение потеряно целиком; ID есть только в примере; дублированное или удалённое определение.
        - Многострочные требования, вложенные заголовки, кодовые блоки, Unicode и продолжения больших ответов.
        - Требование без источника; ошибочное исключение из покрытия; неотвеченный вопрос.
        - Исходный запрос без интервью; добавочное указание; частичная правка широкого решения.
        - Перезапуск, повтор записи, чужой контекст, устаревшая версия, незавершённый отчёт.
        - Изменение спецификации после проверки; переход статуса; legacy-потребитель и включение нового порядка.
        - Большой журнал: ограниченные ответы, полный обход без скрытого усечения.

        ### Модельные сценарии

        Запускать отдельно от `npm test` и CI, в свежих изолированных контекстах:

        - Три известных пропуска: идентификация участника, счётчики повторной обработки, необязательный charset.
        - Намеренно удалить условие, сохранив все ID: механические ссылки могут пройти, содержательная проверка должна обнаружить потерю.
        - Корректная переформулировка: проверяющий не должен требовать дословного совпадения.
        - Новые контрольные примеры Lite и UI/API, включая профильный пробел и корректное `not_applicable`.
        - Частичная пользовательская правка сохраняет остальные обязательства; восстановление продолжает работу без повторного опроса.

        Для принятия изменения нужны два последовательных успешных прохода этого ограниченного набора без изменения скиллов между ними. После двух неудачных исправлений одной причины — разбор причины и согласование дальнейшего подхода. Полную прежнюю матрицу приложений этим не объявляем пройденной.

        Финальные проверки: полный `npm test`, lint, foundation validation, генерация обоих наборов и `generate:check`, ограничения размеров, проверка затронутых Codex-артефактов и `git diff --check`. Обновить документацию MCP, правила скиллов и журнал доказательств; недоступные проверки отметить непроверенными.

        Глобальные установки, конфигурация клиентов, публикация, коммиты и живые Claude/Penpot-прогоны не входят. Для ведения реального specification bundle требуется доступный workflow MCP; его отсутствие нельзя обходить прямым редактированием защищённых YAML.
