schema_version: 1
depth: deep
confirmed: true
rationale:
  - The collection defines 16 workflows, generated artifacts for two hosts, and global lifecycle behavior across three operating systems.
  - Public workflow, catalog, plugin, and lifecycle contracts require compatibility, rollback, security, privacy, and supply-chain evidence.
profiles:
  - id: core
    state: active
    reason: The project owns library, CLI, configuration, skill, and generated-artifact contracts.
  - id: ui
    state: not_applicable
    reason: The project does not define an end-user graphical interface.
  - id: backend
    state: not_applicable
    reason: The project does not expose an application service or network API.
  - id: events
    state: not_applicable
    reason: No asynchronous application event contract is part of this workstream.
  - id: data
    state: not_applicable
    reason: The project has deterministic repository files but no runtime domain-data lifecycle.
  - id: operations
    state: active
    reason: Global installation, replacement, removal, validation, and release behavior are contractual.
  - id: security
    state: active
    reason: Profile isolation, telemetry controls, integrity, permissions, and secret handling are contractual.
  - id: cross-surface
    state: active
    reason: One canonical workflow contract must render equivalently into isolated Codex and Claude Code artifacts.
planning_artifacts:
