      outcome: gaps
      results: [ { item_index: 0, item_key: source:outcome.centralized-source, verdict: covered, explanation: OUT-001 makes engineer-agent-workflows the separate canonical public repository and removes hand-maintained per-project copies; ARCH-001 preserves one authoritative template source., requirement_ids: [ OUT-001, ARCH-001 ], source_refs: [ { id: outcome.centralized-source, revision: 1 } ] }, { item_index: 1, item_key: source:project.identity, verdict: covered, explanation: "OUT-001 identifies the requested repository. The supplied absolute creation path is task context, not a portable installation path to embed; SEC-003 correctly excludes personal paths from shipped artifacts.", requirement_ids: [ OUT-001, SEC-003 ], source_refs: [ { id: project.identity, revision: 1 } ] }, { item_index: 2, item_key: source:compatibility.supported-hosts, verdict: covered, explanation: HOST-001 explicitly names both selected hosts and their common directory-based SKILL.md entry point., requirement_ids: [ HOST-001 ], source_refs: [ { id: compatibility.supported-hosts, revision: 1 } ] }, { item_index: 3, item_key: source:scope.initial-skills, verdict: covered, explanation: "SKILL-001 lists the workflow inventory, while SKILL-002 and SKILL-005 require semantic generalization of all original source workflows, removal of source-project assumptions, and preservation of outcomes, safety and verification. The present 16-entry inventory also includes the separately agreed specification/design ownership evolution.", requirement_ids: [ SKILL-001, SKILL-002, SKILL-005, PLAN-004 ], source_refs: [ { id: scope.initial-skills, revision: 1 } ] }, { item_index: 4, item_key: source:release.versioning-policy, verdict: covered, explanation: REL-001 defines collection-wide MAJOR/MINOR/PATCH semantics and stable releases; SKILL-003 makes names public identities and requires versioning for identity or invocation changes. Revision 2 preserves the original SemVer decision., requirement_ids: [ REL-001, SKILL-003 ], source_refs: [ { id: release.versioning-policy, revision: 2 } ] }, { item_index: 5, item_key: source:operations.managed-lifecycle, verdict: covered, explanation: "TOOL-002 supplies install, replacement via repeat-add, per-agent listing and removal. The revised source explicitly defers managed rollback, matching its final paragraph and SCOPE-001; the superseded custom rollback requirement is not retained.", requirement_ids: [ TOOL-002, SCOPE-001 ], source_refs: [ { id: operations.managed-lifecycle, revision: 2 } ] }, { item_index: 6, item_key: source:observed.agent-skills-core, verdict: covered, explanation: "HOST-001 specifies the shared directory-based SKILL.md contract and ARCH-001 generates host-specific directories from it, matching the recorded observation without requiring hand-edited host variants.", requirement_ids: [ HOST-001, ARCH-001 ], source_refs: [ { id: observed.agent-skills-core, revision: 1 } ] }, { item_index: 7, item_key: source:observed.global-skill-locations, verdict: covered, explanation: "DIST-002 delegates personal installation paths and copied storage to the selected upstream tool, keeps every lifecycle operation global and prohibits direct mutation of a second store. The observation of host path/symlink capability does not require selecting symlinks over the later explicit copy decision.", requirement_ids: [ DIST-002, TOOL-002 ], source_refs: [ { id: observed.global-skill-locations, revision: 1 } ] }, { item_index: 8, item_key: source:observed.host-packaging-difference, verdict: covered, explanation: "ARCH-002 requires separate native bundles, marketplace metadata and host adapters; DIST-006 prohibits foreign manifests, question tools and sidecars. The count inconsistency in DIST-006 is recorded separately and does not erase coverage of this packaging-difference observation.", requirement_ids: [ ARCH-002, DIST-006 ], source_refs: [ { id: observed.host-packaging-difference, revision: 1 } ] }, { item_index: 9, item_key: source:distribution.installation-model, verdict: covered, explanation: "ARCH-001/002 and DIST-001 preserve the chosen generated hybrid model: one canonical template and separate global/native artifacts for each host. The later host-copy decision replaces the original shared-symlink installation mechanism without dropping either distribution surface.", requirement_ids: [ ARCH-001, ARCH-002, DIST-001, TOOL-002 ], source_refs: [ { id: distribution.installation-model, revision: 2 } ] }, { item_index: 10, item_key: source:compatibility.v1-surfaces, verdict: covered, explanation: "HOST-002 names local CLI/IDE, native marketplaces, supported hosted/account/workspace and organization surfaces; ACC-006 requires one hosted and managed configuration per host. Its project-local exclusion follows the later no-project-mutation decision rather than silently promising unsupported hosted installations.", requirement_ids: [ HOST-002, ACC-006, SCOPE-001 ], source_refs: [ { id: compatibility.v1-surfaces, revision: 1 } ] }, { item_index: 11, item_key: source:compatibility.desktop-platforms, verdict: covered, explanation: "HOST-003 and ACC-003 cover Linux, macOS and Windows, native runtime support and isolated before/after project evidence. Later rollback deferral applies consistently; this source does not override that explicit change.", requirement_ids: [ HOST-003, ACC-003, TOOL-002 ], source_refs: [ { id: compatibility.desktop-platforms, revision: 1 } ] }, { item_index: 12, item_key: source:architecture.lifecycle-client, verdict: covered, explanation: TOOL-001 selects the pinned Vercel npx CLI and excludes a wrapper/custom state store. TOOL-002 defines its host-isolated commands; HOST-004 and TOOL-003 preserve Node prerequisites and telemetry opt-out. The superseded Go CLI is explicitly excluded., requirement_ids: [ TOOL-001, TOOL-002, HOST-004, TOOL-003 ], source_refs: [ { id: architecture.lifecycle-client, revision: 2 } ] }, { item_index: 13, item_key: source:architecture.skill-portability, verdict: covered, explanation: "ARCH-001/002 require declared template variables, isolated generated host artifacts and failure on unknown variables or cross-host leakage; ACC-001 supplies generation and leakage checks. They preserve one source rather than mixed runtime branching or independent trees.", requirement_ids: [ ARCH-001, ARCH-002, ACC-001 ], source_refs: [ { id: architecture.skill-portability, revision: 2 } ] }, { item_index: 14, item_key: source:ownership.canonical-source, verdict: covered, explanation: "ARCH-003 makes prompt-mcp initial provenance only and engineer-agent-workflows authoritative after extraction, explicitly excluding bidirectional synchronization and project copying.", requirement_ids: [ ARCH-003 ], source_refs: [ { id: ownership.canonical-source, revision: 1 } ] }, { item_index: 15, item_key: source:operations.update-policy, verdict: covered, explanation: "TOOL-002 requires separate matching-source single-agent global add --copy calls and repeat-add replacement. ACC-002 tests receiving and replacing the correct isolated content, while SCOPE-001 retains the earlier explicit-update-only restriction.", requirement_ids: [ TOOL-002, DIST-002, ACC-002, SCOPE-001 ], source_refs: [ { id: operations.update-policy, revision: 2 } ] }, { item_index: 16, item_key: source:security.release-integrity, verdict: gap, explanation: "Lost agreed integrity condition: the selected source requires authenticating the release and verifying checksums before downloaded skill archives are used. SEC-002 and REL-002 require producing signatures/checksums and DOC-001 documents verification, but no current requirement makes successful verification a prerequisite to installation/replacement or states the denial outcome.", counterexample: "A release publishes a valid signed tag and SHA-256 file, and the documentation explains manual verification, but installation uses an altered downloaded skill archive without checking its signature/checksum first. All production/documentation obligations can be met while the selected verify-before-use condition is violated.", requirement_ids: [ SEC-002, REL-002, DOC-001 ], source_refs: [ { id: security.release-integrity, revision: 1 } ] }, { item_index: 17, item_key: source:compatibility.prompt-mcp-platform-gap, verdict: covered, explanation: "INT-001 extends native questions to specification, planning, refinement and interview, follows callable schemas, forbids entering plan mode solely to ask, checkpoints explicit answers and treats missing/cancelled/failed replies as non-answers. MCP-001 retires Prompt MCP across the collection while SCOPE-001 retains the backend/configuration exclusions.", requirement_ids: [ INT-001, MCP-001, SCOPE-001 ], source_refs: [ { id: compatibility.prompt-mcp-platform-gap, revision: 3 } ] }, { item_index: 18, item_key: source:distribution.repository-access, verdict: covered, explanation: "REL-003 makes GitHub source and releases public under MIT, preserving the selected open distribution rather than private personal or team access.", requirement_ids: [ REL-003 ], source_refs: [ { id: distribution.repository-access, revision: 1 } ] }, { item_index: 19, item_key: source:distribution.license, verdict: covered, explanation: "REL-003 applies the selected MIT license to skill content, references, scripts, generated metadata, tests and documentation; the removed custom CLI is not reintroduced.", requirement_ids: [ REL-003 ], source_refs: [ { id: distribution.license, revision: 1 } ] }, { item_index: 20, item_key: source:distribution.activation-policy, verdict: conflict, explanation: The selected option requires refusing duplicate activation unless explicitly overridden. DIST-003 instead requires only a warning and calls detection a documentation/inspection concern. The later ban on custom lifecycle code does not itself authorize dropping the refusal/override boundary; a documented manual precondition could retain it without a custom installer., counterexample: Host inspection finds the same release already active as a native plugin; the documented global installation merely warns and proceeds without an explicit override. DIST-003 permits this although the selected source requires refusal., requirement_ids: [ DIST-003, TOOL-001 ], source_refs: [ { id: distribution.activation-policy, revision: 1 } ] }, { item_index: 21, item_key: source:compatibility.client-version-policy, verdict: covered, explanation: "HOST-004 records the oldest verified clients and exercised stable versions, while ACC-004 tests current stable discovery and INV-002 requires clear unsupported status when a required activation capability is absent. Reviewed pinned dependency changes preserve reproducibility.", requirement_ids: [ HOST-004, ACC-004, INV-002 ], source_refs: [ { id: compatibility.client-version-policy, revision: 1 } ] }, { item_index: 22, item_key: source:release.channels, verdict: covered, explanation: REL-001 explicitly permits one stable channel; SCOPE-001 excludes preview and rolling-main channels. TOOL-002 uses explicit replacement rather than automatic channel advancement., requirement_ids: [ REL-001, SCOPE-001, TOOL-002 ], source_refs: [ { id: release.channels, revision: 1 } ] }, { item_index: 23, item_key: source:operations.local-version-layout, verdict: covered, explanation: DIST-002 and TOOL-001 delegate installation layout/state to the upstream tool and prohibit a second state store or direct patching. TOOL-002 defines native operations; the revised decision supersedes immutable project-owned version directories., requirement_ids: [ DIST-002, TOOL-001, TOOL-002 ], source_refs: [ { id: operations.local-version-layout, revision: 2 } ] }, { item_index: 24, item_key: source:distribution.installation-granularity, verdict: covered, explanation: DIST-004 supports individual --skill selection and the full collection. The later dependency decision legitimately narrows individual supported installation to standalone workflows; SKILL-004/DIST-005 clearly require a full bundle for dependent workflows., requirement_ids: [ DIST-004, SKILL-004, DIST-005 ], source_refs: [ { id: distribution.installation-granularity, revision: 1 } ] }, { item_index: 25, item_key: source:distribution.skill-dependencies, verdict: covered, explanation: "SKILL-004 establishes standalone specification, planning depending on specification, incremental depending on planning, and separate design planning. MAN-001 authenticates local resources and same-release dependency chains; DIST-005/ACC-002 require full-bundle installation and safe missing-companion failure rather than an invented resolver.", requirement_ids: [ SKILL-004, MAN-001, DIST-005, ACC-002, ACC-008 ], source_refs: [ { id: distribution.skill-dependencies, revision: 3 } ] }, { item_index: 26, item_key: source:distribution.plugin-granularity, verdict: covered, explanation: DIST-006 implements one complete native plugin per host and explicitly excludes per-skill native installation. SCOPE-001 excludes per-skill marketplace plugins; its stale total of 15 is a separate inventory conflict., requirement_ids: [ DIST-006, SCOPE-001 ], source_refs: [ { id: distribution.plugin-granularity, revision: 1 } ] }, { item_index: 27, item_key: source:operations.existing-copy-migration, verdict: covered, explanation: "SCOPE-001 excludes discovery, audit, migration, removal, restoration and modification of consuming-project skills; SEC-001 additionally prohibits recursive discovery and tests project non-mutation. This fully replaces the earlier explicit migration/backup model.", requirement_ids: [ SCOPE-001, SEC-001, TOOL-002 ], source_refs: [ { id: operations.existing-copy-migration, revision: 3 } ] }, { item_index: 28, item_key: source:release.publication-gate, verdict: covered, explanation: "REL-002 requires a maintainer-created signed tag, CI validation/archive/checksum publication and separate authorization; ACC-005 validates release identity and content. CI may not invent or silently advance the version.", requirement_ids: [ REL-002, ACC-005 ], source_refs: [ { id: release.publication-gate, revision: 1 } ] }, { item_index: 29, item_key: source:distribution.import-rights, verdict: covered, explanation: REL-003 preserves MIT and explicitly says no separate clean-room/provenance workflow is required. This reflects the recorded 'Do nothing' decision without asserting a new factual ownership or legal clearance., requirement_ids: [ REL-003 ], source_refs: [ { id: distribution.import-rights, revision: 1 } ] }, { item_index: 30, item_key: source:distribution.public-directory-scope, verdict: covered, explanation: "DIST-007 requires installable Git marketplaces resolving immutable host-specific releases, and explicitly defers vendor-operated directory submission pending a separate decision.", requirement_ids: [ DIST-007 ], source_refs: [ { id: distribution.public-directory-scope, revision: 1 } ] }, { item_index: 31, item_key: source:interface.cli-name, verdict: covered, explanation: TOOL-001 expressly prohibits the repository-named executable and a second installer; TOOL-002 provides the pinned upstream lifecycle contract. The superseded executable-name choice is no longer active., requirement_ids: [ TOOL-001, TOOL-002 ], source_refs: [ { id: interface.cli-name, revision: 2 } ] }, { item_index: 32, item_key: source:interface.install-selection-default, verdict: covered, explanation: "TOOL-002 mandates explicit documented skill/agent/global selection, while TOOL-001 and DIST-004 retain upstream parsing/error semantics. This is the revised native-contract choice, not the superseded custom usage-error implementation.", requirement_ids: [ TOOL-002, TOOL-001, DIST-004 ], source_refs: [ { id: interface.install-selection-default, revision: 2 } ] }, { item_index: 33, item_key: source:distribution.hosting-provider, verdict: covered, explanation: "REL-003 selects public GitHub and REL-002 selects GitHub Actions and GitHub Releases with a human-signed tag, preserving the selected hosting and publication model.", requirement_ids: [ REL-002, REL-003 ], source_refs: [ { id: distribution.hosting-provider, revision: 1 } ] }, { item_index: 34, item_key: source:approval.spec, verdict: covered, explanation: "The approval revision confirms the previous refinement requests rather than erasing them: TOOL-001/SCOPE-001 preserve no custom CLI or project writes; INV-001/TOK-001/002 and SKILL-005 preserve explicit invocation and budgets; MAN-001/002 and PLAN-001 preserve engineering principles and reviewable architecture. The current Draft is an author-owned review stage, not an MCP approval assertion.", requirement_ids: [ OUT-001, TOOL-001, SCOPE-001, INV-001, TOK-001, TOK-002, SKILL-005, MAN-001, MAN-002, PLAN-001 ], source_refs: [ { id: approval.spec, revision: 4 } ] }, { item_index: 35, item_key: source:operations.rollback-support, verdict: covered, explanation: "SCOPE-001 and TOOL-002 explicitly defer managed rollback and experimental lock restore, matching the selected option instead of promising a tagged-reinstall procedure or custom tool.", requirement_ids: [ SCOPE-001, TOOL-002 ], source_refs: [ { id: operations.rollback-support, revision: 1 } ] }, { item_index: 36, item_key: source:observed.skills-cli-contract, verdict: covered, explanation: "TOOL-001/002 retain pinned upstream lifecycle ownership, supported global operations, copy isolation and rollback limits; HOST-004 supplies the recorded Node and package baseline. Later observed copy constraints correctly refine the earlier symlink-or-copy observation.", requirement_ids: [ TOOL-001, TOOL-002, HOST-004 ], source_refs: [ { id: observed.skills-cli-contract, revision: 1 } ] }, { item_index: 37, item_key: source:security.skills-cli-telemetry, verdict: covered, explanation: "TOOL-003 requires DISABLE_TELEMETRY=1 for every normative/CI command, disclosure, no custom metadata and no project telemetry. SEC-003 repeats the opt-out and sensitive-output controls. This remains an explicit recorded agent-default privacy safeguard, not invented user consent.", requirement_ids: [ TOOL-003, SEC-003 ], source_refs: [ { id: security.skills-cli-telemetry, revision: 1 } ] }, { item_index: 38, item_key: source:compatibility.skills-cli-version, verdict: covered, explanation: "HOST-004 and TOOL-001 pin the exact reviewed package, record its npm integrity identity and require reviewed upgrades with compatibility/privacy/installation evidence; neither normative commands nor CI may float to latest.", requirement_ids: [ HOST-004, TOOL-001 ], source_refs: [ { id: compatibility.skills-cli-version, revision: 1 } ] }, { item_index: 39, item_key: source:observed.skill-context-disclosure, verdict: covered, explanation: INV-001 preserves explicit-only controls; TOK-001 distinguishes unavoidable discovery metadata from body activation and TOK-002 restricts body/reference loading to the selected workflow's documented condition., requirement_ids: [ INV-001, TOK-001, TOK-002 ], source_refs: [ { id: observed.skill-context-disclosure, revision: 1 } ] }, { item_index: 40, item_key: source:observed.skills-cli-shared-directory, verdict: covered, explanation: TOOL-002 and ACC-002 encode the revised actual copy-isolation observation and repeat-add replacement. ARCH-001/002 generate the two distinct artifacts; MAN-001 preserves the older observation that repository-root resources must be included as generated local copies., requirement_ids: [ TOOL-002, ACC-002, ARCH-001, ARCH-002, MAN-001 ], source_refs: [ { id: observed.skills-cli-shared-directory, revision: 2 } ] }, { item_index: 41, item_key: source:invocation.explicit-only, verdict: covered, explanation: "INV-001/002 require explicit invocation and enforceable host capability floors, and ACC-004 tests explicit success plus non-activation by matching unqualified prompts. Recommendations do not authorize invoking a second workflow.", requirement_ids: [ INV-001, INV-002, ACC-004 ], source_refs: [ { id: invocation.explicit-only, revision: 1 } ] }, { item_index: 42, item_key: source:quality.skill-refinement-budget, verdict: covered, explanation: SKILL-005 caps descriptions at 240 code points and complete SKILL.md files at 4096 UTF-8 bytes; TOK-001/002 and ACC-007 require full default-budget discovery and selective progressive disclosure with instrumented equivalence/safety evidence. Revision 2 adds identity/discovery linkage without weakening those limits., requirement_ids: [ SKILL-005, SKILL-003, TOK-001, TOK-002, ACC-007 ], source_refs: [ { id: quality.skill-refinement-budget, revision: 2 } ] }, { item_index: 43, item_key: source:quality.engineering-standard, verdict: covered, explanation: "MAN-001/002 provide the one authoritative manual, explicitly list engineering principles and artifact contracts, and subordinate contextual application to repository requirements; ACC-008 tests the contract and guards against mechanical SOLID/speculative abstraction.", requirement_ids: [ MAN-001, MAN-002, ACC-008 ], source_refs: [ { id: quality.engineering-standard, revision: 1 } ] }, { item_index: 44, item_key: source:planning.symbol-level-architecture, verdict: covered, explanation: "PLAN-001 requires material existing/proposed units, files, purposes, contracts, dependency direction and verification before production changes. ACC-009 covers language-appropriate architecture instead of forcing classes and requires revision when repository evidence disproves it.", requirement_ids: [ PLAN-001, ACC-009 ], source_refs: [ { id: planning.symbol-level-architecture, revision: 1 } ] }, { item_index: 45, item_key: source:architecture.engineering-manual-form, verdict: covered, explanation: "MAN-001 establishes root shared authored resources, byte-identical generated skill-local copies, local authentication and no network/embedded fallback. ARCH-001 and TOK-002 keep one authoritative source and selective loading without an extra discovery carrier.", requirement_ids: [ MAN-001, ARCH-001, TOK-002 ], source_refs: [ { id: architecture.engineering-manual-form, revision: 2 } ] }, { item_index: 46, item_key: source:architecture.engineering-manual-layout, verdict: covered, explanation: MAN-001 names the root shared paths and local runtime copies; SKILL-004/DIST-005 retain dependency classification and installation guidance without making specification navigate into or depend on planning., requirement_ids: [ MAN-001, SKILL-004, DIST-005 ], source_refs: [ { id: architecture.engineering-manual-layout, revision: 2 } ] }, { item_index: 47, item_key: source:quality.test-first-verification, verdict: covered, explanation: "TEST-001 and PLAN-002 require a discriminating check, relevant RED, implementation correction rather than weakened checks, proportionate PROVE, and focused/final verification; ACC-009 verifies the packet order.", requirement_ids: [ TEST-001, PLAN-002, ACC-009 ], source_refs: [ { id: quality.test-first-verification, revision: 1 } ] }, { item_index: 48, item_key: source:planning.developer-documentation-threshold, verdict: covered, explanation: "PLAN-002 lists the five usefulness criteria, requires at least two for a separate final documentation packet, and records the decision either way. It places the packet after implementation/end-to-end checks with reader-based acceptance; ACC-009 tests both outcomes.", requirement_ids: [ PLAN-002, DOC-001, ACC-009 ], source_refs: [ { id: planning.developer-documentation-threshold, revision: 1 } ] }, { item_index: 49, item_key: source:planning.developer-documentation-language, verdict: covered, explanation: "PLAN-002 explicitly follows the consuming repository's documentation location, language and style; SKILL-002 preserves host-supplied repository guidance and ACC-009 verifies repository-selected language.", requirement_ids: [ PLAN-002, SKILL-002, ACC-009 ], source_refs: [ { id: planning.developer-documentation-language, revision: 1 } ] }, { item_index: 50, item_key: source:quality.doubt-reviewer-isolation, verdict: covered, explanation: "QUAL-001 and ACC-010 require a fresh native reviewer given only the minimal artifact/contract, independent of desired verdicts, read-only reconciliation, no mandatory external CLI and an explicit stop when a fresh reviewer is unavailable.", requirement_ids: [ QUAL-001, ACC-010 ], source_refs: [ { id: quality.doubt-reviewer-isolation, revision: 1 } ] }, { item_index: 51, item_key: source:guidance.host-supplied-context, verdict: covered, explanation: SKILL-002 directly forbids rereading already supplied project instructions solely to recover context and permits only absent narrower guidance or a guidance file itself in scope; ACC-007 checks context efficiency., requirement_ids: [ SKILL-002, ACC-007 ], source_refs: [ { id: guidance.host-supplied-context, revision: 1 } ] }, { item_index: 52, item_key: source:specification.automatic-approval, verdict: covered, explanation: "INT-001 requires Approved only after decisions, confirmed manifest and final gap review, expressly removes the extra approval question/decision and preserves authoritative direct edits with reconciliation. DOC-001 and ACC-001 retain that ownership and validation.", requirement_ids: [ INT-001, DOC-001, ACC-001 ], source_refs: [ { id: specification.automatic-approval, revision: 1 } ] }, { item_index: 53, item_key: source:workflow.adaptive-pair-scope, verdict: covered, explanation: "SPEC-001 and PLAN-003 evolve the existing named specification/planning pair, preserving scope confirmation and artifact ownership. SKILL-001 retains those names; the later separately authorized design stage is an independent amendment, not an implicit expansion of this adaptive-pair decision.", requirement_ids: [ SPEC-001, PLAN-003, SKILL-001, PLAN-004 ], source_refs: [ { id: workflow.adaptive-pair-scope, revision: 1 } ] }, { item_index: 54, item_key: source:specification.adaptive-depth, verdict: covered, explanation: "SPEC-001 defines the three depths, selects the highest applicable signal, explains a single proposal and requires confirmation; PLAN-003 scales evidence without weakening baseline quality. ACC-001/009 cover all depths.", requirement_ids: [ SPEC-001, PLAN-003, ACC-001, ACC-009 ], source_refs: [ { id: specification.adaptive-depth, revision: 1 } ] }, { item_index: 55, item_key: source:specification.scope-state, verdict: covered, explanation: SPEC-001 separates versioned decision history from the latest explicitly confirmed deterministic manifest and requires renewed confirmation for material scope changes; PLAN-003 consumes that confirmed current view., requirement_ids: [ SPEC-001, PLAN-003 ], source_refs: [ { id: specification.scope-state, revision: 1 } ] }, { item_index: 56, item_key: source:specification.profile-model, verdict: covered, explanation: SPEC-001 enumerates all eight composable profiles and records independent active/not-applicable/needs-user reasons. PLAN-003 covers core and other warranted contracts rather than forcing a UI/backend binary., requirement_ids: [ SPEC-001, PLAN-003 ], source_refs: [ { id: specification.profile-model, revision: 1 } ] }, { item_index: 57, item_key: source:planning.profile-artifact-ownership, verdict: covered, explanation: "SPEC-001 declares exact warranted artifact paths without creating them; PLAN-003 assigns reviewable contract creation to planning, with later UI-001/PLAN-004 separating design planning. Production changes remain separately authorized.", requirement_ids: [ SPEC-001, PLAN-003, UI-001, PLAN-004 ], source_refs: [ { id: planning.profile-artifact-ownership, revision: 1 } ] }, { item_index: 58, item_key: source:planning.scope-precondition, verdict: covered, explanation: "PLAN-003 requires Approved Markdown and confirmed manifest, rejects missing/unresolved/inconsistent input without mutation and returns scope changes to specification; ACC-009 tests the precondition.", requirement_ids: [ PLAN-003, ACC-009 ], source_refs: [ { id: planning.scope-precondition, revision: 1 } ] }, { item_index: 59, item_key: source:planning.lite-output, verdict: covered, explanation: "PLAN-003 and ACC-009 require Lite plan.md, todo.md, current-only handoff.md and exactly one compact numbered packet, with separate profile output only if explicitly declared.", requirement_ids: [ PLAN-003, ACC-009 ], source_refs: [ { id: planning.lite-output, revision: 1 } ] }, { item_index: 60, item_key: source:planning.corrective-packet, verdict: gap, explanation: "Lost agreed current-bundle planning condition: the source selects a new corrective packet while preserving completed Packets 02/03 and their historical execution sequence. SPEC-001/PLAN-003 contain generic scope/artifact rules, and the current manifest lists Packet 13, but no requirement protects the completed packet history against rewriting during the corrective revision.", counterexample: "A corrective planning revision writes a new Packet 13 but also rewrites the completed Packet 02/03 ownership and execution narrative. The manifest permits these listed task files and the generic planning requirements do not preserve their historical content, while the source explicitly forbids that rewrite.", requirement_ids: [ SPEC-001, PLAN-003 ], source_refs: [ { id: planning.corrective-packet, revision: 1 } ] }, { item_index: 61, item_key: source:specification.current-bundle-manifest, verdict: covered, explanation: The server-returned confirmed manifest indexes existing task documents and declares no retrospective core/architecture/quality contracts. SPEC-001 says the artifact registry is conditional and forbids automatic legacy migration; PLAN-003 confines planning to declared artifacts. These preserve this bundle-specific choice., requirement_ids: [ SPEC-001, PLAN-003 ], source_refs: [ { id: specification.current-bundle-manifest, revision: 1 } ] }, { item_index: 62, item_key: source:specification.profile-reference-loading, verdict: gap, explanation: The source and its rationale extend one dedicated reference per active profile to both specification and planning. SPEC-001 states the exact sequencing and one-to-one rule only for spec-driven-development; PLAN-003 has no corresponding planning loading rule. TOK-002 permits a documented optional-reference route but does not prohibit a planning reference from grouping several profiles., counterexample: "After reading a confirmed core-only manifest, planning routes to one detailed file containing core plus inactive backend/security guidance. The file's documented condition is satisfied for core, so TOK-002 does not itself require a dedicated core-only file, but the source's one-file-per-active-profile rule forbids it.", requirement_ids: [ SPEC-001, PLAN-003, TOK-002 ], source_refs: [ { id: specification.profile-reference-loading, revision: 2 } ] }, { item_index: 63, item_key: source:specification.artifact-name-source, verdict: covered, explanation: "SPEC-001 chooses exact paths from compact routing metadata before detailed profile loading, presents them in the single confirmation and loads active references afterward. Its candidate-not-mandatory rule and TOK-002 preserve the intended small pre-profile registry.", requirement_ids: [ SPEC-001, TOK-002 ], source_refs: [ { id: specification.artifact-name-source, revision: 1 } ] }, { item_index: 64, item_key: source:workflow-loop.execution-contract, verdict: covered, explanation: "EXEC-001 requires exactly one authorized packet, current evidence, actual dependencies, no automatic next packet/review, and no review/commit completion gate. TEST-001/PLAN-002 preserve check strength; EVAL-001 specifies fresh contexts and separate reviews while SPEC-001/INT-001 retain active-only scope and automatic approval.", requirement_ids: [ EXEC-001, TEST-001, PLAN-002, EVAL-001, SPEC-001, INT-001 ], source_refs: [ { id: workflow-loop.execution-contract, revision: 1 } ] }, { item_index: 65, item_key: source:workflow-loop.model-roles, verdict: covered, explanation: "EVAL-001 names Sol author/planner/reviewer, Terra executor and Astra escalation for Codex; Opus and Sonnet roles for Claude; host-rendered advisory guidance; and the selected host fixture coverage. Its later Claude deferral explicitly narrows only current trial execution, not generated host support.", requirement_ids: [ EVAL-001, HOST-001, HOST-002, TOK-002 ], source_refs: [ { id: workflow-loop.model-roles, revision: 1 } ] }, { item_index: 66, item_key: source:specification.lite-inline-contract, verdict: covered, explanation: "SPEC-001 explicitly keeps a bounded established Lite contract inline unless machine validation, multiple consumers or an explicit requirement warrants a separate source. PLAN-003 creates no extra Lite profile artifact unless confirmed in the manifest.", requirement_ids: [ SPEC-001, PLAN-003 ], source_refs: [ { id: specification.lite-inline-contract, revision: 1 } ] }, { item_index: 67, item_key: source:workflow-loop.cli-check-environment, verdict: gap, explanation: "Lost agreed fixture acceptance condition: the EPERM workaround is authorized only as equivalent direct CLI checks retaining stdout, stderr and exit assertions with the sandbox preserved. TEST-001/EVAL-001 require objective and discriminating checks generally but do not state this runner substitution or preserve those three specific observable assertions.", counterexample: "Following nested-process EPERM, the campaign counts a direct command exit check plus npm test as sufficient without preserving the required stdout and stderr assertions, or treats those equivalent direct assertions as unavailable solely because the nested runner failed. The source requires the preserved direct CLI boundary.", requirement_ids: [ TEST-001, EVAL-001 ], source_refs: [ { id: workflow-loop.cli-check-environment, revision: 1 } ] }, { item_index: 68, item_key: source:workflow-loop.local-http-scope, verdict: gap, explanation: "Lost agreed trial boundary: local HTTP permission is limited to temporary fixtures while filesystem sandboxing and global client settings remain intact, and unrestricted outbound access is excluded. EVAL-001 only says isolated fixtures; SEC-003 addresses CI permissions/secrets, not these trial network and sandbox boundaries.", counterexample: A temporary HTTP trial enables unrestricted network access or relaxes filesystem sandboxing through invocation settings to run its tests while still using an isolated fixture directory. EVAL-001's isolation wording does not prohibit that configuration; the selected source permits only local HTTP with the existing filesystem sandbox and global settings preserved., requirement_ids: [ EVAL-001, TEST-001, SEC-003 ], source_refs: [ { id: workflow-loop.local-http-scope, revision: 1 } ] }, { item_index: 69, item_key: source:workflow-loop.proportionate-prove, verdict: covered, explanation: "TEST-001 requires PROVE for new/changed absence or structure guarantees and insufficient RED, while unchanged baseline constraints keep ordinary regression checks unless the affected contract needs more proof. PLAN-002 invokes PROVE only when required.", requirement_ids: [ TEST-001, PLAN-002 ], source_refs: [ { id: workflow-loop.proportionate-prove, revision: 1 } ] }, { item_index: 70, item_key: source:workflow-loop.linux-cli-fixture, verdict: gap, explanation: "Lost agreed fixture-specific scope: the selected Linux-only educational CLI fixture still requires a separate real stdout/stderr/exit acceptance check alongside npm test, preserving filesystem sandboxing and leaving product portability unchanged. EVAL-001 names a Lite core fixture but no requirement captures this platform exception and mandatory separate check.", counterexample: "The Linux Lite CLI fixture is marked passed from npm unit tests alone, without the separately required real CLI stdout/stderr/exit acceptance, or its Linux-specific qualification is silently interpreted as reducing product Windows/macOS support. The source explicitly distinguishes those boundaries.", requirement_ids: [ EVAL-001, TEST-001, HOST-003 ], source_refs: [ { id: workflow-loop.linux-cli-fixture, revision: 1 } ] }, { item_index: 71, item_key: source:workflow-loop.specification-state-ownership, verdict: covered, explanation: SPEC-001 explicitly owns spec.md/manifest/decisions recovery and forbids handoff.md before planning; PLAN-003 assigns the handoff to planning. No extra specification recovery file is required., requirement_ids: [ SPEC-001, PLAN-003 ], source_refs: [ { id: workflow-loop.specification-state-ownership, revision: 1 } ] }, { item_index: 72, item_key: source:workflow-loop.browser-provider, verdict: gap, explanation: "The source explicitly selects Cloakbrowser MCP for this fixture campaign and excludes automatic global setup or a new published-skill dependency. EVAL-001 does not identify the selected browser provider or bind a campaign-specific validation reference carrying that choice. This is a lost existing campaign choice, not a proposal to add a universal dependency.", counterexample: The campaign performs all generic browser checks through another browser provider and treats that as satisfying the selected fixture procedure; EVAL-001 never requires the user-selected Cloakbrowser MCP or a bound reference carrying that campaign choice., requirement_ids: [ EVAL-001 ], source_refs: [ { id: workflow-loop.browser-provider, revision: 1 } ] }, { item_index: 73, item_key: source:workflow-loop.git-prerequisite, verdict: covered, explanation: "EXEC-001 requires usable Git and tracked/staged/untracked evidence, blocks non-worktree/bare/unavailable cases, forbids Git initialization or snapshot substitution, and does not require a clean tree or commit. PLAN-002 carries prerequisites in the packet.", requirement_ids: [ EXEC-001, PLAN-002 ], source_refs: [ { id: workflow-loop.git-prerequisite, revision: 1 } ] }, { item_index: 74, item_key: source:workflow-loop.deep-runtime-corruption-control, verdict: gap, explanation: "Lost agreed Deep fixture condition: runtime corruption must change real isolated source state via a closed opt-in test-only process channel before ordinary replay validation, with no public HTTP control. EVAL-001 names Deep and adversarial fixtures but does not define that trigger, privacy boundary or distinction from startup-only corruption.", counterexample: "A Deep fixture validates only corrupted startup state, or exposes a public HTTP corruption endpoint, and still claims its generic adversarial checks passed. The source instead requires opt-in private runtime mutation of real source state before ordinary replay validation.", requirement_ids: [ EVAL-001 ], source_refs: [ { id: workflow-loop.deep-runtime-corruption-control, revision: 1 } ] }, { item_index: 75, item_key: source:workflow-loop.ui-zoom-sequencing, verdict: gap, explanation: "The source preserves a real 200-percent browser-zoom acceptance requirement, permits continuing other work with that check explicitly unverified, and rejects emulated substitutes or full-matrix credit. EVAL-001 has general incomplete-evidence rules but never states the real-zoom criterion or identifies an authoritative frozen contract containing it.", counterexample: "A UI trial substitutes CSS scaling or viewport emulation for actual 200-percent browser zoom and awards complete matrix credit. EVAL-001 does not name the real-zoom criterion, although the source explicitly retains it and rejects an emulated substitute.", requirement_ids: [ EVAL-001 ], source_refs: [ { id: workflow-loop.ui-zoom-sequencing, revision: 1 } ] }, { item_index: 76, item_key: source:workflow-loop.yaml-checkpoint-validation, verdict: covered, explanation: "STATE-001 requires real saved-YAML parsing, matching schemas and cross-file verification, with missing validators leaving state unverified. MCP-002 requires MCP journal validation/read-back and real parsing for other YAML; INT-001 requires a passed final gap review before approval. No switch to JSON syntax or automatic installation is authorized.", requirement_ids: [ STATE-001, MCP-002, INT-001, TEST-001 ], source_refs: [ { id: workflow-loop.yaml-checkpoint-validation, revision: 1 } ] }, { item_index: 77, item_key: source:workflow-loop.large-decision-ledger-access, verdict: covered, explanation: "MCP-002 and the available Approved decision-ledger-mcp specification provide mandatory bounded MCP discovery, validation, search and exact retrieval; unavailable/incompatible service blocks journal work without shell/full-file/local-reader fallback. The package remains separate with no automatic installation/configuration/publication.", requirement_ids: [ MCP-002, SKILL-004, STATE-001 ], source_refs: [ { id: workflow-loop.large-decision-ledger-access, revision: 2 } ] }, { item_index: 78, item_key: source:workflow-loop.claude-deferral, verdict: covered, explanation: "EVAL-001 explicitly defers native Claude trials, continues only the then-authorized Codex campaign, retains both generated artifacts and labels deferred Claude evidence unverified. The request for percentage updates is a conversational reporting preference rather than a product behavior; the later budget checkpoint changes campaign scope separately.", requirement_ids: [ EVAL-001 ], source_refs: [ { id: workflow-loop.claude-deferral, revision: 1 } ] }, { item_index: 79, item_key: source:workflow-loop.budget-checkpoint, verdict: conflict, explanation: "The latest recorded budget checkpoint orders bounded local corrections only, preserves existing results and stops new model launches while deferring full-matrix/new Terra/UI/holdout/Claude runs. EVAL-001 instead says current campaign must complete the Codex matrix, stable repetitions and fresh holdouts; it records only the earlier Claude deferral and omits this later scope reduction.", counterexample: "An executor follows EVAL-001's current-campaign paragraph by launching a new Terra/UI or fresh holdout run to finish the matrix after the recorded budget checkpoint, consuming the reserve the latest source required preserving.", requirement_ids: [ EVAL-001 ], source_refs: [ { id: workflow-loop.budget-checkpoint, revision: 1 } ] }, { item_index: 80, item_key: source:workflow-loop.reader-available-local-validation, verdict: covered, explanation: "MCP-002 already prohibits local journal inspection as a fallback and STATE-001 requires MCP reads/validation. EVAL-001 requires actual traces, invalidates unrelated-source/history evidence and resets stable-pass credit after correction, so the observed failed trace and unqualified guidance correction cannot count as a new native pass.", requirement_ids: [ MCP-002, STATE-001, EVAL-001 ], source_refs: [ { id: workflow-loop.reader-available-local-validation, revision: 1 } ] }, { item_index: 81, item_key: source:ui.penpot-project-design, verdict: covered, explanation: "UI-001 makes Penpot the editable source with verified root-design library/screens snapshots, actual component/library linkage, relevant-only reads and shared-impact handling. It preserves conditional declared design scope, human edits, export evidence, missing capability limits and separate remote authority.", requirement_ids: [ UI-001, PLAN-004 ], source_refs: [ { id: ui.penpot-project-design, revision: 1 } ] }, { item_index: 82, item_key: source:ui.separate-design-planning, verdict: covered, explanation: "PLAN-004 creates the separately invoked stage after main planning, derives eligibility from active UI and declared outputs including new designs, stops main planning with dependent packets pending, reuses separately installed Penpot skills and skips absent design scope before loading those instructions.", requirement_ids: [ PLAN-004, UI-001 ], source_refs: [ { id: ui.separate-design-planning, revision: 1 } ] }, { item_index: 83, item_key: source:state.four-yaml-contracts, verdict: covered, explanation: "STATE-001 names the four shared Draft-7 workflow schemas, generated copies, contextual loading, real YAML/schema/cross-file validation and unchanged API/event/data formats. It retains legacy compatibility, MCP journal ownership and no automatic installation/migration.", requirement_ids: [ STATE-001 ], source_refs: [ { id: state.four-yaml-contracts, revision: 1 } ] }, { item_index: 84, item_key: source:0122a67c-c0d9-4813-859b-fddba7a07a6b, verdict: covered, explanation: "The follow-up approves only alignment with already declared-design eligibility. UI-001 now explicitly says active UI alone is insufficient, keeps behavior/acceptance in spec.md when no designs are declared, and requires scope reconciliation if a material design need emerges. PLAN-004 uses the same boundary.", requirement_ids: [ UI-001, PLAN-004 ], source_refs: [ { id: 0122a67c-c0d9-4813-859b-fddba7a07a6b, revision: 1 } ] }, { item_index: 85, item_key: requirement:OUT-001, verdict: covered, explanation: "OUT-001's canonical/public/source ownership is supported by centralized-source and project identity; its compound distribution, budget, release and no-project-write outcomes are corroborated by installation-model, v1-surfaces, refinement-budget, release-integrity, license and no-migration decisions. It adds no second installation owner.", requirement_ids: [ OUT-001 ], source_refs: [ { id: outcome.centralized-source, revision: 1 }, { id: project.identity, revision: 1 }, { id: approval.spec, revision: 4 }, { id: distribution.installation-model, revision: 2 }, { id: compatibility.v1-surfaces, revision: 1 }, { id: quality.skill-refinement-budget, revision: 2 }, { id: security.release-integrity, revision: 1 }, { id: distribution.license, revision: 1 }, { id: operations.existing-copy-migration, revision: 3 } ] }, { item_index: 86, item_key: requirement:SCOPE-001, verdict: covered, explanation: "SCOPE-001 reflects explicit later withdrawals of custom lifecycle code, project-local work, rollback, automatic updates, implicit invocation, preview channels, hand-edited host forks and vendor submission. The retired Prompt MCP and separate release gates are supported by their specific decisions, not inferred from the two narrow linked sources alone.", requirement_ids: [ SCOPE-001 ], source_refs: [ { id: operations.existing-copy-migration, revision: 3 }, { id: operations.rollback-support, revision: 1 }, { id: architecture.lifecycle-client, revision: 2 }, { id: operations.update-policy, revision: 2 }, { id: invocation.explicit-only, revision: 1 }, { id: release.channels, revision: 1 }, { id: architecture.skill-portability, revision: 2 }, { id: distribution.plugin-granularity, revision: 1 }, { id: distribution.public-directory-scope, revision: 1 }, { id: compatibility.prompt-mcp-platform-gap, revision: 3 }, { id: release.publication-gate, revision: 1 } ] }, { item_index: 87, item_key: requirement:SKILL-001, verdict: covered, explanation: "The 16 named workflows and focused outcomes are supported by the source inventory and subsequent workflow decisions, including ui.separate-design-planning; the current confirmed manifest explicitly says 16. The conflicting 15-only bundle/activation/acceptance wording is recorded on those requirements rather than rejecting this enumerated inventory.", requirement_ids: [ SKILL-001, PLAN-004 ], source_refs: [ { id: scope.initial-skills, revision: 1 }, { id: workflow.adaptive-pair-scope, revision: 1 }, { id: ui.separate-design-planning, revision: 1 } ] }, { item_index: 88, item_key: requirement:SKILL-002, verdict: covered, explanation: The generalization decision justifies repository-discovered facts and removal of fixed source assumptions; host-supplied-context explicitly justifies reusing active guidance and reading only additional absent scoped instructions or a guidance file in scope., requirement_ids: [ SKILL-002 ], source_refs: [ { id: scope.initial-skills, revision: 1 }, { id: guidance.host-supplied-context, revision: 1 } ] }, { item_index: 89, item_key: requirement:SKILL-003, verdict: covered, explanation: The SemVer decision supports stable public names and breaking renames; refinement-budget and explicit-invocation decisions support concise discriminating discovery summaries and user-visible invocation changes. The at-least-MINOR rule does not override REL-001's stronger MAJOR rule for incompatible changes., requirement_ids: [ SKILL-003, REL-001 ], source_refs: [ { id: release.versioning-policy, revision: 2 }, { id: quality.skill-refinement-budget, revision: 2 }, { id: invocation.explicit-only, revision: 1 } ] }, { item_index: 90, item_key: requirement:SKILL-004, verdict: covered, explanation: "The revised dependency decision supports standalone specification, planning-to-specification and incremental-to-planning; the separate design-planning decision supports its companion dependency. The original full-bundle choice and generated-resource decisions support safe missing-companion stops and same-release resources, while MCP-only access remains an external prerequisite.", requirement_ids: [ SKILL-004, MAN-001, MCP-002 ], source_refs: [ { id: distribution.skill-dependencies, revision: 3 }, { id: architecture.engineering-manual-layout, revision: 2 }, { id: ui.separate-design-planning, revision: 1 }, { id: workflow-loop.large-decision-ledger-access, revision: 2 } ] }, { item_index: 91, item_key: requirement:SKILL-005, verdict: covered, explanation: "Initial extraction and the strict-refinement budget source justify outcome/safety preservation, removal of prompt-mcp-specific assumptions, unconditional entrypoint instructions, conditionally loaded references and exact 240-code-point/4096-byte limits. The 15 figure refers to historical source extraction rather than limiting the current inventory.", requirement_ids: [ SKILL-005 ], source_refs: [ { id: scope.initial-skills, revision: 1 }, { id: quality.skill-refinement-budget, revision: 2 }, { id: specification.automatic-approval, revision: 1 }, { id: workflow.adaptive-pair-scope, revision: 1 } ] }, { item_index: 92, item_key: requirement:SPEC-001, verdict: covered, explanation: "Adaptive-depth/profile/state decisions justify evidence-first highest-depth proposal, one explicit confirmation, append-only scope history and deterministic manifest. Profile-reference and artifact-registry decisions justify confirmation-first dedicated loading; state-ownership and Lite-inline decisions justify no specification handoff or mandatory extra artifact. UI path constraints are grounded in the later design scope.", requirement_ids: [ SPEC-001, UI-001 ], source_refs: [ { id: workflow.adaptive-pair-scope, revision: 1 }, { id: specification.adaptive-depth, revision: 1 }, { id: specification.scope-state, revision: 1 }, { id: specification.profile-model, revision: 1 }, { id: planning.profile-artifact-ownership, revision: 1 }, { id: planning.corrective-packet, revision: 1 }, { id: specification.current-bundle-manifest, revision: 1 }, { id: specification.profile-reference-loading, revision: 2 }, { id: specification.artifact-name-source, revision: 1 }, { id: workflow-loop.execution-contract, revision: 1 }, { id: specification.lite-inline-contract, revision: 1 }, { id: workflow-loop.specification-state-ownership, revision: 1 }, { id: workflow-loop.yaml-checkpoint-validation, revision: 1 }, { id: workflow-loop.large-decision-ledger-access, revision: 2 }, { id: ui.penpot-project-design, revision: 1 }, { id: state.four-yaml-contracts, revision: 1 } ] }, { item_index: 93, item_key: requirement:MAN-001, verdict: covered, explanation: "Engineering-manual-form/layout revisions justify one root authored manual/verifier and generated authenticated local copies, superseding planning-owned shared files. Dependency-direction and quality sources justify checking the same-release chain without making specification depend on planning or downloading substitutes.", requirement_ids: [ MAN-001 ], source_refs: [ { id: distribution.skill-dependencies, revision: 3 }, { id: quality.engineering-standard, revision: 1 }, { id: architecture.engineering-manual-form, revision: 2 }, { id: architecture.engineering-manual-layout, revision: 2 } ] }, { item_index: 94, item_key: requirement:MAN-002, verdict: covered, explanation: "The explicit senior-engineering standard and approval predecessor request list the principles and reviewable artifact obligations. MAN-002 applies them contextually with repository contracts above generic principles, avoiding stronger mandatory-pattern rules.", requirement_ids: [ MAN-002 ], source_refs: [ { id: quality.engineering-standard, revision: 1 } ] }, { item_index: 95, item_key: requirement:TEST-001, verdict: covered, explanation: "The test-first source justifies relevant RED, correct-check preservation and PROVE; proportionate-prove explicitly limits extra mutations for unchanged baselines. The manual/layout sources support one authenticated local discipline reference. Missing concrete trial runner/sandbox conditions are separately recorded on their source items.", requirement_ids: [ TEST-001 ], source_refs: [ { id: quality.test-first-verification, revision: 1 }, { id: workflow-loop.execution-contract, revision: 1 }, { id: workflow-loop.cli-check-environment, revision: 1 }, { id: workflow-loop.local-http-scope, revision: 1 }, { id: workflow-loop.proportionate-prove, revision: 1 }, { id: workflow-loop.linux-cli-fixture, revision: 1 }, { id: workflow-loop.yaml-checkpoint-validation, revision: 1 }, { id: architecture.engineering-manual-form, revision: 2 } ] }, { item_index: 96, item_key: requirement:PLAN-001, verdict: covered, explanation: "Symbol-level-architecture and the approval predecessor justify existing/proposed units, purpose, contracts, dependencies and verification before production edits. The later execution-contract source supports incremental validating an existing plan rather than rerunning the whole planning stage.", requirement_ids: [ PLAN-001 ], source_refs: [ { id: planning.symbol-level-architecture, revision: 1 }, { id: workflow-loop.execution-contract, revision: 1 } ] }, { item_index: 97, item_key: requirement:PLAN-002, verdict: covered, explanation: "Test-first and documentation threshold/language decisions support ordered checks, readiness, independent packet inputs, conditional final documentation and repository locale. Execution/git decisions support concrete dependencies without review/commit gates; no unapproved production action is introduced.", requirement_ids: [ PLAN-002 ], source_refs: [ { id: quality.test-first-verification, revision: 1 }, { id: planning.developer-documentation-threshold, revision: 1 }, { id: planning.developer-documentation-language, revision: 1 }, { id: workflow-loop.execution-contract, revision: 1 }, { id: workflow-loop.model-roles, revision: 1 }, { id: workflow-loop.proportionate-prove, revision: 1 }, { id: workflow-loop.specification-state-ownership, revision: 1 }, { id: workflow-loop.git-prerequisite, revision: 1 }, { id: workflow-loop.yaml-checkpoint-validation, revision: 1 }, { id: workflow-loop.large-decision-ledger-access, revision: 2 } ] }, { item_index: 98, item_key: requirement:PLAN-003, verdict: covered, explanation: Adaptive pair/depth/profile sources support deterministic warranted profile planning and approved/confirmed prerequisites; scope-precondition/Lite-output/inline-contract sources justify stopping on inconsistency and the one-packet Lite minimum. UI-001/PLAN-004 resolve design ownership to its separately invoked stage., requirement_ids: [ PLAN-003, PLAN-004 ], source_refs: [ { id: workflow.adaptive-pair-scope, revision: 1 }, { id: specification.adaptive-depth, revision: 1 }, { id: specification.scope-state, revision: 1 }, { id: specification.profile-model, revision: 1 }, { id: planning.profile-artifact-ownership, revision: 1 }, { id: planning.scope-precondition, revision: 1 }, { id: planning.lite-output, revision: 1 }, { id: planning.corrective-packet, revision: 1 }, { id: specification.current-bundle-manifest, revision: 1 }, { id: specification.lite-inline-contract, revision: 1 }, { id: ui.separate-design-planning, revision: 1 }, { id: ui.penpot-project-design, revision: 1 } ] }, { item_index: 99, item_key: requirement:UI-001, verdict: covered, explanation: "Penpot-project-design and separate-design-planning sources authorize shared linked component/screens design with verified Git snapshots. The exact follow-up instruction explicitly approves declared-design eligibility, so UI-001's no-design skip and later scope reconciliation are faithful and do not erase UI behavior or accessibility acceptance.", requirement_ids: [ UI-001 ], source_refs: [ { id: ui.penpot-project-design, revision: 1 }, { id: ui.separate-design-planning, revision: 1 }, { id: 0122a67c-c0d9-4813-859b-fddba7a07a6b, revision: 1 } ] }, { item_index: 100, item_key: requirement:PLAN-004, verdict: covered, explanation: "The separate-design-planning decision directly supports an explicit manifest-driven stage after main planning and reuse of separately installed Penpot capabilities. Requiring declared outputs, preserving pending dependencies and stopping without production/next-stage work follows that ownership boundary.", requirement_ids: [ PLAN-004 ], source_refs: [ { id: ui.separate-design-planning, revision: 1 } ] }, { item_index: 101, item_key: requirement:STATE-001, verdict: covered, explanation: The four-contract decision names exactly these workflow files and preserves other profiles' formats. YAML-checkpoint and MCP-only decisions support real syntax/schema validation and MCP journal access; missing validators and legacy compatibility preserve explicit non-migration and no-installation boundaries., requirement_ids: [ STATE-001 ], source_refs: [ { id: state.four-yaml-contracts, revision: 1 }, { id: workflow-loop.yaml-checkpoint-validation, revision: 1 }, { id: workflow-loop.large-decision-ledger-access, revision: 2 } ] }, { item_index: 102, item_key: requirement:EXEC-001, verdict: covered, explanation: "Git-prerequisite supplies the worktree/change-evidence gate and rejects snapshot substitution without requiring a commit. Execution-contract independently supplies one authorized packet, no mandatory review/commit and no automatic next step; test-first and state decisions justify incomplete status for failed checks and owner-directed recovery.", requirement_ids: [ EXEC-001 ], source_refs: [ { id: workflow-loop.git-prerequisite, revision: 1 }, { id: workflow-loop.yaml-checkpoint-validation, revision: 1 }, { id: workflow-loop.large-decision-ledger-access, revision: 2 }, { id: workflow-loop.execution-contract, revision: 1 }, { id: quality.test-first-verification, revision: 1 } ] }, { item_index: 103, item_key: requirement:EVAL-001, verdict: conflict, explanation: "EVAL-001's current-campaign instruction to complete the Codex matrix, stable repetitions and fresh holdouts contradicts the later budget-checkpoint source, which stops new model launches and defers those runs. It also lacks the concrete direct-CLI, local-HTTP, chosen-browser, runtime-corruption and real-zoom campaign conditions recorded on source items 67/68/70/72/74/75.", counterexample: "A campaign launches new full-matrix, Terra/UI and fresh holdout trials because EVAL-001 calls them current required work, despite the later budget-checkpoint source explicitly deferring them and stopping new model launches.", requirement_ids: [ EVAL-001 ], source_refs: [ { id: workflow-loop.cli-check-environment, revision: 1 }, { id: workflow-loop.local-http-scope, revision: 1 }, { id: workflow-loop.proportionate-prove, revision: 1 }, { id: workflow-loop.linux-cli-fixture, revision: 1 }, { id: workflow-loop.specification-state-ownership, revision: 1 }, { id: workflow-loop.browser-provider, revision: 1 }, { id: workflow-loop.git-prerequisite, revision: 1 }, { id: workflow-loop.deep-runtime-corruption-control, revision: 1 }, { id: workflow-loop.ui-zoom-sequencing, revision: 1 }, { id: workflow-loop.yaml-checkpoint-validation, revision: 1 }, { id: workflow-loop.large-decision-ledger-access, revision: 2 }, { id: workflow-loop.claude-deferral, revision: 1 }, { id: workflow-loop.budget-checkpoint, revision: 1 }, { id: workflow-loop.reader-available-local-validation, revision: 1 }, { id: workflow-loop.model-roles, revision: 1 }, { id: workflow-loop.execution-contract, revision: 1 } ] }, { item_index: 104, item_key: requirement:QUAL-001, verdict: covered, explanation: "Doubt-reviewer-isolation explicitly chooses a fresh host-native subagent instead of same-context self-review or a mandatory external CLI. The read-only reconciliation, minimal independent input and honest unavailable-reviewer result implement that selection.", requirement_ids: [ QUAL-001 ], source_refs: [ { id: quality.doubt-reviewer-isolation, revision: 1 } ] }, { item_index: 105, item_key: requirement:HOST-001, verdict: covered, explanation: Supported-hosts and the recorded common Agent Skills observation justify exactly Codex and Claude Code with portable SKILL.md entrypoints and no unsupported common metadata. Model-role differences do not alter this host support boundary., requirement_ids: [ HOST-001 ], source_refs: [ { id: compatibility.supported-hosts, revision: 1 }, { id: observed.agent-skills-core, revision: 1 }, { id: workflow-loop.model-roles, revision: 1 } ] }, { item_index: 106, item_key: requirement:HOST-002, verdict: covered, explanation: "The v1-surfaces decision supports local CLI/IDE, native, hosted and managed distribution. The later absolute exclusion of consuming-project skills justifies limiting hosted support to account/workspace/user installations that do not require project files.", requirement_ids: [ HOST-002, SCOPE-001 ], source_refs: [ { id: compatibility.v1-surfaces, revision: 1 }, { id: workflow-loop.model-roles, revision: 1 }, { id: operations.existing-copy-migration, revision: 3 } ] }, { item_index: 107, item_key: requirement:HOST-003, verdict: covered, explanation: "Desktop-platforms explicitly selects Linux, macOS and native Windows. The later pinned Node lifecycle decision legitimately replaces custom platform binaries while retaining installation/acceptance on each supported OS; fixture-specific Linux scope must not narrow this product guarantee.", requirement_ids: [ HOST-003 ], source_refs: [ { id: compatibility.desktop-platforms, revision: 1 }, { id: architecture.lifecycle-client, revision: 2 } ] }, { item_index: 108, item_key: requirement:HOST-004, verdict: covered, explanation: "Client-version-policy and exact-skills-version decisions justify recorded minimum verified clients, tested stable clients and a fixed reviewed package. The upstream-contract observation supplies skills 1.5.20 and Node 22.20.0; reviewed upgrades retain the requested reproducibility.", requirement_ids: [ HOST-004 ], source_refs: [ { id: compatibility.client-version-policy, revision: 1 }, { id: compatibility.skills-cli-version, revision: 1 }, { id: observed.skills-cli-contract, revision: 1 } ] }, { item_index: 109, item_key: requirement:ARCH-001, verdict: covered, explanation: The latest portability/installation revisions require strict host rendering and one canonical template source. Shared-directory and manual-form observations justify generated self-contained artifacts and rejection of unknown variables or host leakage rather than independent hand edits., requirement_ids: [ ARCH-001 ], source_refs: [ { id: observed.agent-skills-core, revision: 1 }, { id: distribution.installation-model, revision: 2 }, { id: architecture.skill-portability, revision: 2 }, { id: observed.skills-cli-shared-directory, revision: 2 }, { id: architecture.engineering-manual-form, revision: 2 } ] }, { item_index: 110, item_key: requirement:ARCH-002, verdict: covered, explanation: "The packaging-difference and strict-rendering sources support separate host plugins/marketplaces, catalog classification and only necessary host adapters. Committed generation plus regeneration/leakage checks are verification of that one-source boundary.", requirement_ids: [ ARCH-002 ], source_refs: [ { id: observed.host-packaging-difference, revision: 1 }, { id: distribution.installation-model, revision: 2 }, { id: architecture.skill-portability, revision: 2 }, { id: observed.skills-cli-shared-directory, revision: 2 } ] }, { item_index: 111, item_key: requirement:ARCH-003, verdict: covered, explanation: "Canonical-source ownership explicitly makes prompt-mcp initial provenance only, keeps future changes here and rejects bidirectional synchronization and project copying.", requirement_ids: [ ARCH-003 ], source_refs: [ { id: ownership.canonical-source, revision: 1 } ] }, { item_index: 112, item_key: requirement:INV-001, verdict: conflict, explanation: "The invocation source says every collection workflow is explicit-only, and SKILL-001/current manifest define 16. INV-001 says 'All 15 workflows', leaving the policy's total inconsistent with the actual enumerated contract and the later design stage. Host-specific controls and invocation syntax are otherwise justified.", counterexample: "A generated policy/catalog validator treats the complete set as 15 because INV-001 states that cardinality, while the approved inventory and confirmed scope contain 16. The literal total cannot consistently describe the same complete collection; the correction is the current count, not weakening the all-workflows policy.", requirement_ids: [ INV-001, SKILL-001, PLAN-004 ], source_refs: [ { id: observed.skill-context-disclosure, revision: 1 }, { id: invocation.explicit-only, revision: 1 }, { id: ui.separate-design-planning, revision: 1 }, { id: scope.initial-skills, revision: 1 } ] }, { item_index: 113, item_key: requirement:INV-002, verdict: covered, explanation: Explicit-only invocation across supported surfaces requires a verified capability floor rather than silently dropping the policy. INV-002 faithfully makes incapable surfaces unsupported until an equivalent mechanism exists., requirement_ids: [ INV-002 ], source_refs: [ { id: invocation.explicit-only, revision: 1 } ] }, { item_index: 114, item_key: requirement:TOK-001, verdict: covered, explanation: Strict-progressive-disclosure explicitly requires the entire catalog to fit both hosts' unmodified default budgets without truncation or omission. The recorded discovery observation justifies distinguishing metadata cost from runtime body loading and recording actual host diagnostics., requirement_ids: [ TOK-001 ], source_refs: [ { id: observed.skill-context-disclosure, revision: 1 }, { id: quality.skill-refinement-budget, revision: 2 } ] }, { item_index: 115, item_key: requirement:TOK-002, verdict: covered, explanation: "Progressive-disclosure and generated-manual decisions justify selected-body loading, conditional references and no unrelated-body preloading. This general requirement is faithful; the additional exact one-profile/one-file planning condition is missing elsewhere and recorded on source 62.", requirement_ids: [ TOK-002 ], source_refs: [ { id: observed.skill-context-disclosure, revision: 1 }, { id: quality.skill-refinement-budget, revision: 2 }, { id: architecture.engineering-manual-form, revision: 2 }, { id: specification.profile-reference-loading, revision: 2 }, { id: specification.artifact-name-source, revision: 1 }, { id: workflow-loop.model-roles, revision: 1 }, { id: specification.lite-inline-contract, revision: 1 } ] }, { item_index: 116, item_key: requirement:TOOL-001, verdict: covered, explanation: "The lifecycle-client and no-project-CLI revisions explicitly choose pinned npx skills, native upstream flags/state and no wrapper/custom executable. The exact-version source supports recording reviewed package integrity and excluding experimental stable behavior.", requirement_ids: [ TOOL-001 ], source_refs: [ { id: architecture.lifecycle-client, revision: 2 }, { id: interface.cli-name, revision: 2 }, { id: observed.skills-cli-contract, revision: 1 }, { id: compatibility.skills-cli-version, revision: 1 } ] }, { item_index: 117, item_key: requirement:TOOL-002, verdict: covered, explanation: "The latest lifecycle/update/shared-directory decisions support separate single-agent global matching-source --copy operations and repeat-add updates. Revised rollback, selection and layout sources justify the exclusions and native semantics; no removed custom lifecycle behavior is reintroduced.", requirement_ids: [ TOOL-002 ], source_refs: [ { id: operations.managed-lifecycle, revision: 2 }, { id: architecture.lifecycle-client, revision: 2 }, { id: operations.update-policy, revision: 2 }, { id: release.channels, revision: 1 }, { id: operations.local-version-layout, revision: 2 }, { id: operations.existing-copy-migration, revision: 3 }, { id: interface.install-selection-default, revision: 2 }, { id: operations.rollback-support, revision: 1 }, { id: observed.skills-cli-contract, revision: 1 }, { id: observed.skills-cli-shared-directory, revision: 2 } ] }, { item_index: 118, item_key: requirement:TOOL-003, verdict: covered, explanation: "The recorded telemetry opt-out assumption directly supports DISABLE_TELEMETRY=1, disclosure and no project telemetry/custom metadata. The explicit limitation on arbitrary third-party user invocations avoids promising controls the project does not own.", requirement_ids: [ TOOL-003 ], source_refs: [ { id: security.skills-cli-telemetry, revision: 1 } ] }, { item_index: 119, item_key: requirement:DIST-001, verdict: covered, explanation: "The current hybrid installation-model revision directly supports generated global artifacts and complete native plugins from the same signed canonical release, with host-only values preserved.", requirement_ids: [ DIST-001 ], source_refs: [ { id: distribution.installation-model, revision: 2 } ] }, { item_index: 120, item_key: requirement:DIST-002, verdict: covered, explanation: "The installation-path observation and latest copy-update decision support upstream-owned global storage, no second state store/direct mutation and before/after project non-mutation evidence.", requirement_ids: [ DIST-002 ], source_refs: [ { id: observed.global-skill-locations, revision: 1 }, { id: operations.update-policy, revision: 2 } ] }, { item_index: 121, item_key: requirement:DIST-003, verdict: conflict, explanation: DIST-003 weakens the selected activation-policy from refusal unless explicitly overridden to documentation warnings/inspection only. No source revision accepts that relaxation; no-custom-installer scope does not itself waive the duplicate-activation precondition., counterexample: A user activates the same release both globally and as a plugin after seeing a warning but without explicitly overriding a refusal. DIST-003 allows warning-only handling; the selected source does not., requirement_ids: [ DIST-003, TOOL-001 ], source_refs: [ { id: distribution.activation-policy, revision: 1 }, { id: architecture.lifecycle-client, revision: 2 } ] }, { item_index: 122, item_key: requirement:DIST-004, verdict: covered, explanation: "The individual-selection source, narrowed by the later dependency decision, supports standalone --skill selection and complete-bundle '*'. Delegating unknown-name behavior to the pinned tool matches the later native-selection contract.", requirement_ids: [ DIST-004, SKILL-004 ], source_refs: [ { id: distribution.installation-granularity, revision: 1 }, { id: distribution.skill-dependencies, revision: 3 }, { id: interface.install-selection-default, revision: 2 } ] }, { item_index: 123, item_key: requirement:DIST-005, verdict: covered, explanation: Dependency revisions choose a full bundle for companion workflows and no project-owned resolver; the generated local manual layout preserves standalone support. Canonical catalog and README classification make that distinction observable., requirement_ids: [ DIST-005, SKILL-004 ], source_refs: [ { id: distribution.skill-dependencies, revision: 3 }, { id: architecture.engineering-manual-layout, revision: 2 } ] }, { item_index: 124, item_key: requirement:DIST-006, verdict: conflict, explanation: "DIST-006 requires a complete native plugin but explicitly limits it to 'all 15 skills', whereas SKILL-001 and the confirmed manifest enumerate 16 and PLAN-004 requires the separate design workflow. The host isolation/single-plugin choice is sourced; the stale count is internally inconsistent.", counterexample: "A native package contains all 16 required inventory entries and is rejected by a literal 15-skill complete-bundle check, or a maintainer removes one required entry to satisfy that stale total. The two normative totals describe incompatible complete sets.", requirement_ids: [ DIST-006, SKILL-001, PLAN-004 ], source_refs: [ { id: observed.host-packaging-difference, revision: 1 }, { id: architecture.skill-portability, revision: 2 }, { id: distribution.plugin-granularity, revision: 1 }, { id: ui.separate-design-planning, revision: 1 }, { id: scope.initial-skills, revision: 1 } ] }, { item_index: 125, item_key: requirement:DIST-007, verdict: covered, explanation: "Public-directory-scope selects Git-backed marketplaces only, immutable release content and deferred vendor submissions. DIST-007 retains those surfaces and the no-consuming-project-write constraint.", requirement_ids: [ DIST-007 ], source_refs: [ { id: distribution.public-directory-scope, revision: 1 } ] }, { item_index: 126, item_key: requirement:INT-001, verdict: covered, explanation: "The latest Prompt-MCP-platform revision applies native questions to all four interview-driven workflows and explicitly retires Prompt MCP. Automatic-approval preserves completed-decision finalization, direct user edits and separate planning/implementation authority; missing answers never become consent.", requirement_ids: [ INT-001 ], source_refs: [ { id: compatibility.prompt-mcp-platform-gap, revision: 3 }, { id: specification.automatic-approval, revision: 1 }, { id: workflow-loop.execution-contract, revision: 1 }, { id: workflow-loop.model-roles, revision: 1 } ] }, { item_index: 127, item_key: requirement:MCP-001, verdict: covered, explanation: The latest integration decision explicitly retires Prompt MCP from every collection workflow while preserving historical provenance and no-configuration scope. MCP-001 accurately supersedes the earlier integration choices., requirement_ids: [ MCP-001 ], source_refs: [ { id: compatibility.prompt-mcp-platform-gap, revision: 3 } ] }, { item_index: 128, item_key: requirement:MCP-002, verdict: covered, explanation: "The MCP-only decision and the available Approved decision-ledger-mcp/spec.md justify the separate read-only TypeScript/npm contract, fixed multi-project/spec identity, process-permission boundary, bounded operations and blocked unavailable-reader behavior. Ordinary authorized YAML authoring is expressly distinguished from prohibited local journal reading; this review does not infer implementation qualification.", requirement_ids: [ MCP-002 ], source_refs: [ { id: workflow-loop.large-decision-ledger-access, revision: 2 } ] }, { item_index: 129, item_key: requirement:SEC-001, verdict: covered, explanation: "The latest no-project-mutation decision explicitly excludes inspecting/migrating project skills. SEC-001 operationalizes that boundary through explicit global scope, unchanged project artifacts and no recursive discovery of development roots.", requirement_ids: [ SEC-001 ], source_refs: [ { id: operations.existing-copy-migration, revision: 3 } ] }, { item_index: 130, item_key: requirement:SEC-002, verdict: gap, explanation: "Release-integrity selected verification before using downloads, but SEC-002 only obligates release production metadata and explanatory documentation. It does not require successful signature/checksum verification before installation/replacement or define refusal when verification fails; this is incomplete preservation of the selected control.", counterexample: "Release metadata and documentation satisfy every listed SEC-002 bullet, but an unverified altered downloaded artifact is installed because no verification-success precondition or denial rule applies before use. The selected integrity source forbids this outcome.", requirement_ids: [ SEC-002, REL-002, DOC-001 ], source_refs: [ { id: security.release-integrity, revision: 1 } ] }, { item_index: 131, item_key: requirement:SEC-003, verdict: covered, explanation: "Telemetry opt-out, release-integrity and pinned-lifecycle decisions support the package/CI trust boundary; least privilege and exclusion of secret/personal/environment output are appropriate concrete security controls for the confirmed public supply-chain scope. They do not authorize global settings changes or execution on discovery.", requirement_ids: [ SEC-003, TOOL-001, TOOL-003 ], source_refs: [ { id: security.skills-cli-telemetry, revision: 1 }, { id: security.release-integrity, revision: 1 }, { id: architecture.lifecycle-client, revision: 2 } ] }, { item_index: 132, item_key: requirement:REL-001, verdict: covered, explanation: "The SemVer and stable-only decisions justify one collection version, breaking/additive/fix classifications, one stable channel and matching changelog/host metadata. Identity changes remain at least MINOR and breaking removals remain MAJOR.", requirement_ids: [ REL-001 ], source_refs: [ { id: release.versioning-policy, revision: 2 }, { id: release.channels, revision: 1 } ] }, { item_index: 133, item_key: requirement:REL-002, verdict: covered, explanation: "Publication-gate and hosting-provider select a maintainer-signed tag, GitHub Actions validation and GitHub Release artifacts. Release-integrity supports checksums/validation; CI version invention and unauthorized publication stay excluded.", requirement_ids: [ REL-002 ], source_refs: [ { id: security.release-integrity, revision: 1 }, { id: release.publication-gate, revision: 1 }, { id: distribution.hosting-provider, revision: 1 } ] }, { item_index: 134, item_key: requirement:REL-003, verdict: covered, explanation: "Repository-access, license and provider choices justify public GitHub/MIT. The 'Do nothing' import-rights source explains absence of a separate provenance or clean-room workflow; this requirement does not independently certify legal ownership.", requirement_ids: [ REL-003 ], source_refs: [ { id: distribution.repository-access, revision: 1 }, { id: distribution.license, revision: 1 }, { id: distribution.import-rights, revision: 1 }, { id: distribution.hosting-provider, revision: 1 } ] }, { item_index: 135, item_key: requirement:DOC-001, verdict: covered, explanation: "The guidance inventory is justified across explicit decisions: lifecycle/host portability, invocation/budgets, manual/architecture, adaptive state, native questions, documentation threshold/language and signed releases. The requirement to distinguish verified behavior from assumptions avoids inventing acceptance evidence.", requirement_ids: [ DOC-001 ], source_refs: [ { id: planning.developer-documentation-threshold, revision: 1 }, { id: planning.developer-documentation-language, revision: 1 }, { id: specification.automatic-approval, revision: 1 }, { id: invocation.explicit-only, revision: 1 }, { id: quality.skill-refinement-budget, revision: 2 }, { id: quality.engineering-standard, revision: 1 }, { id: planning.symbol-level-architecture, revision: 1 }, { id: architecture.lifecycle-client, revision: 2 }, { id: specification.adaptive-depth, revision: 1 }, { id: specification.profile-model, revision: 1 }, { id: compatibility.prompt-mcp-platform-gap, revision: 3 }, { id: security.release-integrity, revision: 1 } ] }, { item_index: 136, item_key: requirement:ACC-001, verdict: conflict, explanation: "ACC-001's first criterion validates 'All 15 skills', conflicting with SKILL-001's 16 entries and the confirmed manifest. Its remaining source-bound generation, reference, adaptation and specification checks are justified, but a 15-skill acceptance set cannot validate the complete current collection.", counterexample: "Acceptance verifies a complete 15-entry inventory to satisfy ACC-001 while the current specification requires 16, or rejects the complete 16-entry generated bundle against the stale total. Count-based acceptance must agree with the enumerated inventory.", requirement_ids: [ ACC-001, SKILL-001, PLAN-004 ], source_refs: [ { id: architecture.skill-portability, revision: 2 }, { id: distribution.skill-dependencies, revision: 3 }, { id: guidance.host-supplied-context, revision: 1 }, { id: specification.automatic-approval, revision: 1 }, { id: specification.adaptive-depth, revision: 1 }, { id: specification.profile-model, revision: 1 }, { id: ui.separate-design-planning, revision: 1 }, { id: scope.initial-skills, revision: 1 } ] }, { item_index: 137, item_key: requirement:ACC-002, verdict: covered, explanation: "The latest update/shared-directory observations justify actual pinned-tool tests for separate --copy sources, isolation, repeat-add, per-agent list and removal. Dependency-selection decisions justify the missing-companion safe stop and supported complete-bundle instruction.", requirement_ids: [ ACC-002, SKILL-004 ], source_refs: [ { id: operations.update-policy, revision: 2 }, { id: observed.skills-cli-shared-directory, revision: 2 }, { id: distribution.skill-dependencies, revision: 3 } ] }, { item_index: 138, item_key: requirement:ACC-003, verdict: covered, explanation: "Desktop-platforms and no-project-mutation sources support isolated Linux/macOS/Windows profiles, before/after consuming-project evidence and no real user client/npm/Git state changes.", requirement_ids: [ ACC-003 ], source_refs: [ { id: compatibility.desktop-platforms, revision: 1 }, { id: operations.existing-copy-migration, revision: 3 } ] }, { item_index: 139, item_key: requirement:ACC-004, verdict: covered, explanation: Explicit-only invocation and supported-host decisions justify explicit success/unqualified non-activation and native plugin validation. The latest host-question decision additionally supports callable native question tests across specification/planning/refinement/interview without an artificial plan-mode switch., requirement_ids: [ ACC-004, INT-001 ], source_refs: [ { id: invocation.explicit-only, revision: 1 }, { id: compatibility.prompt-mcp-platform-gap, revision: 3 }, { id: compatibility.supported-hosts, revision: 1 } ] }, { item_index: 140, item_key: requirement:ACC-005, verdict: covered, explanation: "The signed human-tag publication decision and integrity/pinning sources support release-wide tests, immutable marketplace content, version agreement and checksum/npm identity verification before stable release. The no-custom-CLI decision justifies its artifact exclusion.", requirement_ids: [ ACC-005 ], source_refs: [ { id: release.publication-gate, revision: 1 }, { id: security.release-integrity, revision: 1 }, { id: compatibility.skills-cli-version, revision: 1 }, { id: interface.cli-name, revision: 2 } ] }, { item_index: 141, item_key: requirement:ACC-006, verdict: covered, explanation: "Supported-surfaces and desktop choices justify separately authorized manual local, native, hosted and managed checks for each host/OS; no-project-write, vendor-directory deferral and rollback deferral preserve the chosen exclusions.", requirement_ids: [ ACC-006 ], source_refs: [ { id: compatibility.v1-surfaces, revision: 1 }, { id: compatibility.desktop-platforms, revision: 1 }, { id: operations.existing-copy-migration, revision: 3 }, { id: operations.rollback-support, revision: 1 }, { id: distribution.public-directory-scope, revision: 1 } ] }, { item_index: 142, item_key: requirement:ACC-007, verdict: covered, explanation: "Strict refinement-budget and host-context-reuse sources justify exact byte/code-point limits, full default-budget listing, native diagnostics and instrumented proof of selected-body/reference loading, plus outcome/safety equivalence.", requirement_ids: [ ACC-007 ], source_refs: [ { id: quality.skill-refinement-budget, revision: 2 }, { id: guidance.host-supplied-context, revision: 1 } ] }, { item_index: 143, item_key: requirement:ACC-008, verdict: covered, explanation: "Engineering quality and generated-local-resource decisions support authenticating one authored source and same-release chains across installation forms/platforms. Test-first and artifact-ownership choices justify behavioral specification, architectural planning and bounded implementation fixtures without turning generic principles into mandatory abstractions.", requirement_ids: [ ACC-008 ], source_refs: [ { id: distribution.skill-dependencies, revision: 3 }, { id: quality.engineering-standard, revision: 1 }, { id: workflow-loop.execution-contract, revision: 1 }, { id: architecture.engineering-manual-form, revision: 2 }, { id: quality.test-first-verification, revision: 1 } ] }, { item_index: 144, item_key: requirement:ACC-009, verdict: covered, explanation: "Symbol-level planning, test-first, conditional documentation and adaptive depth/profile decisions justify all listed architecture/readiness/no-production/Lite/PROVE/language checks. The source-62 planning reference-loading gap is additional and is not claimed covered by these otherwise justified criteria.", requirement_ids: [ ACC-009 ], source_refs: [ { id: planning.symbol-level-architecture, revision: 1 }, { id: quality.test-first-verification, revision: 1 }, { id: planning.developer-documentation-threshold, revision: 1 }, { id: planning.developer-documentation-language, revision: 1 }, { id: specification.adaptive-depth, revision: 1 }, { id: specification.profile-model, revision: 1 }, { id: planning.scope-precondition, revision: 1 }, { id: planning.lite-output, revision: 1 }, { id: specification.profile-reference-loading, revision: 2 }, { id: specification.artifact-name-source, revision: 1 }, { id: workflow-loop.execution-contract, revision: 1 }, { id: workflow-loop.model-roles, revision: 1 }, { id: specification.lite-inline-contract, revision: 1 } ] }, { item_index: 145, item_key: requirement:ACC-010, verdict: covered, explanation: "Fresh-reviewer isolation directly justifies native fresh-context minimal inputs, read-only reconciliation, no mandatory external CLI and honest unavailable-reviewer failure rather than same-context independent-review claims.", requirement_ids: [ ACC-010 ], source_refs: [ { id: quality.doubt-reviewer-isolation, revision: 1 } ] }, { item_index: 146, item_key: profile:core, verdict: covered, explanation: "Core is relevant because the product exposes portable skill identities, rendering, catalogs, manifests and delegated lifecycle commands. ARCH-001/002, TOOL-001/002, SPEC-001/STATE-001, REL-001 and acceptance criteria cover deterministic generation, invalid inputs, compatibility, scope and preserved upstream semantics. The count, planning-route and specific-source losses are recorded on their items. No additional public API/installer or speculative contract file is warranted.", requirement_ids: [ ARCH-001, ARCH-002, TOOL-001, TOOL-002, SPEC-001, STATE-001, REL-001, ACC-001, ACC-002 ], source_refs: [] }, { item_index: 147, item_key: profile:operations, verdict: covered, explanation: "Operations is relevant to global install/replacement/removal and signed publication. TOOL-002 defines repeat-add and explicitly defers managed rollback; DOC-001 requires troubleshooting; ACC-002/003/005/006 separate isolated acceptance, platform evidence and manual publication gates. The recorded campaign/integrity losses remain findings. No service availability SLO or backup subsystem is established for this delegated tooling scope.", requirement_ids: [ TOOL-002, DOC-001, ACC-002, ACC-003, ACC-005, ACC-006, EVAL-001 ], source_refs: [] }, { item_index: 148, item_key: profile:security, verdict: covered, explanation: "Security is relevant to downloaded artifacts, host isolation, personal/project state and release credentials. SEC-001/003, TOOL-003, ARCH-001/002, SPEC-001 and STATE-001 cover project non-mutation, least-privilege CI, secret/telemetry handling, host leakage and validation. Verification-before-use and trial sandbox/network losses are separately recorded. There is no application authentication or domain retention lifecycle requiring a new feature here.", requirement_ids: [ SEC-001, SEC-002, SEC-003, TOOL-003, ARCH-001, ARCH-002, SPEC-001, STATE-001 ], source_refs: [] }, { item_index: 149, item_key: profile:cross-surface, verdict: covered, explanation: "Cross-surface applies to one canonical source producing isolated Codex/Claude artifacts and separate native/global installations. ARCH-001/002, DIST-001/006, TOOL-002 and ACC-002/004/006/008 define owning boundaries, matching release identities, copy isolation, host capability limits, updates and end-to-end checks. Existing count/activation findings remain open; no unrelated UI event trace or full Cartesian environment matrix is warranted.", requirement_ids: [ ARCH-001, ARCH-002, DIST-001, DIST-006, TOOL-002, ACC-002, ACC-004, ACC-006, ACC-008 ], source_refs: [] }, { item_index: 150, item_key: context:specification, verdict: covered, explanation: "The non-requirement summary preserves separate host artifacts, explicit global commands, no project-local skill work and specification/planning ownership. Draft status is appropriate during this independent review and makes no claim of Approved or runtime qualification. The confirmed Deep manifest activates only core/operations/security/cross-surface and lists existing task outputs without retrospective profile files. Its 16-workflow rationale corroborates the count conflicts recorded on INV-001/DIST-006/ACC-001; no extra unnumbered behavior is hidden here.", requirement_ids: [ OUT-001, SCOPE-001, ARCH-001, ARCH-002, TOOL-002, SPEC-001, PLAN-003 ], source_refs: [] } ]
    - id: 5221d9e0-82a7-4f26-bb06-1aa68506c37c
      source_version: 2de8f8e11066f1068a8a1648bd89b70a093534a0798cd5923e13d6b96dfb4a00
