          label: Global skill links only
          description: Use one checkout and symlink every skill into both user skill directories without maintaining plugin packages or marketplaces.
        - id: native-plugins-only
          label: Native plugins only
          description: Distribute through separate Codex and Claude plugin mechanisms without installing unnamespaced global skill links.
