      status_at_start: Draft
      created_at: 2026-09-07T08:03:33.338Z
      completed: true
      outcome: gaps
      results: [ { item_index: 43, item_key: source:quality.engineering-standard, verdict: covered, explanation: "MAN-002 explicitly defines the context-sensitive senior engineering standard and distinct specification, planning and implementation contracts; repository and approved product rules take precedence, and inapplicable patterns are forbidden. MAN-001 and ACC-008 give that standard one authenticated shared source and observable validation.", requirement_ids: [ MAN-001, MAN-002, ACC-008 ], source_refs: [ { id: quality.engineering-standard, revision: 1 } ] }, { item_index: 44, item_key: source:planning.symbol-level-architecture, verdict: covered, explanation: "PLAN-001 requires reviewable existing/proposed units, ownership, material symbols, responsibilities, contracts, dependency direction and verification before production changes. ACC-009 checks language-appropriate detail and revising disproven boundaries.", requirement_ids: [ PLAN-001, ACC-009 ], source_refs: [ { id: planning.symbol-level-architecture, revision: 1 } ] }, { item_index: 45, item_key: source:architecture.engineering-manual-form, verdict: covered, explanation: Revision 2 replaces sibling ownership with one authored root shared source and authenticated byte-identical generated local copies. MAN-001 states those paths and verification without cross-skill traversal; ARCH-001 forbids independent host copies and TOK-002 preserves selective loading., requirement_ids: [ ARCH-001, MAN-001, TOK-002 ], source_refs: [ { id: architecture.engineering-manual-form, revision: 2 } ] }, { item_index: 46, item_key: source:architecture.engineering-manual-layout, verdict: covered, explanation: MAN-001 places the authoritative resources under root shared and generates local copies for consuming workflows. The earlier planning-owned layout is replaced; SKILL-004 and DIST-005 preserve same-release companion requirements and complete-bundle installation without adding a resource-only skill., requirement_ids: [ MAN-001, SKILL-004, DIST-005 ], source_refs: [ { id: architecture.engineering-manual-layout, revision: 2 } ] }, { item_index: 47, item_key: source:quality.test-first-verification, verdict: covered, explanation: "TEST-001 and PLAN-002 preserve test/check first, relevant RED, implementation correction until correct checks pass, and required PROVE. They explicitly forbid weakening correct assertions and ACC-009 validates the packet order.", requirement_ids: [ TEST-001, PLAN-002, ACC-009 ], source_refs: [ { id: quality.test-first-verification, revision: 1 } ] }, { item_index: 48, item_key: source:planning.developer-documentation-threshold, verdict: covered, explanation: "PLAN-002 requires every substantial plan to record the documentation decision, creates a final separate packet at the two-usefulness-criteria threshold, and requires evidence when omitted. ACC-009 exercises both outcomes and post-implementation/end-to-end ordering.", requirement_ids: [ PLAN-002, ACC-009 ], source_refs: [ { id: planning.developer-documentation-threshold, revision: 1 } ] }, { item_index: 49, item_key: source:planning.developer-documentation-language, verdict: covered, explanation: "PLAN-002 makes the consuming repository's documentation location, language and style authoritative. ACC-009 explicitly checks preservation of repository-selected language.", requirement_ids: [ PLAN-002, ACC-009 ], source_refs: [ { id: planning.developer-documentation-language, revision: 1 } ] }, { item_index: 50, item_key: source:quality.doubt-reviewer-isolation, verdict: covered, explanation: "QUAL-001 requires a fresh host-native reviewer given only the artifact and evaluation contract, followed by read-only reconciliation. External cross-model CLI use remains optional and separately requested; missing fresh review stops with an honest limitation, as ACC-010 verifies.", requirement_ids: [ QUAL-001, ACC-010 ], source_refs: [ { id: quality.doubt-reviewer-isolation, revision: 1 } ] }, { item_index: 51, item_key: source:guidance.host-supplied-context, verdict: covered, explanation: SKILL-002 forbids rereading host-supplied instructions solely to recover context and permits additional task-scoped instruction reads only when absent or themselves in scope. SKILL-005 repeats the invocation-time adaptation boundary., requirement_ids: [ SKILL-002, SKILL-005 ], source_refs: [ { id: guidance.host-supplied-context, revision: 1 } ] }, { item_index: 52, item_key: source:specification.automatic-approval, verdict: covered, explanation: "INT-001 explicitly requires automatic Approved finalization after material decisions, confirmed manifest and final gap review, with no separate approval question or approval.spec decision. It preserves direct edits and keeps planning/implementation separately authorized; DOC-001 documents this behavior.", requirement_ids: [ INT-001, DOC-001 ], source_refs: [ { id: specification.automatic-approval, revision: 1 } ] }, { item_index: 53, item_key: source:workflow.adaptive-pair-scope, verdict: covered, explanation: The adaptive work stays within the existing specification/planning identities in SPEC-001 and PLAN-003. The later explicit ui.separate-design-planning source separately authorizes the design skill now present in SKILL-001; it does not introduce another adaptive-scope workflow., requirement_ids: [ SPEC-001, PLAN-003, SKILL-001 ], source_refs: [ { id: workflow.adaptive-pair-scope, revision: 1 } ] }, { item_index: 54, item_key: source:specification.adaptive-depth, verdict: covered, explanation: SPEC-001 selects the highest applicable Lite/Standard/Deep level from evidence and obtains explicit plain-language confirmation; depth never weakens baseline correctness. PLAN-003 scales output and returns newly material scope for confirmation., requirement_ids: [ SPEC-001, PLAN-003 ], source_refs: [ { id: specification.adaptive-depth, revision: 1 } ] }, { item_index: 55, item_key: source:specification.scope-state, verdict: covered, explanation: SPEC-001 separates versioned proposals/answers in decisions.yaml from the latest explicitly confirmed deterministic manifest. PLAN-003 consumes that confirmed current view and forbids inferring or silently downgrading it., requirement_ids: [ SPEC-001, PLAN-003 ], source_refs: [ { id: specification.scope-state, revision: 1 } ] }, { item_index: 56, item_key: source:specification.profile-model, verdict: covered, explanation: SPEC-001 independently evaluates all eight named composable profiles with active/not_applicable/needs_user and evidence-backed reasons. PLAN-003 expressly covers core library/CLI/configuration behavior without forcing UI or backend., requirement_ids: [ SPEC-001, PLAN-003 ], source_refs: [ { id: specification.profile-model, revision: 1 } ] }, { item_index: 57, item_key: source:planning.profile-artifact-ownership, verdict: covered, explanation: "SPEC-001 declares exact warranted artifacts while prohibiting creation during specification; PLAN-003 owns reviewable planning contracts. The later design-specific amendment is retained by PLAN-004: main planning records dependencies and a separately invoked design stage creates declared design outputs.", requirement_ids: [ SPEC-001, PLAN-003, PLAN-004 ], source_refs: [ { id: planning.profile-artifact-ownership, revision: 1 } ] }, { item_index: 58, item_key: source:planning.scope-precondition, verdict: covered, explanation: "PLAN-003 requires both Approved spec.md and confirmed manifest, stopping on missing, unresolved or inconsistent input without production mutation. ACC-009 tests missing and unconfirmed manifests.", requirement_ids: [ PLAN-003, ACC-009 ], source_refs: [ { id: planning.scope-precondition, revision: 1 } ] }, { item_index: 59, item_key: source:planning.lite-output, verdict: covered, explanation: "PLAN-003 explicitly requires plan.md, todo.md, current-only handoff.md and one compact numbered packet for Lite. Separate profile artifacts require explicit manifest declaration; ACC-009 tests the exact minimum.", requirement_ids: [ PLAN-003, ACC-009 ], source_refs: [ { id: planning.lite-output, revision: 1 } ] }, { item_index: 60, item_key: source:planning.corrective-packet, verdict: not_applicable, explanation: This source explicitly concerns delivery/history handling of completed local Packets 02/03 and adding their corrective successor. Its context classification preserves those records and their evidence without making historical packet numbering a universal generated-plan behavior., requirement_ids: [], source_refs: [ { id: planning.corrective-packet, revision: 2 } ] }, { item_index: 61, item_key: source:specification.current-bundle-manifest, verdict: covered, explanation: "SPEC-001 states legacy manifests require no automatic migration; PLAN-003 permits only confirmed declared artifacts. The fully read current confirmed manifest lists existing task documents only, with no retrospective core/architecture/quality files, matching this bundle-specific decision.", requirement_ids: [ SPEC-001, PLAN-003 ], source_refs: [ { id: specification.current-bundle-manifest, revision: 1 } ] }, { item_index: 62, item_key: source:specification.profile-reference-loading, verdict: covered, explanation: "SPEC-001 prohibits any detailed profile reference before confirmation and then requires exactly one dedicated reference per active profile, excluding inactive/possible profiles and grouped imports. PLAN-003 applies the same mapping to planning; revision 3 preserves both workflows.", requirement_ids: [ SPEC-001, PLAN-003, TOK-002 ], source_refs: [ { id: specification.profile-reference-loading, revision: 3 } ] }, { item_index: 63, item_key: source:specification.artifact-name-source, verdict: covered, explanation: "SPEC-001 explicitly selects exact planning-artifact paths from compact routing metadata before loading detailed profile guidance, and confirms one complete proposal. TOK-002 preserves conditional detailed loading; no routine second confirmation is introduced.", requirement_ids: [ SPEC-001, TOK-002 ], source_refs: [ { id: specification.artifact-name-source, revision: 1 } ] }, { item_index: 64, item_key: source:workflow-loop.execution-contract, verdict: covered, explanation: EXEC-001 executes one authorized packet and makes neither independent review nor commit a completion/next-invocation gate. EVAL-001 preserves independent actual-model trials and read-only external reviews; SPEC-001 and INT-001 retain active-only loading and automatic approval., requirement_ids: [ EXEC-001, EVAL-001, SPEC-001, INT-001 ], source_refs: [ { id: workflow-loop.execution-contract, revision: 1 } ] }, { item_index: 65, item_key: source:workflow-loop.model-roles, verdict: covered, explanation: "EVAL-001 names Sol authors/planners/reviewers, Terra executors and Astra escalation for Codex, Opus authoring/review and Sonnet execution for Claude. It preserves advisory host-rendered recommendations and the original full Codex versus Lite/UI-API Claude matrix, with no automatic switching or universal new-campaign gate.", requirement_ids: [ EVAL-001 ], source_refs: [ { id: workflow-loop.model-roles, revision: 1 } ] }, { item_index: 66, item_key: source:specification.lite-inline-contract, verdict: covered, explanation: "SPEC-001 makes artifact registry entries candidates and keeps Lite established contracts inline unless machine validation, multiple consumers or an explicit requirement warrant a separate source. PLAN-003 forbids extra Lite profile artifacts absent manifest declaration.", requirement_ids: [ SPEC-001, PLAN-003 ], source_refs: [ { id: specification.lite-inline-contract, revision: 1 } ] }, { item_index: 67, item_key: source:workflow-loop.cli-check-environment, verdict: not_applicable, explanation: "The explicit context classification is limited to a historical temporary CLI trial runner adaptation. It preserves sandboxing and equivalent real stdout/stderr/exit assertions, with no unavailable-check pass credit, without imposing a shell runner on every consuming project.", requirement_ids: [], source_refs: [ { id: workflow-loop.cli-check-environment, revision: 2 } ] }, { item_index: 68, item_key: source:workflow-loop.local-http-scope, verdict: not_applicable, explanation: "This is a temporary fixture permission, explicitly classified as campaign delivery context. Local-only HTTP, filesystem sandboxing and unchanged global settings remain binding there; no general outbound access or installed-skill HTTP dependency is authorized.", requirement_ids: [], source_refs: [ { id: workflow-loop.local-http-scope, revision: 2 } ] }, { item_index: 69, item_key: source:workflow-loop.proportionate-prove, verdict: covered, explanation: "TEST-001 confines mandatory PROVE to changed/new guarantees and cases where relevant RED is insufficient, while unchanged baseline constraints retain ordinary regression checks unless the affected boundary or existing requirements demand proof. PLAN-002 applies that discipline to each packet.", requirement_ids: [ TEST-001, PLAN-002 ], source_refs: [ { id: workflow-loop.proportionate-prove, revision: 1 } ] }, { item_index: 70, item_key: source:workflow-loop.linux-cli-fixture, verdict: not_applicable, explanation: "The Linux-only educational fixture and separate real CLI acceptance are expressly campaign context, not a reduction of published platform support. The original sandbox and required stdout/stderr/exit assertions remain preserved; the classification grants no broader platform pass.", requirement_ids: [], source_refs: [ { id: workflow-loop.linux-cli-fixture, revision: 2 } ] }, { item_index: 71, item_key: source:workflow-loop.specification-state-ownership, verdict: covered, explanation: "SPEC-001 keeps recovery in spec.md, manifest.yaml and decisions.yaml as applicable and explicitly forbids specification handoff.md. PLAN-003 starts the durable current-only handoff in the separately invoked planning stage.", requirement_ids: [ SPEC-001, PLAN-003 ], source_refs: [ { id: workflow-loop.specification-state-ownership, revision: 1 } ] }, { item_index: 72, item_key: source:workflow-loop.browser-provider, verdict: not_applicable, explanation: "The user chose Cloakbrowser for one fixture campaign. The context classification preserves that provider and its evidence while excluding a universal published dependency, global setup or sandbox-bypass authority.", requirement_ids: [], source_refs: [ { id: workflow-loop.browser-provider, revision: 2 } ] }, { item_index: 73, item_key: source:workflow-loop.git-prerequisite, verdict: covered, explanation: "EXEC-001 requires a usable Git worktree and tracked/staged/untracked evidence, blocks unavailable/bare/non-Git execution, and records it in handoff. It forbids automatic initialization or file-snapshot replacement while requiring neither an existing commit nor clean tree.", requirement_ids: [ EXEC-001 ], source_refs: [ { id: workflow-loop.git-prerequisite, revision: 1 } ] }, { item_index: 74, item_key: source:workflow-loop.deep-runtime-corruption-control, verdict: not_applicable, explanation: "This explicitly classified historical Deep-fixture control mutates real isolated source state before ordinary replay through a private opt-in channel, with no public HTTP control. Its restrictions remain in campaign inputs/evidence and do not become installed-skill dependencies.", requirement_ids: [], source_refs: [ { id: workflow-loop.deep-runtime-corruption-control, revision: 2 } ] }, { item_index: 75, item_key: source:workflow-loop.ui-zoom-sequencing, verdict: not_applicable, explanation: "This explicitly classified instruction changes only historical work order. It preserves actual 200 percent browser zoom as required but unverified until reproduced, with no emulated substitution, global browser mutation or full-matrix pass credit.", requirement_ids: [], source_refs: [ { id: workflow-loop.ui-zoom-sequencing, revision: 2 } ] }, { item_index: 76, item_key: source:workflow-loop.yaml-checkpoint-validation, verdict: covered, explanation: "STATE-001 requires validation of saved YAML syntax and matching schema, leaving affected state unverified when validators/checks are missing. MCP-002 preserves a real parser for non-journal YAML and mandatory MCP journal read-back; INT-001 allows Approved only after the final gap review passes, with no automatic installation.", requirement_ids: [ STATE-001, MCP-002, INT-001 ], source_refs: [ { id: workflow-loop.yaml-checkpoint-validation, revision: 1 } ] }, { item_index: 77, item_key: source:workflow-loop.large-decision-ledger-access, verdict: covered, explanation: "MCP-002 requires callable bounded MCP journal discovery, validation, search and exact retrieval, and stops on absent/unreachable/incompatible service without shell or full-file fallback. Its available linked Decision Ledger MCP contract defines multi-project identity, bounded continuations and source versions; SKILL-004 separates external tools from sibling-skill standalone status.", requirement_ids: [ MCP-002, SKILL-004, STATE-001 ], source_refs: [ { id: workflow-loop.large-decision-ledger-access, revision: 2 } ] }, { item_index: 78, item_key: source:workflow-loop.claude-deferral, verdict: not_applicable, explanation: Native Claude deferral and percentage reporting are campaign scheduling/communication context. The classification and EVAL-001 preserve both-host generation/validation and explicitly unverified deferred native evidence; they do not drop Claude support., requirement_ids: [], source_refs: [ { id: workflow-loop.claude-deferral, revision: 2 } ] }, { item_index: 79, item_key: source:workflow-loop.budget-checkpoint, verdict: not_applicable, explanation: "This is an explicit historical budget checkpoint stopping new model launches and deferring named runs after bounded local checks. Its context preserves results and the no-reset/no-extra-spend restriction, and grants no authority to restart or credit those runs.", requirement_ids: [], source_refs: [ { id: workflow-loop.budget-checkpoint, revision: 2 } ] }, { item_index: 80, item_key: source:workflow-loop.reader-available-local-validation, verdict: covered, explanation: "MCP-002 requires MCP for journal access and rejects shell/full-file substitutes; STATE-001 adds no local journal parser fallback. EVAL-001 requires actual traces and resets stable-pass credit after changes, so deterministic correction of the observed local-read failure does not establish new native qualification.", requirement_ids: [ MCP-002, STATE-001, EVAL-001 ], source_refs: [ { id: workflow-loop.reader-available-local-validation, revision: 1 } ] }, { item_index: 81, item_key: source:ui.penpot-project-design, verdict: covered, explanation: "UI-001 preserves Penpot editing, verified project-root shared-library and per-specification screen snapshots, and composition from actual linked component instances. The later source amendment limits these rules to declared design work, preserving the original no-setup/no-remote-mutation scope of this repository task.", requirement_ids: [ UI-001 ], source_refs: [ { id: ui.penpot-project-design, revision: 1 } ] }, { item_index: 82, item_key: source:ui.separate-design-planning, verdict: covered, explanation: "PLAN-004 creates a separately invoked manifest-driven design stage after main planning, including new UI with no existing designs. It skips before loading Penpot when no outputs are declared, reuses separately installed skills/router and blocks missing capabilities without duplication or auto-installation.", requirement_ids: [ PLAN-004, UI-001 ], source_refs: [ { id: ui.separate-design-planning, revision: 1 } ] }, { item_index: 83, item_key: source:state.four-yaml-contracts, verdict: covered, explanation: "STATE-001 enumerates exactly manifest.yaml, decisions.yaml, shared catalog.yaml and per-spec experience.yaml with authoritative root schemas and generated copies. Product API/event/data contracts retain their profile formats and inactive UI schemas are not preloaded.", requirement_ids: [ STATE-001 ], source_refs: [ { id: state.four-yaml-contracts, revision: 1 } ] }, { item_index: 84, item_key: source:0122a67c-c0d9-4813-859b-fddba7a07a6b, verdict: covered, explanation: "UI-001 now explicitly makes active UI alone insufficient for design outputs and skips design planning without declared outputs; material later design needs require artifact-scope reconciliation. PLAN-004 preserves that gate. The two-pass follow-up is delivery verification authority, not a new universal product matrix.", requirement_ids: [ UI-001, PLAN-004 ], source_refs: [ { id: 0122a67c-c0d9-4813-859b-fddba7a07a6b, revision: 1 } ] }, { item_index: 85, item_key: source:997785d6-ba90-4b4b-834c-142c886f214f, verdict: not_applicable, explanation: "The current instruction authorizes only existing-decision reconciliation and independent specification review, explicitly excluding installation code, skills and fixtures. Its classification correctly treats work authority as context while retaining the earlier substantive sources and their restrictions.", requirement_ids: [], source_refs: [ { id: 997785d6-ba90-4b4b-834c-142c886f214f, revision: 2 } ] }, { item_index: 0, item_key: source:outcome.centralized-source, verdict: covered, explanation: "OUT-001 makes the separate engineer-agent-workflows repository authoritative and explicitly eliminates hand-maintained project copies, preserving the centralized-source outcome.", requirement_ids: [ OUT-001 ], source_refs: [] }, { item_index: 1, item_key: source:project.identity, verdict: covered, explanation: "The answer identifies the project to create. OUT-001 names that canonical repository and the opened specification belongs to the exact answered project path. The personal filesystem path is task location, not a portable product constant.", requirement_ids: [ OUT-001 ], source_refs: [] }, { item_index: 2, item_key: source:compatibility.supported-hosts, verdict: covered, explanation: "HOST-001 explicitly supports Codex and Claude Code, preserving both selected agent hosts.", requirement_ids: [ HOST-001 ], source_refs: [] }, { item_index: 3, item_key: source:scope.initial-skills, verdict: covered, explanation: "SKILL-001 retains the fifteen source workflow identities within the subsequently expanded sixteen-workflow collection. SKILL-002 and SKILL-005 require runtime repository adaptation, removal of prompt-mcp assumptions, independent semantic refinement, and preservation of outcome, safety, authorization, stopping, and verification.", requirement_ids: [ SKILL-001, SKILL-002, SKILL-005 ], source_refs: [] }, { item_index: 4, item_key: source:release.versioning-policy, verdict: covered, explanation: "Both decision revisions select SemVer. REL-001 gives the collection one SemVer and classifies incompatible, additive and corrective changes; SKILL-003 preserves stable public names and the required release consequence for changed workflow identity.", requirement_ids: [ REL-001, SKILL-003 ], source_refs: [] }, { item_index: 5, item_key: source:operations.managed-lifecycle, verdict: covered, explanation: "TOOL-002 preserves install, update-by-repeat-add, per-agent global list and selected removal. Revision 2 explicitly defers managed rollback, reflected in TOOL-002 and SCOPE-001; the earlier rollback selection does not restore the superseded custom lifecycle design.", requirement_ids: [ TOOL-002, SCOPE-001 ], source_refs: [] }, { item_index: 6, item_key: source:observed.agent-skills-core, verdict: covered, explanation: "HOST-001 requires directory-based Agent Skills with SKILL.md as entry point for both hosts. ARCH-001 retains the portable authoritative source while generating isolated host directories, matching the observed common core.", requirement_ids: [ HOST-001, ARCH-001 ], source_refs: [] }, { item_index: 7, item_key: source:observed.global-skill-locations, verdict: covered, explanation: The observation identifies host-owned global personal locations and available symlink support. DIST-002 and TOOL-001 preserve upstream ownership of those locations; TOOL-002's later explicit copy-isolation contract selects supported global host-specific artifacts without imposing a second path layout., requirement_ids: [ DIST-002, TOOL-001, TOOL-002 ], source_refs: [] }, { item_index: 8, item_key: source:observed.host-packaging-difference, verdict: covered, explanation: "ARCH-002 and DIST-006 require separately generated native manifests and marketplaces with matching skill identities and no cross-host leakage. ACC-004 requires each native plugin's tooling, namespaces and enable/disable behavior to match its host documentation, preserving the host packaging distinction.", requirement_ids: [ ARCH-002, DIST-006, ACC-004 ], source_refs: [] }, { item_index: 9, item_key: source:distribution.installation-model, verdict: covered, explanation: Revision 2 selects generated global and native artifacts from one authoritative template source. ARCH-001/002 and DIST-001 preserve those two channels and per-host isolation; the later TOOL-002 copy decision replaces the earlier shared-symlink mechanism without creating independent authored workflows., requirement_ids: [ ARCH-001, ARCH-002, DIST-001, TOOL-002 ], source_refs: [] }, { item_index: 10, item_key: source:compatibility.v1-surfaces, verdict: covered, explanation: "HOST-002 and ACC-006 retain local Codex CLI/IDE, Claude Code, both marketplaces, supported hosted/account installations and organization-managed distribution. The hosted restriction follows the separately agreed prohibition on consuming-project skill writes in SCOPE-001; it does not invent authority for project-local installation.", requirement_ids: [ HOST-002, ACC-006, SCOPE-001 ], source_refs: [] }, { item_index: 11, item_key: source:compatibility.desktop-platforms, verdict: covered, explanation: "HOST-003 names Linux, macOS and Windows; ACC-003 verifies all lifecycle operations with isolated profiles and unchanged consuming projects on those systems. TOOL-002 requires PowerShell equivalents and replaces custom binaries and managed rollback under later explicit decisions.", requirement_ids: [ HOST-003, ACC-003, TOOL-002 ], source_refs: [] }, { item_index: 12, item_key: source:architecture.lifecycle-client, verdict: covered, explanation: "TOOL-001 selects the pinned upstream npx skills CLI and forbids a project executable/wrapper. TOOL-002 provides explicit global selection, list, replacement and removal; TOOL-003 disables telemetry and HOST-004 states Node.js requirements. Later host-copy isolation supersedes the earlier symlink/update mechanism.", requirement_ids: [ TOOL-001, TOOL-002, TOOL-003, HOST-004 ], source_refs: [] }, { item_index: 13, item_key: source:architecture.skill-portability, verdict: covered, explanation: "Strict declared host variables, unsupported-host and unknown-variable failure, isolated rendered artifacts and cross-host leakage rejection are stated in ARCH-001/002 and ACC-001. DIST-006 keeps native packages separate; the earlier portable-core choice remains intact.", requirement_ids: [ ARCH-001, ARCH-002, DIST-006, ACC-001 ], source_refs: [] }, { item_index: 14, item_key: source:ownership.canonical-source, verdict: covered, explanation: "ARCH-003 explicitly makes prompt-mcp initial provenance only, transfers ongoing authority to engineer-agent-workflows, and forbids bidirectional synchronization and project copying. OUT-001 preserves separate versioned repository ownership.", requirement_ids: [ ARCH-003, OUT-001 ], source_refs: [] }, { item_index: 15, item_key: source:operations.update-policy, verdict: covered, explanation: "TOOL-002 specifies one matching host source and agent per add --copy invocation, repeat-add replacement and no skills update. ACC-002 verifies artifact isolation and replacement, DIST-002 protects consuming projects, and SCOPE-001 preserves the predecessor's ban on automatic background updates.", requirement_ids: [ TOOL-002, DIST-002, ACC-002, SCOPE-001 ], source_refs: [] }, { item_index: 16, item_key: source:security.release-integrity, verdict: covered, explanation: "SEC-002 requires a signed tag, maintainer trust anchor and published checksums and now explicitly gates use of downloaded artifacts on successful tag authentication and checksum verification. Failed or unavailable verification stops use. REL-002 supplies the signed release publication boundary; the removed custom CLI is not reinstated.", requirement_ids: [ SEC-002, REL-002 ], source_refs: [] }, { item_index: 17, item_key: source:compatibility.prompt-mcp-platform-gap, verdict: covered, explanation: "INT-001 names request_user_input and AskUserQuestion for specification, planning, idea refinement and interview, follows callable schemas, and forbids mode switching solely to ask. MCP-001 explicitly retires Prompt MCP from every workflow, superseding the earlier dependency/fallback design while preserving the non-goal of configuring Prompt MCP.", requirement_ids: [ INT-001, MCP-001 ], source_refs: [] }, { item_index: 18, item_key: source:distribution.repository-access, verdict: covered, explanation: "REL-003 and OUT-001 require a public GitHub canonical source and release host under MIT. DIST-007 makes released host-specific Git marketplaces publicly installable, preserving open-source acquisition of source and release metadata.", requirement_ids: [ REL-003, OUT-001, DIST-007 ], source_refs: [] }, { item_index: 19, item_key: source:distribution.license, verdict: covered, explanation: "REL-003 applies MIT to skill content, references, scripts, generated metadata, tests and documentation. The separately retired custom CLI creates no remaining uncovered license target.", requirement_ids: [ REL-003 ], source_refs: [] }, { item_index: 20, item_key: source:distribution.activation-policy, verdict: gap, explanation: "DIST-003 preserves recommended modes, host inspection and an explicit override gate, but narrows duplicate detection to another copy of the same release. The selected source forbids activating the same workflow twice in one host without limiting that rule to identical release versions.", counterexample: A host has global workflow version 1.0.0 enabled. The documented procedure enables the native plugin containing that same workflow at 1.1.0 without an explicit duplicate override because no copy of the same release exists. DIST-003 permits this while the selected exclusive-per-host workflow policy forbids it., requirement_ids: [ DIST-003, DOC-001 ], source_refs: [] }, { item_index: 21, item_key: source:compatibility.client-version-policy, verdict: gap, explanation: "HOST-004 preserves oldest verified versions and records current stable versions exercised in acceptance; ACC-004/005/006 define acceptance checks and INV-002 protects explicit-only capabilities. None preserves the selected obligation to test current stable client releases continuously beyond release-time acceptance. The gap is the missing ongoing verification obligation, not a requested new fixed schedule.", counterexample: "After validating and documenting both current stable clients for a collection release, the project performs no further client compatibility tests until its next collection release, even while new stable Codex and Claude versions appear. Its existing acceptance evidence and published minimum versions remain valid, but the source's continuing stable-client testing obligation is not fulfilled.", requirement_ids: [ HOST-004, ACC-004, ACC-005, ACC-006, INV-002, DOC-001 ], source_refs: [] }, { item_index: 22, item_key: source:release.channels, verdict: covered, explanation: "REL-001 provides one stable SemVer channel, SEC-002 requires signed stable release artifacts, and SCOPE-001 excludes rolling-main and preview release channels. Source checkouts remain possible without becoming another released channel.", requirement_ids: [ REL-001, SCOPE-001, SEC-002 ], source_refs: [] }, { item_index: 23, item_key: source:operations.local-version-layout, verdict: covered, explanation: Revision 2 assigns installation layout and lifecycle state to the established tool. DIST-002 and TOOL-001 forbid a second state store or direct path mutation; SCOPE-001 removes the predecessor's version retention/current-pointer/managed-rollback system., requirement_ids: [ DIST-002, TOOL-001, TOOL-002, SCOPE-001 ], source_refs: [] }, { item_index: 24, item_key: source:distribution.installation-granularity, verdict: covered, explanation: DIST-004 and TOOL-002 retain individual selection and complete-bundle installation with one release model. The later explicit dependency decision narrows individual support to standalone workflows; SKILL-004 and DIST-005 preserve that accepted exception rather than treating the original arbitrary-subset option as authorization for broken dependencies., requirement_ids: [ DIST-004, TOOL-002, SKILL-004, DIST-005 ], source_refs: [] }, { item_index: 25, item_key: source:distribution.skill-dependencies, verdict: covered, explanation: "SKILL-004 makes specification standalone, planning dependent on specification, and implementation dependent on planning, with same-release companion requirements. MAN-001 generates local shared resources without reverse ownership or invoking planning from specification. DIST-005 and ACC-008 preserve the predecessor's complete-bundle path and stop on missing or mismatched dependency resources; custom automatic resolution is explicitly superseded.", requirement_ids: [ SKILL-004, MAN-001, DIST-005, ACC-001, ACC-008 ], source_refs: [] }, { item_index: 26, item_key: source:distribution.plugin-granularity, verdict: covered, explanation: "DIST-006 requires one complete native plugin per host containing the SKILL-001 inventory and expressly excludes per-skill native plugin installation. Global individual selection remains separately governed, matching the selected bundle-plugin alternative.", requirement_ids: [ DIST-006 ], source_refs: [] }, { item_index: 27, item_key: source:operations.existing-copy-migration, verdict: covered, explanation: "SCOPE-001 forbids discovery, audit, migration, removal, restoration and modification of consuming-project skills, replacing the predecessor's explicit-migration feature. SEC-001 forbids project-scope writes and recursive development-root scans; TOOL-002 uses only explicit global commands.", requirement_ids: [ SCOPE-001, SEC-001, TOOL-002 ], source_refs: [] }, { item_index: 28, item_key: source:release.publication-gate, verdict: gap, explanation: The selected publication option requires CI to verify the maintainer's signed SemVer tag. REL-002 requires human creation of the signed tag but only says Actions verifies repository state; ACC-005 checks version agreement and artifact checksums. SEC-002's explicit cryptographic authentication gate belongs to installation/update. No current requirement requires CI itself to authenticate the triggering tag before publication., counterexample: "A maintainer creates a valid signed tag. CI compares its version to manifests, validates source and checksums, and publishes without ever checking the tag signature against the maintainer trust anchor. All current release requirements can pass for this valid tag, but the source-mandated CI tag verification action never occurs.", requirement_ids: [ REL-002, SEC-002, ACC-005 ], source_refs: [] }, { item_index: 29, item_key: source:distribution.import-rights, verdict: covered, explanation: "The custom answer declines a separate licensing/provenance action. REL-003 retains the selected MIT license and explicitly says that initial adaptation needs no separate clean-room or provenance workflow, preserving that bounded instruction.", requirement_ids: [ REL-003 ], source_refs: [] }, { item_index: 30, item_key: source:distribution.public-directory-scope, verdict: covered, explanation: "DIST-007 requires installable Git-backed Codex and Claude marketplaces with immutable released content and defers vendor-directory submission to a separate decision. SCOPE-001 excludes those submissions from v1, retaining the selected publication boundary.", requirement_ids: [ DIST-007, SCOPE-001 ], source_refs: [] }, { item_index: 31, item_key: source:interface.cli-name, verdict: covered, explanation: "Revision 2 explicitly withdraws the custom executable. TOOL-001 forbids the engineer-agent-workflows executable and wrapper and assigns lifecycle commands to pinned npx skills; SCOPE-001 excludes a project lifecycle CLI, superseding the predecessor naming decision.", requirement_ids: [ TOOL-001, SCOPE-001 ], source_refs: [] }, { item_index: 32, item_key: source:interface.install-selection-default, verdict: covered, explanation: "Revision 2 delegates install-selection behavior to the pinned tool. TOOL-001 forbids redefining upstream flags, TOOL-002 documents explicit global skill or complete-bundle selections, and DIST-004 delegates unknown-name behavior to verified upstream semantics. The earlier custom fixed diagnostic is superseded.", requirement_ids: [ TOOL-001, TOOL-002, DIST-004 ], source_refs: [] }, { item_index: 33, item_key: source:distribution.hosting-provider, verdict: covered, explanation: "REL-003 selects public GitHub, REL-002 selects GitHub Actions and GitHub Release publication, SEC-002 requires signed tags, and DIST-007 uses installable immutable Git-backed marketplaces. These preserve the selected GitHub hosting and automation stack.", requirement_ids: [ REL-002, REL-003, DIST-007, SEC-002 ], source_refs: [] }, { item_index: 34, item_key: source:approval.spec, verdict: covered, explanation: "The latest approval retains the revised contract; its substantive predecessor requests survive in TOOL-001/SCOPE-001 (global upstream lifecycle), INV-001/TOK-001/002/SKILL-005 (explicit-only refinement and budgets), and MAN-001/002 plus PLAN-001/ACC-009 (engineering principles and reviewable architectural units with purposes). INT-001 preserves separate planning/implementation authority. This historical approval is not treated as authorization to mark the current review Draft Approved.", requirement_ids: [ OUT-001, TOOL-001, SCOPE-001, INV-001, TOK-001, TOK-002, SKILL-005, MAN-001, MAN-002, PLAN-001, ACC-009, INT-001 ], source_refs: [] }, { item_index: 35, item_key: source:operations.rollback-support, verdict: covered, explanation: "SCOPE-001 and TOOL-002 explicitly defer managed rollback and experimental lock restore without introducing a custom lifecycle wrapper, exactly preserving the selected stable-tool limitation.", requirement_ids: [ SCOPE-001, TOOL-002 ], source_refs: [] }, { item_index: 36, item_key: source:observed.skills-cli-contract, verdict: covered, explanation: "The observed pinned CLI's supported global hosts and operations are used through TOOL-001/002; HOST-004 records skills 1.5.20 and Node.js 22.20.0 or newer, DIST-004 preserves selection, and TOOL-002 defers unavailable stable rollback. Later copy isolation intentionally selects one supported installation mechanism.", requirement_ids: [ TOOL-001, TOOL-002, HOST-004, DIST-004 ], source_refs: [] }, { item_index: 37, item_key: source:security.skills-cli-telemetry, verdict: covered, explanation: "TOOL-003 requires DISABLE_TELEMETRY=1 in every normative command and CI invocation, discloses the upstream opt-out, avoids extra telemetry metadata and forbids collection telemetry. SEC-003 also protects answer data, secrets, personal paths and unrelated project content from storage or output, preserving the source's privacy condition.", requirement_ids: [ TOOL-003, SEC-003 ], source_refs: [] }, { item_index: 38, item_key: source:compatibility.skills-cli-version, verdict: covered, explanation: "TOOL-001 and SEC-003 pin the exact reviewed package and integrity identity. HOST-004 permits advancement only through an explicitly reviewed change rerunning installation, privacy and compatibility checks and forbids floating latest in normative commands or CI.", requirement_ids: [ TOOL-001, HOST-004, SEC-003 ], source_refs: [] }, { item_index: 39, item_key: source:observed.skill-context-disclosure, verdict: covered, explanation: "INV-001 supplies both host controls disabling model activation while preserving explicit invocation. TOK-001 acknowledges bounded discovery metadata before invocation, and TOK-002 loads only the selected body and conditionally routed references, preserving the observed progressive-disclosure boundaries.", requirement_ids: [ INV-001, TOK-001, TOK-002 ], source_refs: [] }, { item_index: 40, item_key: source:observed.skills-cli-shared-directory, verdict: covered, explanation: TOOL-002 and ACC-002 require separate matching-source add --copy operations and repeated replacements that never resolve through the other host's canonical instance. ARCH-001/002 generate the isolated content; MAN-001's local generated resource copies preserve the predecessor's missing-root-sibling constraint without depending on upstream transformation., requirement_ids: [ ARCH-001, ARCH-002, TOOL-002, ACC-002, MAN-001 ], source_refs: [] }, { item_index: 41, item_key: source:invocation.explicit-only, verdict: covered, explanation: "INV-001 makes every workflow explicitly user-invoked in global and native bundles and forbids loading a companion on the user's behalf. INV-002 rejects unsupported controls instead of weakening them, and ACC-004 requires explicit invocation to work while matching unqualified prompts do not activate any workflow.", requirement_ids: [ INV-001, INV-002, ACC-004 ], source_refs: [] }, { item_index: 42, item_key: source:quality.skill-refinement-budget, verdict: covered, explanation: "SKILL-005 and ACC-007 enforce 240 Unicode-code-point descriptions and complete 4096-byte SKILL.md limits. TOK-001 requires the whole catalog to fit unchanged native default discovery budgets without omission, shortening or warnings; TOK-002 and ACC-007 preserve conditional reference loading and unselected-body exclusion. SKILL-003 keeps discovery summaries focused.", requirement_ids: [ SKILL-003, SKILL-005, TOK-001, TOK-002, ACC-007 ], source_refs: [] }, { item_index: 86, item_key: requirement:OUT-001, verdict: covered, explanation: "The canonical repository, global availability, hybrid host bundles, established lifecycle tooling, explicit invocation, integrity and no-project-write outcome preserve the centralized-source request and the subsequently approved distribution contract. The global-only limitation qualifies elimination of hand-maintained copies; it does not authorize migration of consuming projects.", requirement_ids: [ OUT-001 ], source_refs: [ { id: outcome.centralized-source, revision: 1 }, { id: project.identity, revision: 1 }, { id: approval.spec, revision: 4 }, { id: distribution.installation-model, revision: 2 }, { id: architecture.lifecycle-client, revision: 2 }, { id: security.release-integrity, revision: 1 }, { id: distribution.license, revision: 1 }, { id: invocation.explicit-only, revision: 1 }, { id: quality.skill-refinement-budget, revision: 2 } ] }, { item_index: 87, item_key: requirement:SCOPE-001, verdict: covered, explanation: "These exclusions retain the explicit ban on custom lifecycle code and consuming-project skill operations, together with separately agreed no rollback, stable-only channel, explicit activation, complete native bundles and deferred public-directory submission. They do not prohibit the separately authorized decision-reader artifact or its bounded protocol.", requirement_ids: [ SCOPE-001 ], source_refs: [ { id: operations.existing-copy-migration, revision: 3 }, { id: operations.rollback-support, revision: 1 }, { id: architecture.lifecycle-client, revision: 2 }, { id: operations.update-policy, revision: 2 }, { id: release.channels, revision: 1 }, { id: distribution.plugin-granularity, revision: 1 }, { id: distribution.public-directory-scope, revision: 1 }, { id: compatibility.prompt-mcp-platform-gap, revision: 3 }, { id: invocation.explicit-only, revision: 1 } ] }, { item_index: 88, item_key: requirement:SKILL-001, verdict: covered, explanation: "The fifteen generalized source workflows are preserved, and the later separate-design-planning decision explicitly adds design-planning as the sixteenth workflow. The focused goals, safety and stopping boundaries implement semantic extraction rather than copying Prompt MCP assumptions.", requirement_ids: [ SKILL-001 ], source_refs: [ { id: scope.initial-skills, revision: 1 }, { id: workflow.adaptive-pair-scope, revision: 1 }, { id: ui.separate-design-planning, revision: 1 } ] }, { item_index: 89, item_key: requirement:SKILL-002, verdict: covered, explanation: "The requirement preserves invocation-time repository adaptation and the explicit host-supplied-context rule, including the exception for absent scoped guidance or an instruction file itself in scope. It does not weaken repository authority or authorize project-local skill copies.", requirement_ids: [ SKILL-002 ], source_refs: [ { id: scope.initial-skills, revision: 1 }, { id: guidance.host-supplied-context, revision: 1 }, { id: operations.existing-copy-migration, revision: 3 } ] }, { item_index: 90, item_key: requirement:SKILL-003, verdict: covered, explanation: "Stable identities and concise selector descriptions follow the approved refinement and versioning decisions. 'At least a MINOR' does not authorize MINOR for a breaking rename: the first paragraph and REL-001 still require MAJOR for incompatible identity or workflow changes.", requirement_ids: [ SKILL-003 ], source_refs: [ { id: release.versioning-policy, revision: 2 }, { id: quality.skill-refinement-budget, revision: 2 } ] }, { item_index: 91, item_key: requirement:SKILL-004, verdict: covered, explanation: "The latest dependency decision makes specification standalone, planning dependent on specification, and implementation dependent on planning; the separate design decision adds design-planning's planning dependency. Missing same-release companions stop execution, while external MCP prerequisites remain distinct from sibling-workflow classification.", requirement_ids: [ SKILL-004 ], source_refs: [ { id: distribution.skill-dependencies, revision: 3 }, { id: architecture.engineering-manual-layout, revision: 2 }, { id: ui.separate-design-planning, revision: 1 }, { id: workflow-loop.large-decision-ledger-access, revision: 2 } ] }, { item_index: 92, item_key: requirement:SKILL-005, verdict: covered, explanation: "The independent semantic refinement of fifteen source skills, preservation of outcomes and authorization gates, removal of source-specific details, conditional references and exact 240-code-point/4096-byte ceilings follow the refinement decision. The later new design skill does not retroactively become a sixteenth extracted source skill.", requirement_ids: [ SKILL-005 ], source_refs: [ { id: scope.initial-skills, revision: 1 }, { id: quality.skill-refinement-budget, revision: 2 }, { id: specification.automatic-approval, revision: 1 }, { id: workflow.adaptive-pair-scope, revision: 1 }, { id: guidance.host-supplied-context, revision: 1 } ] }, { item_index: 93, item_key: requirement:SPEC-001, verdict: covered, explanation: "The adaptive-scope decisions justify evidence-first depth/profile proposals, explicit confirmation, versioned history and a deterministic current manifest before exact active-reference loading. Later artifact and UI decisions justify conditional project-root design outputs, path restrictions, no automatic legacy migration and no planning artifacts during specification.", requirement_ids: [ SPEC-001 ], source_refs: [ { id: workflow.adaptive-pair-scope, revision: 1 }, { id: specification.adaptive-depth, revision: 1 }, { id: specification.scope-state, revision: 1 }, { id: specification.profile-model, revision: 1 }, { id: planning.profile-artifact-ownership, revision: 1 }, { id: specification.current-bundle-manifest, revision: 1 }, { id: specification.profile-reference-loading, revision: 3 }, { id: specification.artifact-name-source, revision: 1 }, { id: workflow-loop.execution-contract, revision: 1 }, { id: specification.lite-inline-contract, revision: 1 }, { id: workflow-loop.specification-state-ownership, revision: 1 }, { id: workflow-loop.yaml-checkpoint-validation, revision: 1 }, { id: workflow-loop.large-decision-ledger-access, revision: 2 }, { id: ui.penpot-project-design, revision: 1 }, { id: ui.separate-design-planning, revision: 1 }, { id: 0122a67c-c0d9-4813-859b-fddba7a07a6b, revision: 1 } ] }, { item_index: 94, item_key: requirement:MAN-001, verdict: covered, explanation: "The manual-form and layout decisions require one authored shared source, generated identical skill-local resources and verification before artifacts. The updated dependency classification preserves specification's standalone status while authenticating the same-release chain for workflows that actually have sibling dependencies.", requirement_ids: [ MAN-001 ], source_refs: [ { id: distribution.skill-dependencies, revision: 3 }, { id: quality.engineering-standard, revision: 1 }, { id: architecture.engineering-manual-form, revision: 2 }, { id: architecture.engineering-manual-layout, revision: 2 }, { id: quality.test-first-verification, revision: 1 } ] }, { item_index: 95, item_key: requirement:MAN-002, verdict: covered, explanation: "The requested senior-engineering standard is made concrete without overriding repository contracts or requiring inapplicable patterns. Principles, artifact-specific outcomes and the explicit low-coupling/SOLID/DRY/YAGNI concerns are retained as contextual quality rules, not speculative architectural mandates.", requirement_ids: [ MAN-002 ], source_refs: [ { id: quality.engineering-standard, revision: 1 } ] }, { item_index: 96, item_key: requirement:TEST-001, verdict: covered, explanation: "The test-first and proportionate-PROVE decisions support discriminating RED, implementation correction rather than weakened correct checks, focused/final verification and temporary-probe cleanup. Unchanged baseline guarantees are expressly exempt from unnecessary new mutations unless the affected contract requires them.", requirement_ids: [ TEST-001 ], source_refs: [ { id: quality.test-first-verification, revision: 1 }, { id: workflow-loop.execution-contract, revision: 1 }, { id: workflow-loop.proportionate-prove, revision: 1 }, { id: workflow-loop.yaml-checkpoint-validation, revision: 1 } ] }, { item_index: 97, item_key: requirement:PLAN-001, verdict: covered, explanation: "The original symbol-level architecture request and later workflow ownership decision are reconciled: main planning produces reviewable language-appropriate units, while implementation in planning mode validates the existing plan without production edits. Evidence, responsibilities, dependencies and verification remain explicit.", requirement_ids: [ PLAN-001 ], source_refs: [ { id: planning.symbol-level-architecture, revision: 1 }, { id: workflow-loop.execution-contract, revision: 1 } ] }, { item_index: 98, item_key: requirement:PLAN-002, verdict: covered, explanation: "The execution-contract and test-first decisions support self-contained bounded packets with prerequisites, selectors and executable checks before implementation. The separately answered documentation threshold and repository-language rule preserve both the warranted final-documentation case and the evidence-backed no-documentation case.", requirement_ids: [ PLAN-002 ], source_refs: [ { id: quality.test-first-verification, revision: 1 }, { id: planning.developer-documentation-threshold, revision: 1 }, { id: planning.developer-documentation-language, revision: 1 }, { id: workflow-loop.execution-contract, revision: 1 }, { id: workflow-loop.model-roles, revision: 1 }, { id: workflow-loop.proportionate-prove, revision: 1 }, { id: workflow-loop.specification-state-ownership, revision: 1 }, { id: workflow-loop.git-prerequisite, revision: 1 }, { id: workflow-loop.yaml-checkpoint-validation, revision: 1 }, { id: workflow-loop.large-decision-ledger-access, revision: 2 } ] }, { item_index: 99, item_key: requirement:PLAN-003, verdict: covered, explanation: "The approved-specification/confirmed-manifest gate, exact active-profile loading and depth-scaled outputs follow the adaptive planning decisions. The later UI decisions assign declared design production to the separate design stage through UI-001/PLAN-004; main planning still creates only its authorized artifacts and returns material scope changes to specification.", requirement_ids: [ PLAN-003 ], source_refs: [ { id: workflow.adaptive-pair-scope, revision: 1 }, { id: specification.adaptive-depth, revision: 1 }, { id: specification.scope-state, revision: 1 }, { id: specification.profile-model, revision: 1 }, { id: planning.profile-artifact-ownership, revision: 1 }, { id: planning.scope-precondition, revision: 1 }, { id: planning.lite-output, revision: 1 }, { id: specification.current-bundle-manifest, revision: 1 }, { id: specification.profile-reference-loading, revision: 3 }, { id: specification.lite-inline-contract, revision: 1 }, { id: ui.penpot-project-design, revision: 1 }, { id: ui.separate-design-planning, revision: 1 }, { id: 0122a67c-c0d9-4813-859b-fddba7a07a6b, revision: 1 } ] }, { item_index: 100, item_key: requirement:UI-001, verdict: covered, explanation: "The original shared-Penpot design agreement is narrowed by the explicit separate-design stage and the later conditional-design-output clarification. Exact declared outputs, real linkage and snapshot evidence, bounded remote authority, preservation of human edits and blocked dependent work retain the original safety conditions without requiring designs for every active UI profile.", requirement_ids: [ UI-001 ], source_refs: [ { id: ui.penpot-project-design, revision: 1 }, { id: ui.separate-design-planning, revision: 1 }, { id: 0122a67c-c0d9-4813-859b-fddba7a07a6b, revision: 1 } ] }, { item_index: 101, item_key: requirement:PLAN-004, verdict: covered, explanation: "The separate-design-planning answer explicitly owns this post-plan stage, its prerequisites, installed external Penpot capabilities, bounded artifacts and handoff updates. The later clarification makes no declared outputs not applicable; main planning stops with only genuinely design-dependent packets pending and does not launch the next workflow.", requirement_ids: [ PLAN-004 ], source_refs: [ { id: ui.separate-design-planning, revision: 1 }, { id: 0122a67c-c0d9-4813-859b-fddba7a07a6b, revision: 1 } ] }, { item_index: 102, item_key: requirement:STATE-001, verdict: covered, explanation: "The four-YAML-contract decision justifies root-owned structural schemas, generated selective copies, strict saved-state validation and cross-file checks. Its compatibility, extension, no automatic migration and missing-validator rules are retained; journal access remains governed by the separately available read-only MCP contract rather than an invented local fallback.", requirement_ids: [ STATE-001 ], source_refs: [ { id: state.four-yaml-contracts, revision: 1 } ] }, { item_index: 103, item_key: requirement:EXEC-001, verdict: covered, explanation: "The execution-contract and later Git decision justify exactly one authorized packet, current inputs, tracked/staged/untracked evidence, no implicit Git initialization, and no clean-tree or existing-commit gate. Correct-check failures remain incomplete, product/architecture changes return to their owner, and optional reviews/commits never become next-packet gates.", requirement_ids: [ EXEC-001 ], source_refs: [ { id: workflow-loop.git-prerequisite, revision: 1 }, { id: workflow-loop.yaml-checkpoint-validation, revision: 1 }, { id: workflow-loop.large-decision-ledger-access, revision: 2 }, { id: workflow-loop.execution-contract, revision: 1 } ] }, { item_index: 104, item_key: requirement:EVAL-001, verdict: covered, explanation: "The execution-loop and model-role decisions establish isolated fresh-context trials, frozen simulated answers, actual traces and the original host/model matrix. Later proportionate-proof and campaign decisions preserve the original restrictions while correctly limiting that matrix to its authorized campaign; missing native evidence remains unverified and authorizes no new launches.", requirement_ids: [ EVAL-001 ], source_refs: [ { id: workflow-loop.proportionate-prove, revision: 1 }, { id: workflow-loop.specification-state-ownership, revision: 1 }, { id: workflow-loop.git-prerequisite, revision: 1 }, { id: workflow-loop.yaml-checkpoint-validation, revision: 1 }, { id: workflow-loop.large-decision-ledger-access, revision: 2 }, { id: workflow-loop.reader-available-local-validation, revision: 1 }, { id: workflow-loop.execution-contract, revision: 1 }, { id: workflow-loop.model-roles, revision: 1 }, { id: workflow-loop.claude-deferral, revision: 2 }, { id: workflow-loop.budget-checkpoint, revision: 2 } ] }, { item_index: 105, item_key: requirement:QUAL-001, verdict: covered, explanation: "The fresh-reviewer decision explicitly requires a host-native isolated reviewer with only the artifact and evaluation contract, finding reconciliation and read-only behavior. External cross-model CLI use remains optional and separately requested; unavailable isolation stops rather than relabeling self-review as independent.", requirement_ids: [ QUAL-001 ], source_refs: [ { id: quality.doubt-reviewer-isolation, revision: 1 } ] }, { item_index: 106, item_key: requirement:HOST-001, verdict: covered, explanation: "The supported-host and observed Agent Skills sources justify Codex plus Claude Code and the shared directory-based SKILL.md entry point. Host-only semantics remain outside the portable source unless both hosts actually accept them, consistent with isolated generation.", requirement_ids: [ HOST-001 ], source_refs: [ { id: compatibility.supported-hosts, revision: 1 }, { id: observed.agent-skills-core, revision: 1 }, { id: workflow-loop.model-roles, revision: 1 } ] }, { item_index: 107, item_key: requirement:HOST-002, verdict: covered, explanation: "The v1-surfaces decision supports local Codex CLI/IDE, local Claude, native marketplaces and hosted/organization distribution without project-committed skill declarations. The explicit hosted limitation preserves global-only ownership rather than claiming every possible host surface is supported.", requirement_ids: [ HOST-002 ], source_refs: [ { id: compatibility.v1-surfaces, revision: 1 }, { id: workflow-loop.model-roles, revision: 1 }, { id: operations.existing-copy-migration, revision: 3 } ] }, { item_index: 108, item_key: requirement:HOST-003, verdict: covered, explanation: "The desktop-platform answer covers Linux, macOS and Windows; the requirement ties architectures to the selected runtime and client support instead of promising project binaries. It defines platform acceptance as pinned-upstream global installation with no consuming-project writes.", requirement_ids: [ HOST-003 ], source_refs: [ { id: compatibility.desktop-platforms, revision: 1 } ] }, { item_index: 109, item_key: requirement:HOST-004, verdict: covered, explanation: "The client-version and pinned-tool sources justify exact reviewed skills and runtime baselines, oldest verified hosts and current-stable acceptance evidence. Reviewed upgrades require renewed installation/privacy/compatibility evidence; commands and CI cannot silently float to latest.", requirement_ids: [ HOST-004 ], source_refs: [ { id: compatibility.client-version-policy, revision: 1 }, { id: compatibility.skills-cli-version, revision: 1 } ] }, { item_index: 110, item_key: requirement:ARCH-001, verdict: covered, explanation: "The portability revisions preserve a single authoritative template source and demand separate generated host directories because shared global identities cannot safely hold divergent hand-edited content. Declared substitutions, fail-closed unknown hosts/variables and committed generated artifacts are consistent consequences of that approved architecture.", requirement_ids: [ ARCH-001 ], source_refs: [ { id: observed.agent-skills-core, revision: 1 }, { id: distribution.installation-model, revision: 2 }, { id: architecture.skill-portability, revision: 2 }, { id: observed.skills-cli-shared-directory, revision: 2 }, { id: architecture.engineering-manual-form, revision: 2 } ] }, { item_index: 111, item_key: requirement:ARCH-002, verdict: covered, explanation: "The packaging-difference and portability sources justify one canonical release model generating separate complete bundles, matching marketplaces and the catalog. Regeneration/diff and cross-host leakage checks preserve the agreed host isolation rather than creating independent authored workflow trees.", requirement_ids: [ ARCH-002 ], source_refs: [ { id: observed.host-packaging-difference, revision: 1 }, { id: distribution.installation-model, revision: 2 }, { id: architecture.skill-portability, revision: 2 }, { id: observed.skills-cli-shared-directory, revision: 2 }, { id: distribution.skill-dependencies, revision: 3 }, { id: release.publication-gate, revision: 1 } ] }, { item_index: 112, item_key: requirement:ARCH-003, verdict: covered, explanation: The canonical-source decision explicitly makes Prompt MCP an initial extraction source and this repository authoritative afterwards. Global skills/native plugins replace copying as the supported consumption path; no bidirectional synchronization is added., requirement_ids: [ ARCH-003 ], source_refs: [ { id: ownership.canonical-source, revision: 1 } ] }, { item_index: 113, item_key: requirement:INV-001, verdict: covered, explanation: "The explicit-only decision requires both hosts' disable-implicit/model-invocation controls while preserving user invocation in global and native-plugin modes. Related-workflow recommendations do not authorize loading or running another workflow, and documentation must verify host-specific explicit syntax.", requirement_ids: [ INV-001 ], source_refs: [ { id: observed.skill-context-disclosure, revision: 1 }, { id: invocation.explicit-only, revision: 1 } ] }, { item_index: 114, item_key: requirement:INV-002, verdict: covered, explanation: "The capability floor preserves the explicit-only decision on every supported surface. A host that cannot enforce the policy is excluded until an equivalent verified mechanism exists, rather than silently weakening the agreed invocation restriction.", requirement_ids: [ INV-002 ], source_refs: [ { id: invocation.explicit-only, revision: 1 }, { id: compatibility.v1-surfaces, revision: 1 } ] }, { item_index: 115, item_key: requirement:TOK-001, verdict: covered, explanation: "The context-disclosure and strict-refinement-budget sources justify fitting the full catalog into unmodified native defaults, with actual version-specific discovery evidence. No skill omission, description truncation or user-budget increase may manufacture a pass.", requirement_ids: [ TOK-001 ], source_refs: [ { id: observed.skill-context-disclosure, revision: 1 }, { id: quality.skill-refinement-budget, revision: 2 } ] }, { item_index: 116, item_key: requirement:TOK-002, verdict: covered, explanation: "The progressive-disclosure decisions preserve metadata-only discovery before invocation, conditional selected references afterwards and no unrelated body preloading. Exact active-profile loading and avoiding repeated unchanged reads implement the agreed context-efficiency boundary without disabling required guidance.", requirement_ids: [ TOK-002 ], source_refs: [ { id: observed.skill-context-disclosure, revision: 1 }, { id: quality.skill-refinement-budget, revision: 2 }, { id: architecture.engineering-manual-form, revision: 2 }, { id: specification.profile-reference-loading, revision: 3 }, { id: specification.artifact-name-source, revision: 1 }, { id: workflow-loop.model-roles, revision: 1 }, { id: specification.lite-inline-contract, revision: 1 } ] }, { item_index: 117, item_key: requirement:TOOL-001, verdict: covered, explanation: "The revised lifecycle-client and CLI-name decisions explicitly choose pinned upstream skills via npx and prohibit a custom executable, wrapper, state layout or experimental stable contract. Exact package integrity evidence supports reproducible dependency review rather than claiming upstream release-signature verification.", requirement_ids: [ TOOL-001 ], source_refs: [ { id: architecture.lifecycle-client, revision: 2 }, { id: interface.cli-name, revision: 2 }, { id: observed.skills-cli-contract, revision: 1 }, { id: compatibility.skills-cli-version, revision: 1 }, { id: security.release-integrity, revision: 1 } ] }, { item_index: 118, item_key: requirement:TOOL-002, verdict: covered, explanation: "The latest lifecycle, update and shared-directory sources justify separate one-agent matching-source add --copy commands, global list/removal and repeat-add replacement. The specification expressly excludes unsupported update --agent behavior, project scope, custom state, managed rollback and experimental lock restore while requiring equivalent PowerShell guidance.", requirement_ids: [ TOOL-002 ], source_refs: [ { id: operations.managed-lifecycle, revision: 2 }, { id: architecture.lifecycle-client, revision: 2 }, { id: operations.update-policy, revision: 2 }, { id: release.channels, revision: 1 }, { id: operations.local-version-layout, revision: 2 }, { id: operations.existing-copy-migration, revision: 3 }, { id: interface.install-selection-default, revision: 2 }, { id: operations.rollback-support, revision: 1 }, { id: observed.skills-cli-contract, revision: 1 }, { id: observed.skills-cli-shared-directory, revision: 2 }, { id: security.skills-cli-telemetry, revision: 1 } ] }, { item_index: 119, item_key: requirement:TOOL-003, verdict: covered, explanation: The recorded telemetry default requires the upstream opt-out in normative use and no transmission of installation events or skill content. The requirement distinguishes this project's commands and no-own-telemetry rule from third-party invocations it cannot control., requirement_ids: [ TOOL-003 ], source_refs: [ { id: security.skills-cli-telemetry, revision: 1 } ] }, { item_index: 120, item_key: requirement:DIST-001, verdict: covered, explanation: The latest hybrid-distribution answer requires separate rendered global artifacts and separate complete native host bundles from the same canonical release. Signed-release identity is consistent with the independently selected integrity policy., requirement_ids: [ DIST-001 ], source_refs: [ { id: distribution.installation-model, revision: 2 }, { id: security.release-integrity, revision: 1 } ] }, { item_index: 121, item_key: requirement:DIST-002, verdict: covered, explanation: "The global-location observation and explicit update-policy revision justify upstream-owned copied storage, no second state store and exclusively global lifecycle commands. Byte-for-byte project isolation operationalizes the preserved no-project-mutation prohibition.", requirement_ids: [ DIST-002 ], source_refs: [ { id: observed.global-skill-locations, revision: 1 }, { id: operations.update-policy, revision: 2 }, { id: operations.existing-copy-migration, revision: 3 } ] }, { item_index: 122, item_key: requirement:DIST-003, verdict: covered, explanation: "The activation-policy answer requires exclusive distribution mode and refusal of duplicates unless explicitly overridden. The added host inspection and unavailable-evidence rule make this a documented operator gate, consistent with the later no-custom-installer decision rather than pretending upstream enforces it.", requirement_ids: [ DIST-003 ], source_refs: [ { id: distribution.activation-policy, revision: 1 }, { id: architecture.lifecycle-client, revision: 2 } ] }, { item_index: 123, item_key: requirement:DIST-004, verdict: covered, explanation: The installation-granularity answer permits individual standalone skills and the complete collection. Delegating unknown-name handling to the pinned upstream tool preserves the no-custom-CLI boundary while requiring its actual behavior to be tested and documented., requirement_ids: [ DIST-004 ], source_refs: [ { id: distribution.installation-granularity, revision: 1 } ] }, { item_index: 124, item_key: requirement:DIST-005, verdict: covered, explanation: The latest dependency and shared-layout decisions require canonical standalone/bundle-required presentation and complete matching host bundles for dependent workflows. Rejecting a custom resolver preserves the upstream-tooling choice without implying the upstream installer itself validates sibling dependencies., requirement_ids: [ DIST-005 ], source_refs: [ { id: distribution.skill-dependencies, revision: 3 }, { id: architecture.engineering-manual-layout, revision: 2 }, { id: architecture.lifecycle-client, revision: 2 } ] }, { item_index: 125, item_key: requirement:DIST-006, verdict: covered, explanation: "The plugin-granularity answer selects one complete plugin per host; packaging and portability revisions require isolated manifests, question tools, guidance names and sidecars. Matching marketplace/release versions preserve the signed shared release identity.", requirement_ids: [ DIST-006 ], source_refs: [ { id: observed.host-packaging-difference, revision: 1 }, { id: architecture.skill-portability, revision: 2 }, { id: distribution.plugin-granularity, revision: 1 }, { id: security.release-integrity, revision: 1 }, { id: release.publication-gate, revision: 1 } ] }, { item_index: 126, item_key: requirement:DIST-007, verdict: covered, explanation: The public-directory answer permits Git-backed public-repository marketplaces while explicitly deferring vendor-directory submission. Immutable released host-specific content follows the selected release-integrity contract and does not authorize publication here., requirement_ids: [ DIST-007 ], source_refs: [ { id: distribution.public-directory-scope, revision: 1 }, { id: security.release-integrity, revision: 1 } ] }, { item_index: 127, item_key: requirement:INT-001, verdict: covered, explanation: "The latest Prompt MCP replacement and automatic-approval decisions justify callable native questions, immediate non-sensitive checkpoints and exact conversational fallback when unavailable. Missing/cancelled interactions are not consent; gap review, confirmed scope, authoritative user edits and separate planning/implementation authority are all preserved.", requirement_ids: [ INT-001 ], source_refs: [ { id: compatibility.prompt-mcp-platform-gap, revision: 3 }, { id: specification.automatic-approval, revision: 1 }, { id: workflow-loop.execution-contract, revision: 1 }, { id: workflow-loop.model-roles, revision: 1 } ] }, { item_index: 128, item_key: requirement:MCP-001, verdict: covered, explanation: The third platform-gap revision explicitly removes Prompt MCP as an operational dependency from every collection workflow. Historical provenance and migration/non-goal references remain permissible without reviving the superseded dedicated-interview integration., requirement_ids: [ MCP-001 ], source_refs: [ { id: compatibility.prompt-mcp-platform-gap, revision: 3 } ] }, { item_index: 129, item_key: requirement:MCP-002, verdict: covered, explanation: "The large-decision-ledger-access revision and available linked Decision Ledger MCP specification justify a separate read-only bounded reader with explicit project/specification inputs and process-permission boundaries. Mandatory journal reads/read-back, no local fallback and no automatic installation/registration remain faithful; this older reader contract is not silently replaced by current scenario-server implementation details.", requirement_ids: [ MCP-002 ], source_refs: [ { id: workflow-loop.large-decision-ledger-access, revision: 2 } ] }, { item_index: 130, item_key: requirement:SEC-001, verdict: covered, explanation: "The latest existing-copy-migration answer explicitly excludes discovery, audit, migration and mutation of consuming-project skill copies. Global-only commands and isolation tests enforce that negative obligation, including unrelated project files and prohibition of recursive development-root discovery.", requirement_ids: [ SEC-001 ], source_refs: [ { id: operations.existing-copy-migration, revision: 3 }, { id: operations.update-policy, revision: 2 } ] }, { item_index: 131, item_key: requirement:SEC-002, verdict: covered, explanation: "The signed-tags/checksums answer requires authenticating release tags and checking artifacts before use, and the publication answer supplies the human-created SemVer tag gate. Trust anchor, immutable identity, matched versions and stop-on-unverified behavior make the selected integrity policy testable without crediting npm integrity as tag verification.", requirement_ids: [ SEC-002 ], source_refs: [ { id: security.release-integrity, revision: 1 }, { id: release.publication-gate, revision: 1 } ] }, { item_index: 132, item_key: requirement:SEC-003, verdict: covered, explanation: "Pinned package identity and disabled telemetry follow the recorded tool/telemetry decisions; least privilege, safe defaults and redacted sensitive-data handling implement the agreed senior-engineering security standard and approved release baseline. Immutable actions and release-job-only write authority constrain that authorized CI boundary and do not authorize hooks or downloaded lifecycle code on marketplace discovery.", requirement_ids: [ SEC-003 ], source_refs: [ { id: security.skills-cli-telemetry, revision: 1 }, { id: compatibility.skills-cli-version, revision: 1 }, { id: quality.engineering-standard, revision: 1 }, { id: security.release-integrity, revision: 1 }, { id: release.publication-gate, revision: 1 }, { id: approval.spec, revision: 4 } ] }, { item_index: 133, item_key: requirement:REL-001, verdict: covered, explanation: "The versioning revision and stable-channel answer justify one collection SemVer, MAJOR for incompatible contracts/identity or weaker safety, MINOR for additive capabilities and PATCH for compatible corrections. This remains consistent with SKILL-003's minimum bump language and matching host metadata.", requirement_ids: [ REL-001 ], source_refs: [ { id: release.versioning-policy, revision: 2 }, { id: release.channels, revision: 1 } ] }, { item_index: 134, item_key: requirement:REL-002, verdict: covered, explanation: The publication-gate answer explicitly selects a maintainer-created signed tag and CI verification/build/publication with no invented version. The hosting-provider answer selects GitHub; separate external publication authorization remains mandatory., requirement_ids: [ REL-002 ], source_refs: [ { id: security.release-integrity, revision: 1 }, { id: release.publication-gate, revision: 1 }, { id: distribution.hosting-provider, revision: 1 } ] }, { item_index: 135, item_key: requirement:REL-003, verdict: covered, explanation: "Repository-access, hosting, license and import-rights answers explicitly establish a public GitHub canonical source, MIT coverage and no separate clean-room extraction workflow. The requirement does not imply permission for an unrequested release.", requirement_ids: [ REL-003 ], source_refs: [ { id: distribution.repository-access, revision: 1 }, { id: distribution.license, revision: 1 }, { id: distribution.import-rights, revision: 1 }, { id: distribution.hosting-provider, revision: 1 } ] }, { item_index: 136, item_key: requirement:DOC-001, verdict: covered, explanation: "This guidance consolidates already established installation, isolation, invocation, budgets, manual, adaptive-scope, question and release contracts rather than introducing a new lifecycle. The documentation-specific answers preserve repository-selected artifact language and conditional developer documentation; verified behavior must remain distinguishable from assumptions.", requirement_ids: [ DOC-001 ], source_refs: [ { id: planning.developer-documentation-threshold, revision: 1 }, { id: planning.developer-documentation-language, revision: 1 }, { id: specification.automatic-approval, revision: 1 }, { id: scope.initial-skills, revision: 1 }, { id: distribution.skill-dependencies, revision: 3 }, { id: invocation.explicit-only, revision: 1 }, { id: quality.skill-refinement-budget, revision: 2 }, { id: quality.engineering-standard, revision: 1 }, { id: planning.symbol-level-architecture, revision: 1 }, { id: architecture.lifecycle-client, revision: 2 }, { id: operations.update-policy, revision: 2 }, { id: security.release-integrity, revision: 1 }, { id: compatibility.prompt-mcp-platform-gap, revision: 3 }, { id: distribution.activation-policy, revision: 1 }, { id: compatibility.client-version-policy, revision: 1 }, { id: compatibility.v1-surfaces, revision: 1 }, { id: specification.adaptive-depth, revision: 1 }, { id: specification.profile-model, revision: 1 }, { id: planning.scope-precondition, revision: 1 }, { id: quality.test-first-verification, revision: 1 } ] }, { item_index: 137, item_key: requirement:ACC-001, verdict: covered, explanation: "The portability, dependency, adaptive-specification and context decisions justify acceptance for stable names, complete resources, deterministic host generation, failure cases and confirmed-scope specification behavior. Manual identity and host isolation are verified alongside the source requirements, not substituted for behavioral evidence.", requirement_ids: [ ACC-001 ], source_refs: [ { id: architecture.skill-portability, revision: 2 }, { id: distribution.skill-dependencies, revision: 3 }, { id: guidance.host-supplied-context, revision: 1 }, { id: specification.automatic-approval, revision: 1 }, { id: specification.adaptive-depth, revision: 1 }, { id: specification.profile-model, revision: 1 }, { id: quality.engineering-standard, revision: 1 }, { id: architecture.engineering-manual-form, revision: 2 }, { id: architecture.engineering-manual-layout, revision: 2 }, { id: invocation.explicit-only, revision: 1 } ] }, { item_index: 138, item_key: requirement:ACC-002, verdict: covered, explanation: "The latest update and shared-directory evidence require one-host matching-source global installs and replacements with --copy, complete bundles, per-agent list and selected removal. Dependency-failure checks preserve the canonical standalone classification and no-project/custom-state guarantees without claiming unsupported upstream flags.", requirement_ids: [ ACC-002 ], source_refs: [ { id: operations.update-policy, revision: 2 }, { id: observed.skills-cli-shared-directory, revision: 2 }, { id: distribution.skill-dependencies, revision: 3 }, { id: operations.existing-copy-migration, revision: 3 }, { id: architecture.lifecycle-client, revision: 2 } ] }, { item_index: 139, item_key: requirement:ACC-003, verdict: covered, explanation: "The three-platform answer and global-only/no-project-mutation contract justify isolated-profile lifecycle tests on Linux, macOS and Windows. Preserving real host, npm, Git and user-home state is the agreed isolation safeguard, not permission to alter those profiles as test setup.", requirement_ids: [ ACC-003 ], source_refs: [ { id: compatibility.desktop-platforms, revision: 1 }, { id: operations.existing-copy-migration, revision: 3 }, { id: operations.update-policy, revision: 2 }, { id: approval.spec, revision: 4 } ] }, { item_index: 140, item_key: requirement:ACC-004, verdict: covered, explanation: "Explicit-only host controls, supported-host packaging and native-question replacement justify actual discovery/invocation, negative unqualified-prompt checks, plugin validation and usable question tools. The acceptance does not infer cross-host behavior merely from static generation or waive a surface's capability floor.", requirement_ids: [ ACC-004 ], source_refs: [ { id: invocation.explicit-only, revision: 1 }, { id: compatibility.supported-hosts, revision: 1 }, { id: observed.host-packaging-difference, revision: 1 }, { id: compatibility.prompt-mcp-platform-gap, revision: 3 } ] }, { item_index: 141, item_key: requirement:ACC-005, verdict: covered, explanation: "The human-tag/CI-publication decision and release-integrity contract justify test, version, checksum, dependency-identity and immutable-marketplace gates before stable release. Excluding a custom executable preserves the selected upstream lifecycle architecture.", requirement_ids: [ ACC-005 ], source_refs: [ { id: release.publication-gate, revision: 1 }, { id: security.release-integrity, revision: 1 }, { id: architecture.lifecycle-client, revision: 2 }, { id: compatibility.skills-cli-version, revision: 1 } ] }, { item_index: 142, item_key: requirement:ACC-006, verdict: covered, explanation: "The selected v1 surfaces and desktop-platform decision justify separately authorized manual acceptance across local, native marketplace, hosted/account and managed modes, with no project writes. Public-directory submission and managed rollback remain explicit exclusions, not unfinished mandatory release checks.", requirement_ids: [ ACC-006 ], source_refs: [ { id: compatibility.v1-surfaces, revision: 1 }, { id: compatibility.desktop-platforms, revision: 1 } ] }, { item_index: 143, item_key: requirement:ACC-007, verdict: covered, explanation: "The strict-budget and context-adaptation decisions are rendered as exact size checks, unmodified native-discovery evidence and conditional sentinel-loading/outcome-equivalence fixtures. The acceptance requires actual host results and does not certify context efficiency by source size alone.", requirement_ids: [ ACC-007 ], source_refs: [ { id: quality.skill-refinement-budget, revision: 2 }, { id: guidance.host-supplied-context, revision: 1 }, { id: scope.initial-skills, revision: 1 } ] }, { item_index: 144, item_key: requirement:ACC-008, verdict: covered, explanation: "The manual-layout, dependency and engineering-standard decisions justify identical authenticated local copies, same-release companion checks and stop-on-missing/tampered resources. The execution/test-first decisions add test-discipline identity and contextual artifact checks while preserving repository precedence and specification's standalone sibling classification.", requirement_ids: [ ACC-008 ], source_refs: [ { id: distribution.skill-dependencies, revision: 3 }, { id: quality.engineering-standard, revision: 1 }, { id: workflow-loop.execution-contract, revision: 1 }, { id: architecture.engineering-manual-form, revision: 2 }, { id: architecture.engineering-manual-layout, revision: 2 }, { id: quality.test-first-verification, revision: 1 } ] }, { item_index: 145, item_key: requirement:ACC-009, verdict: covered, explanation: "The architecture, adaptive-scope and test/documentation decisions justify language-appropriate units, confirmed-input gates, exact depth outputs and test-first sequencing. The acceptance preserves optional warranted profile artifacts, repository-language documentation and production non-mutation in planning mode.", requirement_ids: [ ACC-009 ], source_refs: [ { id: planning.symbol-level-architecture, revision: 1 }, { id: quality.test-first-verification, revision: 1 }, { id: planning.developer-documentation-threshold, revision: 1 }, { id: planning.developer-documentation-language, revision: 1 }, { id: specification.adaptive-depth, revision: 1 }, { id: specification.profile-model, revision: 1 }, { id: planning.scope-precondition, revision: 1 }, { id: planning.lite-output, revision: 1 }, { id: specification.profile-reference-loading, revision: 3 }, { id: specification.artifact-name-source, revision: 1 }, { id: workflow-loop.execution-contract, revision: 1 }, { id: workflow-loop.model-roles, revision: 1 }, { id: specification.lite-inline-contract, revision: 1 } ] }, { item_index: 146, item_key: requirement:ACC-010, verdict: covered, explanation: "The fresh-reviewer decision directly supports isolated native subagent fixtures, bounded unbiased inputs, reconciliation and read-only work. Missing reviewer capability must stop with an explicit limitation; neither external CLI use nor same-context self-review can replace it.", requirement_ids: [ ACC-010 ], source_refs: [ { id: quality.doubt-reviewer-isolation, revision: 1 } ] }, { item_index: 147, item_key: profile:core, verdict: covered, explanation: "Core is relevant because this collection exposes skill invocation, catalog/schema, renderer and upstream-lifecycle integration boundaries. HOST/ARCH/INV/STATE/TOOL and their ACC requirements define ownership, valid/invalid inputs, deterministic generation, compatibility, repeated replacement and failure gates; unchanged upstream CLI details remain upstream-owned, and the available linked reader contract supplies bounded journal interfaces. No additional material core scenario was found that survives these preserved contracts; the profile does not mandate a new core/contracts.yaml for this legacy manifest.", requirement_ids: [ HOST-001, HOST-003, HOST-004, ARCH-001, ARCH-002, INV-001, INV-002, STATE-001, MCP-002, TOOL-001, TOOL-002, ACC-001, ACC-002, ACC-003, MAN-002 ], source_refs: [] }, { item_index: 148, item_key: profile:operations, verdict: covered, explanation: "Operations is relevant to global install/replacement/removal, release publication and workflow resumption. TOOL/DIST/SEC/REL/DOC/EXEC and acceptance cover observable success/refusal, dependency absence, redacted evidence, repeat-add recovery, isolation, manual gates and explicit absence of managed rollback or retained installer state. This is finite developer tooling rather than an operated service requiring a new availability SLO; no concrete in-scope operational gap warrants extra deployment or quality artifacts.", requirement_ids: [ TOOL-002, DIST-002, DIST-003, SEC-002, SEC-003, REL-002, DOC-001, EXEC-001, ACC-002, ACC-003, ACC-005, ACC-006 ], source_refs: [] }, { item_index: 149, item_key: profile:security, verdict: covered, explanation: "Security is relevant to user-profile/project isolation, release authenticity, telemetry, generated host boundaries and sensitive decision/design state. SEC/TOOL/INV/MAN/STATE/MCP/UI and ACC define protected boundaries, required authority, strict validation, denial on unavailable verification, non-sensitive evidence and same-release recovery instructions across supported targets. The reader's process-permission trust boundary is explicitly disclosed; no new account-authentication service, retention store or speculative abuse feature is implied by this scope.", requirement_ids: [ SEC-001, SEC-002, SEC-003, TOOL-003, INV-002, MAN-001, STATE-001, MCP-002, UI-001, ACC-003, ACC-008 ], source_refs: [] }, { item_index: 150, item_key: profile:cross-surface, verdict: covered, explanation: "Cross-surface is relevant because the same skill identities and release must retain behavior across Codex and Claude, global copies and native plugins. HOST/ARCH/DIST/INV/INT/MAN plus ACC specify host-local boundaries, exclusive activation, exact native questions, shared release identity, mixed-version refusal and observable end-to-end discovery/invocation/isolation results. Separate per-host lifecycle operations intentionally do not promise a two-host atomic transaction; required combinations are named without inventing a full platform Cartesian product.", requirement_ids: [ HOST-002, ARCH-001, ARCH-002, DIST-003, DIST-006, INV-001, INV-002, INT-001, MAN-001, ACC-004, ACC-006, ACC-008 ], source_refs: [] }, { item_index: 151, item_key: context:specification, verdict: covered, explanation: "The fully read non-requirement prose and manifest agree on the canonical global-only collection, Deep scope and exactly core/operations/security/cross-surface active. Draft correctly represents the current in-progress review, and historical approval does not authorize this checker to finalize it. Existing planning-artifact references remain a deterministic legacy view rather than silently adding core/quality/design outputs; the context adds no contradictory behavioral promise.", requirement_ids: [ OUT-001, SCOPE-001, SPEC-001, PLAN-003, UI-001, PLAN-004, INT-001 ], source_refs: [] } ]
    - id: 4375aeb6-9410-4802-9c67-b743ade60406
      source_version: 68e5d0b9e6d1deebadea206d12cdc98871f459c0a6923c79dafd3d42558feaa2
      specification_version: 4baea13625b5c26f0d2afb7807db19a89e3b9e6a0a6bb4e7d6627faac31cbc38
      status_at_start: Draft
      created_at: 2026-09-07T08:46:40.933Z
      completed: true
      outcome: reviewed
      results: [ { item_index: 0, item_key: source:outcome.centralized-source, verdict: covered, explanation: OUT-001 establishes the separate canonical repository and global reuse without hand-maintained project copies., requirement_ids: [ OUT-001 ], source_refs: [ { id: outcome.centralized-source, revision: 1 } ] }, { item_index: 1, item_key: source:project.identity, verdict: covered, explanation: OUT-001 preserves the project identity. The personal checkout path selects the current working location rather than a portable release path; excluding that machine-specific path from artifacts follows SEC-003., requirement_ids: [ OUT-001, SEC-003 ], source_refs: [ { id: project.identity, revision: 1 } ] }, { item_index: 2, item_key: source:compatibility.supported-hosts, verdict: covered, explanation: HOST-001 explicitly supports Codex and Claude Code through the common Agent Skills directory format., requirement_ids: [ HOST-001 ], source_refs: [ { id: compatibility.supported-hosts, revision: 1 } ] }, { item_index: 3, item_key: source:scope.initial-skills, verdict: covered, explanation: SKILL-001 retains the source inventory and generalized workflow boundaries; SKILL-002 and SKILL-005 remove source-project assumptions. The later design-planning decision accounts for the sixteenth workflow., requirement_ids: [ SKILL-001, SKILL-002, SKILL-005, PLAN-004 ], source_refs: [ { id: scope.initial-skills, revision: 1 } ] }, { item_index: 4, item_key: source:release.versioning-policy, verdict: covered, explanation: REL-001 preserves collection-wide Semantic Versioning and defines compatible versus breaking changes; SKILL-003 treats public skill identity changes consistently with that policy., requirement_ids: [ REL-001, SKILL-003 ], source_refs: [ { id: release.versioning-policy, revision: 2 } ] }, { item_index: 5, item_key: source:operations.managed-lifecycle, verdict: covered, explanation: "TOOL-002 covers add, replacement, list and removal through the selected tool. The later explicit rollback deferral and host-specific repeat-add decision replace the former managed rollback/update implementation.", requirement_ids: [ TOOL-002 ], source_refs: [ { id: operations.managed-lifecycle, revision: 2 } ] }, { item_index: 6, item_key: source:observed.agent-skills-core, verdict: covered, explanation: HOST-001 and ARCH-001 retain the common directory-based entry point and a single portable authored source while rendering host differences., requirement_ids: [ HOST-001, ARCH-001 ], source_refs: [ { id: observed.agent-skills-core, revision: 1 } ] }, { item_index: 7, item_key: source:observed.global-skill-locations, verdict: covered, explanation: DIST-002 delegates global personal paths to the pinned upstream tool; TOOL-002 requires global copied installations rather than introducing a competing path/state implementation., requirement_ids: [ DIST-002, TOOL-002 ], source_refs: [ { id: observed.global-skill-locations, revision: 1 } ] }, { item_index: 8, item_key: source:observed.host-packaging-difference, verdict: covered, explanation: "ARCH-002 and DIST-006 separate manifests, marketplace metadata and target-specific bundles while preserving the same workflow identities.", requirement_ids: [ ARCH-002, DIST-006 ], source_refs: [ { id: observed.host-packaging-difference, revision: 1 } ] }, { item_index: 9, item_key: source:distribution.installation-model, verdict: covered, explanation: "ARCH-001, ARCH-002 and DIST-001 preserve hybrid global/native distribution from one source. The later rendered-artifact choice replaces mixed runtime instructions and supersedes the old shared-link mechanism.", requirement_ids: [ ARCH-001, ARCH-002, DIST-001 ], source_refs: [ { id: distribution.installation-model, revision: 2 } ] }, { item_index: 10, item_key: source:compatibility.v1-surfaces, verdict: covered, explanation: "HOST-002 retains local, marketplace, hosted and organization distribution. The project-local hosted exclusion follows the separate no-project-mutation decision, and ACC-006 requires concrete manual acceptance for the retained surfaces.", requirement_ids: [ HOST-002, ACC-006, SCOPE-001 ], source_refs: [ { id: compatibility.v1-surfaces, revision: 1 } ] }, { item_index: 11, item_key: source:compatibility.desktop-platforms, verdict: covered, explanation: "HOST-003 and ACC-003 retain Linux, macOS and Windows support and filesystem isolation. TOOL-002 defines replacement/removal and PowerShell-equivalent commands; managed rollback was separately deferred.", requirement_ids: [ HOST-003, ACC-003, TOOL-002 ], source_refs: [ { id: compatibility.desktop-platforms, revision: 1 } ] }, { item_index: 12, item_key: source:architecture.lifecycle-client, verdict: covered, explanation: "TOOL-001 selects the pinned upstream npx tool and prohibits a custom executable, wrapper and state layout; TOOL-002 supplies the supported host-specific lifecycle contract.", requirement_ids: [ TOOL-001, TOOL-002 ], source_refs: [ { id: architecture.lifecycle-client, revision: 2 } ] }, { item_index: 13, item_key: source:architecture.skill-portability, verdict: covered, explanation: ARCH-001 and ARCH-002 require strict template rendering and isolated generated bundles. ACC-001 and DIST-006 preserve rejection of unknown variables and cross-host leakage., requirement_ids: [ ARCH-001, ARCH-002, DIST-006, ACC-001 ], source_refs: [ { id: architecture.skill-portability, revision: 2 } ] }, { item_index: 14, item_key: source:ownership.canonical-source, verdict: covered, explanation: "ARCH-003 makes this repository authoritative after extraction, excluding bidirectional synchronization and project copying.", requirement_ids: [ ARCH-003 ], source_refs: [ { id: ownership.canonical-source, revision: 1 } ] }, { item_index: 15, item_key: source:operations.update-policy, verdict: covered, explanation: TOOL-002 and ACC-002 require one matching add --copy per host and repeat that command for explicit updates; DIST-002 preserves global-only scope. SCOPE-001 excludes automatic background updates., requirement_ids: [ TOOL-002, DIST-002, ACC-002, SCOPE-001 ], source_refs: [ { id: operations.update-policy, revision: 2 } ] }, { item_index: 16, item_key: source:security.release-integrity, verdict: covered, explanation: SEC-002 requires authenticating the tag and checksums before use and stopping when verification fails or is unavailable; REL-002 also blocks publication on unverifiable signatures., requirement_ids: [ SEC-002, REL-002 ], source_refs: [ { id: security.release-integrity, revision: 1 } ] }, { item_index: 17, item_key: source:compatibility.prompt-mcp-platform-gap, verdict: covered, explanation: "INT-001 applies standard host-native questions across the named workflows, preserves actual-answer handling and avoids entering plan mode solely to ask. MCP-001 retires Prompt MCP across the collection.", requirement_ids: [ INT-001, MCP-001 ], source_refs: [ { id: compatibility.prompt-mcp-platform-gap, revision: 3 } ] }, { item_index: 18, item_key: source:distribution.repository-access, verdict: covered, explanation: REL-003 retains public GitHub distribution and the selected open-source licensing scope., requirement_ids: [ REL-003 ], source_refs: [ { id: distribution.repository-access, revision: 1 } ] }, { item_index: 19, item_key: source:distribution.license, verdict: covered, explanation: REL-003 names the MIT License for the skill collection and supporting artifacts; the custom CLI was separately excluded., requirement_ids: [ REL-003 ], source_refs: [ { id: distribution.license, revision: 1 } ] }, { item_index: 20, item_key: source:distribution.activation-policy, verdict: covered, explanation: "DIST-003 requires inspecting existing activation, refusing duplicates without explicit override, and not treating missing host evidence as absence. It covers different releases and delegates the gate to the documented operator procedure.", requirement_ids: [ DIST-003 ], source_refs: [ { id: distribution.activation-policy, revision: 1 } ] }, { item_index: 21, item_key: source:compatibility.client-version-policy, verdict: covered, explanation: "HOST-004 records minimum and tested versions and requires continuing pinned current-stable qualification. INV-002, INT-001 and MCP-002 define unsupported or unavailable required-capability outcomes without weakening policy.", requirement_ids: [ HOST-004, INV-002, INT-001, MCP-002 ], source_refs: [ { id: compatibility.client-version-policy, revision: 1 } ] }, { item_index: 22, item_key: source:release.channels, verdict: covered, explanation: REL-001 keeps one stable channel and SCOPE-001 excludes preview and rolling-main channels; TOOL-002 uses reviewed pinned distribution tooling., requirement_ids: [ REL-001, TOOL-002, SCOPE-001 ], source_refs: [ { id: release.channels, revision: 1 } ] }, { item_index: 23, item_key: source:operations.local-version-layout, verdict: covered, explanation: TOOL-001 and DIST-002 assign layout and lifecycle state to the established tool. The newer ownership decision replaces the old project-managed immutable-directory/current-pointer design., requirement_ids: [ TOOL-002, TOOL-001, DIST-002 ], source_refs: [ { id: operations.local-version-layout, revision: 2 } ] }, { item_index: 24, item_key: source:distribution.installation-granularity, verdict: covered, explanation: DIST-004 retains individual selection for standalone skills. SKILL-004 and DIST-005 implement the later explicit restriction that dependent workflows require the complete bundle., requirement_ids: [ DIST-004, SKILL-004, DIST-005 ], source_refs: [ { id: distribution.installation-granularity, revision: 1 } ] }, { item_index: 25, item_key: source:distribution.skill-dependencies, verdict: covered, explanation: "SKILL-004 preserves the specification-to-planning-to-implementation direction and the later design-planning dependency. MAN-001 authenticates local shared copies and dependency chains, with no reverse planning dependency or network fallback.", requirement_ids: [ SKILL-004, MAN-001, DIST-005, ACC-001, ACC-008 ], source_refs: [ { id: distribution.skill-dependencies, revision: 3 } ] }, { item_index: 26, item_key: source:distribution.plugin-granularity, verdict: covered, explanation: DIST-006 provides one complete plugin per host with matching identities and excludes per-skill marketplace plugins., requirement_ids: [ DIST-006 ], source_refs: [ { id: distribution.plugin-granularity, revision: 1 } ] }, { item_index: 27, item_key: source:operations.existing-copy-migration, verdict: covered, explanation: "SCOPE-001 and SEC-001 prohibit inspecting or mutating project-local skill copies, including recursive discovery; TOOL-002 confines normative lifecycle commands to global scope.", requirement_ids: [ SCOPE-001, TOOL-002, SEC-001 ], source_refs: [ { id: operations.existing-copy-migration, revision: 3 } ] }, { item_index: 28, item_key: source:release.publication-gate, verdict: covered, explanation: "REL-002 retains the human-signed tag gate, cryptographic CI verification, no invented version and separate publication authority. ACC-005 requires successful validation and consistent immutable release artifacts.", requirement_ids: [ REL-002, ACC-005 ], source_refs: [ { id: release.publication-gate, revision: 1 } ] }, { item_index: 29, item_key: source:distribution.import-rights, verdict: covered, explanation: REL-003 preserves the selected MIT distribution and the explicit decision not to introduce a separate clean-room or provenance workflow; this is not an independent legal-rights finding., requirement_ids: [ REL-003 ], source_refs: [ { id: distribution.import-rights, revision: 1 } ] }, { item_index: 30, item_key: source:distribution.public-directory-scope, verdict: covered, explanation: DIST-007 preserves installable Git marketplaces and defers vendor-directory submission to a separate decision., requirement_ids: [ DIST-007 ], source_refs: [ { id: distribution.public-directory-scope, revision: 1 } ] }, { item_index: 31, item_key: source:interface.cli-name, verdict: covered, explanation: "TOOL-001 expressly excludes a project lifecycle executable and selects the pinned upstream tool, replacing the old executable-name choice.", requirement_ids: [ TOOL-001 ], source_refs: [ { id: interface.cli-name, revision: 2 } ] }, { item_index: 32, item_key: source:interface.install-selection-default, verdict: covered, explanation: TOOL-002 uses explicit selections and the pinned upstream contract; TOOL-001 forbids redefining upstream flags. The newer decision supersedes the custom omitted-selection diagnostic., requirement_ids: [ TOOL-002 ], source_refs: [ { id: interface.install-selection-default, revision: 2 } ] }, { item_index: 33, item_key: source:distribution.hosting-provider, verdict: covered, explanation: "REL-002 and REL-003 retain GitHub, GitHub Actions, signed tags and GitHub Release ownership.", requirement_ids: [ REL-002, REL-003 ], source_refs: [ { id: distribution.hosting-provider, revision: 1 } ] }, { item_index: 34, item_key: source:approval.spec, verdict: covered, explanation: "The approval source and its predecessor amendments retain the canonical global-only distribution, token refinement and engineering/planning obligations in OUT-001, TOOL-001, SCOPE-001, SKILL-005, INV-001, TOK-001, MAN-002 and PLAN-001. Its historical approval does not approve this new review.", requirement_ids: [ OUT-001, TOOL-001, SCOPE-001, SKILL-005, INV-001, TOK-001, MAN-002, PLAN-001 ], source_refs: [ { id: approval.spec, revision: 4 } ] }, { item_index: 35, item_key: source:operations.rollback-support, verdict: covered, explanation: SCOPE-001 and TOOL-002 explicitly defer managed rollback and exclude experimental restore/custom lifecycle implementations., requirement_ids: [ SCOPE-001, TOOL-002 ], source_refs: [ { id: operations.rollback-support, revision: 1 } ] }, { item_index: 36, item_key: source:observed.skills-cli-contract, verdict: covered, explanation: "TOOL-001 and TOOL-002 retain the pinned upstream lifecycle delegation. HOST-004 supplies the exact reviewed version and Node floor, while the later repeat-add decision replaces use of upstream update for this collection.", requirement_ids: [ TOOL-001, TOOL-002, HOST-004 ], source_refs: [ { id: observed.skills-cli-contract, revision: 1 } ] }, { item_index: 37, item_key: source:security.skills-cli-telemetry, verdict: covered, explanation: "TOOL-003 requires the opt-out in normative commands and CI, discloses upstream telemetry and collects none of its own. SEC-003 preserves the same supply-chain privacy safeguard.", requirement_ids: [ TOOL-003, SEC-003 ], source_refs: [ { id: security.skills-cli-telemetry, revision: 1 } ] }, { item_index: 38, item_key: source:compatibility.skills-cli-version, verdict: covered, explanation: "TOOL-001 and HOST-004 require an exact reviewed dependency and explicit fully revalidated upgrades, with no floating latest.", requirement_ids: [ TOOL-001, HOST-004 ], source_refs: [ { id: compatibility.skills-cli-version, revision: 1 } ] }, { item_index: 39, item_key: source:observed.skill-context-disclosure, verdict: covered, explanation: INV-001 preserves explicit-only activation; TOK-001 acknowledges discovery metadata and TOK-002 limits selected bodies and conditional resources to their routing conditions., requirement_ids: [ INV-001, TOK-001, TOK-002 ], source_refs: [ { id: observed.skill-context-disclosure, revision: 1 } ] }, { item_index: 40, item_key: source:observed.skills-cli-shared-directory, verdict: covered, explanation: TOOL-002 and ACC-002 preserve separate copied same-name host artifacts and repeat-add replacement. ARCH-001 and MAN-001 keep generated target content and required local resources compatible with the tool's directory-level behavior., requirement_ids: [ ARCH-001, ARCH-002, TOOL-002, ACC-002, MAN-001 ], source_refs: [ { id: observed.skills-cli-shared-directory, revision: 2 } ] }, { item_index: 41, item_key: source:invocation.explicit-only, verdict: covered, explanation: INV-001 applies explicit-only metadata to global and plugin installations and forbids automatic companion invocation; INV-002 and ACC-004 require working controls and negative invocation checks., requirement_ids: [ INV-001, INV-002, ACC-004 ], source_refs: [ { id: invocation.explicit-only, revision: 1 } ] }, { item_index: 42, item_key: source:quality.skill-refinement-budget, verdict: covered, explanation: "SKILL-005 preserves the 240-code-point and 4096-byte limits and selective references. TOK-001, TOK-002 and ACC-007 require complete default-budget discovery, routing evidence and semantic refinement checks.", requirement_ids: [ SKILL-005, TOK-001, TOK-002, ACC-007, SKILL-003 ], source_refs: [ { id: quality.skill-refinement-budget, revision: 2 } ] }, { item_index: 43, item_key: source:quality.engineering-standard, verdict: covered, explanation: "MAN-001 and MAN-002 specify the single engineering standard, contextual application, repository precedence and distinct specification, planning and implementation contracts; ACC-008 tests the same boundaries.", requirement_ids: [ MAN-001, MAN-002, ACC-008 ], source_refs: [ { id: quality.engineering-standard, revision: 1 } ] }, { item_index: 44, item_key: source:planning.symbol-level-architecture, verdict: covered, explanation: "PLAN-001 names ownership, existing/proposed status, material units, purpose, contracts, dependency direction and verification. ACC-009 checks language-appropriate units and no production mutation in planning mode.", requirement_ids: [ PLAN-001, ACC-009 ], source_refs: [ { id: planning.symbol-level-architecture, revision: 1 } ] }, { item_index: 45, item_key: source:architecture.engineering-manual-form, verdict: covered, explanation: MAN-001 establishes one root-authored manual/verifier with authenticated generated local copies. ARCH-001 and TOK-002 preserve one source and selective loading; the newer choice replaces sibling-owned shared resources., requirement_ids: [ ARCH-001, MAN-001, TOK-002 ], source_refs: [ { id: architecture.engineering-manual-form, revision: 2 } ] }, { item_index: 46, item_key: source:architecture.engineering-manual-layout, verdict: covered, explanation: MAN-001 owns the common root paths and generated local resources; SKILL-004 and DIST-005 preserve dependency classification without introducing a support skill., requirement_ids: [ SKILL-004, MAN-001, DIST-005 ], source_refs: [ { id: architecture.engineering-manual-layout, revision: 2 } ] }, { item_index: 47, item_key: source:quality.test-first-verification, verdict: covered, explanation: "TEST-001 and PLAN-002 preserve check-first ordering, meaningful RED, correction of implementation rather than weakening correct tests, conditional PROVE and proportional verification.", requirement_ids: [ TEST-001, PLAN-002, ACC-009 ], source_refs: [ { id: quality.test-first-verification, revision: 1 } ] }, { item_index: 48, item_key: source:planning.developer-documentation-threshold, verdict: covered, explanation: "PLAN-002 retains the two-usefulness-criteria threshold, a recorded decision either way and a final documentation packet after implementation and end-to-end verification; ACC-009 tests both outcomes.", requirement_ids: [ PLAN-002, DOC-001, ACC-009 ], source_refs: [ { id: planning.developer-documentation-threshold, revision: 1 } ] }, { item_index: 49, item_key: source:planning.developer-documentation-language, verdict: covered, explanation: "PLAN-002 requires the consuming repository's documentation location, language and style, with ACC-009 verifying repository-selected language.", requirement_ids: [ PLAN-002, DOC-001, ACC-009 ], source_refs: [ { id: planning.developer-documentation-language, revision: 1 } ] }, { item_index: 50, item_key: source:quality.doubt-reviewer-isolation, verdict: covered, explanation: "QUAL-001 and ACC-010 require a fresh host-native reviewer without the parent's desired verdict, read-only reconciliation, and a stop if independence cannot be provided; an external CLI remains separately requested.", requirement_ids: [ QUAL-001, ACC-010 ], source_refs: [ { id: quality.doubt-reviewer-isolation, revision: 1 } ] }, { item_index: 51, item_key: source:guidance.host-supplied-context, verdict: covered, explanation: SKILL-002 reuses supplied instructions and reads additional scoped guidance only when absent or itself in scope; SKILL-005 and ACC-007 retain context-efficient adaptation., requirement_ids: [ SKILL-002, ACC-001, ACC-007, SKILL-005 ], source_refs: [ { id: guidance.host-supplied-context, revision: 1 } ] }, { item_index: 52, item_key: source:specification.automatic-approval, verdict: covered, explanation: "INT-001 finalizes Approved only after resolved material decisions, confirmed manifest and successful gap review, without a separate approval question; direct edits and separate planning/implementation authority remain explicit.", requirement_ids: [ SKILL-005, INT-001, DOC-001, ACC-001 ], source_refs: [ { id: specification.automatic-approval, revision: 1 } ] }, { item_index: 53, item_key: source:workflow.adaptive-pair-scope, verdict: covered, explanation: SPEC-001 and PLAN-003 evolve the existing adaptive pair. SKILL-001's later separately authorized design-planning addition does not create an extra adaptive-scoping workflow., requirement_ids: [ SKILL-001, SKILL-005, SPEC-001, PLAN-003 ], source_refs: [ { id: workflow.adaptive-pair-scope, revision: 1 } ] }, { item_index: 54, item_key: source:specification.adaptive-depth, verdict: covered, explanation: SPEC-001 requires the highest applicable Lite/Standard/Deep proposal and explicit confirmation; PLAN-003 scales output while retaining baseline correctness and acceptance., requirement_ids: [ SPEC-001, PLAN-003, ACC-001, ACC-009 ], source_refs: [ { id: specification.adaptive-depth, revision: 1 } ] }, { item_index: 55, item_key: source:specification.scope-state, verdict: covered, explanation: SPEC-001 preserves versioned decision history separately from the deterministic current confirmed manifest and requires reconfirmation for material scope changes., requirement_ids: [ SPEC-001, PLAN-003 ], source_refs: [ { id: specification.scope-state, revision: 1 } ] }, { item_index: 56, item_key: source:specification.profile-model, verdict: covered, explanation: "SPEC-001 names independently evaluated composable profiles, including core for non-UI/non-backend work, and PLAN-003 maps them to warranted contract work.", requirement_ids: [ SPEC-001, PLAN-003, ACC-001, ACC-009 ], source_refs: [ { id: specification.profile-model, revision: 1 } ] }, { item_index: 57, item_key: source:planning.profile-artifact-ownership, verdict: covered, explanation: "SPEC-001 declares exact warranted outputs without creating them; PLAN-003 owns planning artifacts, with the later PLAN-004 decision separating declared UI design production.", requirement_ids: [ SPEC-001, PLAN-003, PLAN-004 ], source_refs: [ { id: planning.profile-artifact-ownership, revision: 1 } ] }, { item_index: 58, item_key: source:planning.scope-precondition, verdict: covered, explanation: "PLAN-003 requires Approved specification and confirmed manifest, stopping on missing or inconsistent inputs without inferring confirmation or downgrading scope.", requirement_ids: [ PLAN-003, ACC-009 ], source_refs: [ { id: planning.scope-precondition, revision: 1 } ] }, { item_index: 59, item_key: source:planning.lite-output, verdict: covered, explanation: "PLAN-003 requires the three current documents and exactly one compact Lite packet, with extra profile artifacts only when explicitly declared.", requirement_ids: [ PLAN-003, ACC-009 ], source_refs: [ { id: planning.lite-output, revision: 1 } ] }, { item_index: 60, item_key: source:planning.corrective-packet, verdict: not_applicable, explanation: "The question selects the historical delivery representation for this repository's already completed packets, not reusable planning behavior. Its source preserves the corrective-packet choice; EVAL-001 explicitly keeps historical packet handling in delivery context.", requirement_ids: [], source_refs: [ { id: planning.corrective-packet, revision: 2 } ] }, { item_index: 61, item_key: source:specification.current-bundle-manifest, verdict: covered, explanation: "The confirmed manifest indexes the existing task documents, matching the explicit no-retrospective-artifacts choice. SPEC-001 and PLAN-003 preserve current scope and do not force a separate artifact merely because a profile is active.", requirement_ids: [ SPEC-001, PLAN-003 ], source_refs: [ { id: specification.current-bundle-manifest, revision: 1 } ] }, { item_index: 62, item_key: source:specification.profile-reference-loading, verdict: covered, explanation: SPEC-001 and PLAN-003 require no detailed profile guidance before confirmation and exactly one dedicated reference for each active profile afterwards; TOK-002 prohibits unrelated preloading., requirement_ids: [ SPEC-001, TOK-002, ACC-009, PLAN-003 ], source_refs: [ { id: specification.profile-reference-loading, revision: 3 } ] }, { item_index: 63, item_key: source:specification.artifact-name-source, verdict: covered, explanation: "SPEC-001 requires compact pre-profile routing metadata and exact artifact paths in the single initial confirmed proposal, without routine double confirmation.", requirement_ids: [ SPEC-001, TOK-002, ACC-009 ], source_refs: [ { id: specification.artifact-name-source, revision: 1 } ] }, { item_index: 64, item_key: source:workflow-loop.execution-contract, verdict: covered, explanation: "EXEC-001 preserves one authorized packet, real dependency/check completion, separate optional reviews and separate commits. SPEC-001 and INT-001 retain automatic specification finalization and active-only profile loading; EVAL-001 retains isolated trials.", requirement_ids: [ SPEC-001, PLAN-001, PLAN-002, INT-001, TEST-001, ACC-008, ACC-009, EXEC-001, EVAL-001 ], source_refs: [ { id: workflow-loop.execution-contract, revision: 1 } ] }, { item_index: 65, item_key: source:workflow-loop.model-roles, verdict: covered, explanation: "EVAL-001 explicitly preserves the chosen Codex and Claude model roles, original matrix scope and host-rendered advisory guidance, without automatic switching or global configuration authority.", requirement_ids: [ INT-001, PLAN-002, HOST-001, HOST-002, TOK-002, ACC-009, EVAL-001 ], source_refs: [ { id: workflow-loop.model-roles, revision: 1 } ] }, { item_index: 66, item_key: source:specification.lite-inline-contract, verdict: covered, explanation: "SPEC-001 and PLAN-003 treat registry outputs as candidates and keep Lite contracts inline unless a concrete machine-validation, multiple-consumer or explicit requirement warrants separation.", requirement_ids: [ SPEC-001, PLAN-003, TOK-002, ACC-009 ], source_refs: [ { id: specification.lite-inline-contract, revision: 1 } ] }, { item_index: 67, item_key: source:workflow-loop.cli-check-environment, verdict: not_applicable, explanation: "This is the specific trial runner adaptation approved for an EPERM environment, retaining sandboxing and stdout/stderr/exit assertions. EVAL-001 preserves those historical restrictions without turning the runner choice into an installed-skill requirement.", requirement_ids: [], source_refs: [ { id: workflow-loop.cli-check-environment, revision: 2 } ] }, { item_index: 68, item_key: source:workflow-loop.local-http-scope, verdict: not_applicable, explanation: "This is a bounded temporary-fixture permission for local HTTP, not general network authority. EVAL-001 preserves original restrictions and denies automatic expansion into global configuration or reusable workflow prerequisites.", requirement_ids: [], source_refs: [ { id: workflow-loop.local-http-scope, revision: 2 } ] }, { item_index: 69, item_key: source:workflow-loop.proportionate-prove, verdict: covered, explanation: TEST-001 retains ordinary regression checks for unchanged baseline constraints and PROVE for new/changed guarantees when its stated conditions apply; PLAN-002 preserves discriminating verification., requirement_ids: [ TEST-001, PLAN-002, EVAL-001 ], source_refs: [ { id: workflow-loop.proportionate-prove, revision: 1 } ] }, { item_index: 70, item_key: source:workflow-loop.linux-cli-fixture, verdict: not_applicable, explanation: This narrows one educational fixture to Linux and requires real direct CLI assertions alongside npm test. EVAL-001 preserves that delivery choice without narrowing collection platform support or waiving its required checks., requirement_ids: [], source_refs: [ { id: workflow-loop.linux-cli-fixture, revision: 2 } ] }, { item_index: 71, item_key: source:workflow-loop.specification-state-ownership, verdict: covered, explanation: SPEC-001 explicitly keeps recovery in specification artifacts and forbids a specification handoff; PLAN-003 begins the current-only handoff at planning., requirement_ids: [ SPEC-001, PLAN-002, EVAL-001, PLAN-003 ], source_refs: [ { id: workflow-loop.specification-state-ownership, revision: 1 } ] }, { item_index: 72, item_key: source:workflow-loop.browser-provider, verdict: not_applicable, explanation: "The selected browser provider belongs to the historical fixture campaign. EVAL-001 preserves its limited scope and does not introduce a mandatory browser dependency, installation permission or sandbox bypass.", requirement_ids: [], source_refs: [ { id: workflow-loop.browser-provider, revision: 2 } ] }, { item_index: 73, item_key: source:workflow-loop.git-prerequisite, verdict: covered, explanation: "EXEC-001 requires a usable Git worktree and tracked/staged/untracked evidence, stops on missing Git, forbids initialization/snapshot substitution and requires neither a commit nor a clean tree.", requirement_ids: [ EXEC-001, PLAN-002, EVAL-001 ], source_refs: [ { id: workflow-loop.git-prerequisite, revision: 1 } ] }, { item_index: 74, item_key: source:workflow-loop.deep-runtime-corruption-control, verdict: not_applicable, explanation: This authorizes one private corruption-control fixture boundary and explicitly excludes public HTTP or validation-response manipulation. EVAL-001 retains private fixture controls as campaign-specific delivery context rather than installed-skill behavior., requirement_ids: [], source_refs: [ { id: workflow-loop.deep-runtime-corruption-control, revision: 2 } ] }, { item_index: 75, item_key: source:workflow-loop.ui-zoom-sequencing, verdict: not_applicable, explanation: "This chooses historical work order only. EVAL-001 keeps deferred checks unverified and preserves original restrictions, so continued independent checks do not waive actual browser zoom or permit an emulated substitute.", requirement_ids: [], source_refs: [ { id: workflow-loop.ui-zoom-sequencing, revision: 2 } ] }, { item_index: 76, item_key: source:workflow-loop.yaml-checkpoint-validation, verdict: covered, explanation: STATE-001 requires actual saved-YAML syntax/schema validation and leaves unavailable required checks unverified; MCP-002 requires MCP journal read-back and real parsing for other YAML., requirement_ids: [ SPEC-001, PLAN-002, EXEC-001, TEST-001, EVAL-001, STATE-001, MCP-002 ], source_refs: [ { id: workflow-loop.yaml-checkpoint-validation, revision: 1 } ] }, { item_index: 77, item_key: source:workflow-loop.large-decision-ledger-access, verdict: covered, explanation: "MCP-002 preserves mandatory bounded MCP discovery, validation and exact journal retrieval with no local fallback, separate packaging and explicit registration authority. Its available approved linked specification defines the external contract.", requirement_ids: [ SPEC-001, PLAN-002, EXEC-001, EVAL-001, MCP-002 ], source_refs: [ { id: workflow-loop.large-decision-ledger-access, revision: 2 } ] }, { item_index: 78, item_key: source:workflow-loop.claude-deferral, verdict: not_applicable, explanation: This defers native Claude trials in the historical campaign and adds a conversation progress preference; EVAL-001 expressly preserves deferral while requiring both host artifacts and marking unexecuted evidence unverified., requirement_ids: [], source_refs: [ { id: workflow-loop.claude-deferral, revision: 2 } ] }, { item_index: 79, item_key: source:workflow-loop.budget-checkpoint, verdict: not_applicable, explanation: This limits the historical campaign's work and model launches to preserve a usage reserve. EVAL-001 expressly preserves the campaign budget stop and no new operational authority rather than interpreting deferred runs as passed., requirement_ids: [], source_refs: [ { id: workflow-loop.budget-checkpoint, revision: 2 } ] }, { item_index: 80, item_key: source:workflow-loop.reader-available-local-validation, verdict: covered, explanation: "EVAL-001 requires actual traces and exact qualified source/context, excluding invalid or incomplete runs from behavioral credit; this observed local-validation failure does not itself establish a passed trial.", requirement_ids: [ EVAL-001 ], source_refs: [ { id: workflow-loop.reader-available-local-validation, revision: 1 } ] }, { item_index: 81, item_key: source:ui.penpot-project-design, verdict: covered, explanation: "UI-001 preserves Penpot editing, one shared project library, linked specification screen sets, verified Git snapshots and required target/link evidence. It applies design-artifact work only when declared; PLAN-004 owns the separate stage.", requirement_ids: [ UI-001 ], source_refs: [ { id: ui.penpot-project-design, revision: 1 } ] }, { item_index: 82, item_key: source:ui.separate-design-planning, verdict: covered, explanation: "PLAN-004 preserves a separately invoked manifest-driven design stage, reuse of installed Penpot skills, skipping undeclared design outputs and blocking missing dependent capabilities without automatic installation.", requirement_ids: [ PLAN-004, UI-001 ], source_refs: [ { id: ui.separate-design-planning, revision: 1 } ] }, { item_index: 83, item_key: source:state.four-yaml-contracts, verdict: covered, explanation: "STATE-001 defines exactly the four common YAML contracts, preserves profile-specific API/event/data formats and requires scoped real syntax/schema/cross-file validation without silent migration.", requirement_ids: [ STATE-001 ], source_refs: [ { id: state.four-yaml-contracts, revision: 1 } ] }, { item_index: 84, item_key: source:0122a67c-c0d9-4813-859b-fddba7a07a6b, verdict: covered, explanation: "UI-001 explicitly distinguishes an active UI profile from declared warranted design work, while preserving Penpot and shared linked component rules for declared outputs. The related source supplies the meaning of the short confirmation.", requirement_ids: [ UI-001, PLAN-004 ], source_refs: [ { id: 0122a67c-c0d9-4813-859b-fddba7a07a6b, revision: 1 } ] }, { item_index: 85, item_key: source:997785d6-ba90-4b4b-834c-142c886f214f, verdict: not_applicable, explanation: "This is explicit authorization for the current normative reconciliation and independent review, with installation code, skills and fixtures excluded. It creates no new reusable product behavior and appropriately remains non-behavioral work scope.", requirement_ids: [], source_refs: [ { id: 997785d6-ba90-4b4b-834c-142c886f214f, revision: 2 } ] }, { item_index: 86, item_key: requirement:OUT-001, verdict: covered, explanation: "The canonical repository, supported hosts, hybrid surfaces, stable releases and global-only extraction goal follow the centralization, distribution, licensing and explicit-only decisions together; this does not authorize publication.", requirement_ids: [ OUT-001 ], source_refs: [ { id: outcome.centralized-source, revision: 1 }, { id: project.identity, revision: 1 }, { id: approval.spec, revision: 4 }, { id: compatibility.supported-hosts, revision: 1 }, { id: distribution.installation-model, revision: 2 }, { id: security.release-integrity, revision: 1 }, { id: distribution.repository-access, revision: 1 }, { id: distribution.license, revision: 1 }, { id: operations.existing-copy-migration, revision: 3 }, { id: invocation.explicit-only, revision: 1 }, { id: quality.skill-refinement-budget, revision: 2 } ] }, { item_index: 87, item_key: requirement:SCOPE-001, verdict: covered, explanation: "The exclusions preserve the later no-custom-CLI, no-project-mutation, no-managed-rollback, stable-only and explicit-invocation decisions, plus separate external-action authority.", requirement_ids: [ SCOPE-001 ], source_refs: [ { id: operations.existing-copy-migration, revision: 3 }, { id: operations.rollback-support, revision: 1 }, { id: architecture.lifecycle-client, revision: 2 }, { id: compatibility.prompt-mcp-platform-gap, revision: 3 }, { id: distribution.activation-policy, revision: 1 }, { id: release.channels, revision: 1 }, { id: distribution.plugin-granularity, revision: 1 }, { id: release.publication-gate, revision: 1 }, { id: distribution.public-directory-scope, revision: 1 }, { id: interface.cli-name, revision: 2 }, { id: invocation.explicit-only, revision: 1 } ] }, { item_index: 88, item_key: requirement:SKILL-001, verdict: covered, explanation: The original fifteen extracted workflows plus the later separately approved design-planning workflow justify the sixteen-entry inventory and preserved semantic boundaries., requirement_ids: [ SKILL-001 ], source_refs: [ { id: scope.initial-skills, revision: 1 }, { id: workflow.adaptive-pair-scope, revision: 1 }, { id: ui.separate-design-planning, revision: 1 } ] }, { item_index: 89, item_key: requirement:SKILL-002, verdict: covered, explanation: "The extraction/refinement and host-context decisions justify runtime repository discovery, host-specific instruction names and reuse of already supplied guidance.", requirement_ids: [ SKILL-002 ], source_refs: [ { id: scope.initial-skills, revision: 1 }, { id: guidance.host-supplied-context, revision: 1 } ] }, { item_index: 90, item_key: requirement:SKILL-003, verdict: covered, explanation: Stable public identities and release treatment follow the SemVer decision; concise discriminating descriptions preserve the agreed refinement and discovery contract., requirement_ids: [ SKILL-003 ], source_refs: [ { id: release.versioning-policy, revision: 2 }, { id: quality.skill-refinement-budget, revision: 2 } ] }, { item_index: 91, item_key: requirement:SKILL-004, verdict: covered, explanation: "The newer dependency-chain and shared-resource decisions justify standalone specification, dependent planning/implementation and complete-bundle installation; the later design-planning decision supplies that added workflow dependency.", requirement_ids: [ SKILL-004 ], source_refs: [ { id: distribution.skill-dependencies, revision: 3 }, { id: architecture.engineering-manual-layout, revision: 2 }, { id: ui.separate-design-planning, revision: 1 }, { id: workflow-loop.large-decision-ledger-access, revision: 2 } ] }, { item_index: 92, item_key: requirement:SKILL-005, verdict: covered, explanation: "The source-extraction and strict-budget decisions justify semantic refinement, preserved safety/outcomes, conditional references and the exact size limits.", requirement_ids: [ SKILL-005 ], source_refs: [ { id: scope.initial-skills, revision: 1 }, { id: quality.skill-refinement-budget, revision: 2 }, { id: specification.automatic-approval, revision: 1 }, { id: workflow.adaptive-pair-scope, revision: 1 } ] }, { item_index: 93, item_key: requirement:SPEC-001, verdict: covered, explanation: "Adaptive depth, composable profiles, confirmed current manifest, versioned history, artifact ownership, active-only references and planning-owned handoff each correspond to the explicit scope/state/routing decisions.", requirement_ids: [ SPEC-001 ], source_refs: [ { id: workflow.adaptive-pair-scope, revision: 1 }, { id: specification.adaptive-depth, revision: 1 }, { id: specification.scope-state, revision: 1 }, { id: specification.profile-model, revision: 1 }, { id: planning.profile-artifact-ownership, revision: 1 }, { id: specification.current-bundle-manifest, revision: 1 }, { id: specification.profile-reference-loading, revision: 3 }, { id: specification.artifact-name-source, revision: 1 }, { id: workflow-loop.execution-contract, revision: 1 }, { id: specification.lite-inline-contract, revision: 1 }, { id: workflow-loop.specification-state-ownership, revision: 1 }, { id: workflow-loop.yaml-checkpoint-validation, revision: 1 }, { id: workflow-loop.large-decision-ledger-access, revision: 2 }, { id: ui.penpot-project-design, revision: 1 }, { id: ui.separate-design-planning, revision: 1 } ] }, { item_index: 94, item_key: requirement:MAN-001, verdict: covered, explanation: "The revised manual form/layout decisions require one root-authored manual and generated authenticated local copies, superseding the old sibling-owned design without reversing workflow dependency direction.", requirement_ids: [ MAN-001 ], source_refs: [ { id: distribution.skill-dependencies, revision: 3 }, { id: quality.engineering-standard, revision: 1 }, { id: architecture.engineering-manual-form, revision: 2 }, { id: architecture.engineering-manual-layout, revision: 2 } ] }, { item_index: 95, item_key: requirement:MAN-002, verdict: covered, explanation: The explicit senior-engineering-standard decision supports contextual principles and artifact-specific obligations without mechanical patterns or overriding repository requirements., requirement_ids: [ MAN-002 ], source_refs: [ { id: quality.engineering-standard, revision: 1 } ] }, { item_index: 96, item_key: requirement:TEST-001, verdict: covered, explanation: "The test-first decision and later proportionate-PROVE amendment support discriminating RED and mutation conditions, correction of implementation, scoped checks and preservation of ordinary unchanged-baseline tests.", requirement_ids: [ TEST-001 ], source_refs: [ { id: quality.test-first-verification, revision: 1 }, { id: workflow-loop.execution-contract, revision: 1 }, { id: workflow-loop.proportionate-prove, revision: 1 }, { id: workflow-loop.yaml-checkpoint-validation, revision: 1 } ] }, { item_index: 97, item_key: requirement:PLAN-001, verdict: covered, explanation: The symbol-level planning decision supplies unit responsibility/contracts/dependency evidence; the execution-loop decision distinguishes architecture planning from incremental validation and preserves no production mutation in planning mode., requirement_ids: [ PLAN-001 ], source_refs: [ { id: planning.symbol-level-architecture, revision: 1 }, { id: workflow-loop.execution-contract, revision: 1 } ] }, { item_index: 98, item_key: requirement:PLAN-002, verdict: covered, explanation: "The test-first and documentation-threshold/language decisions justify ordered checks, independently executable packets and conditional final documentation with repository-owned language.", requirement_ids: [ PLAN-002 ], source_refs: [ { id: quality.test-first-verification, revision: 1 }, { id: planning.developer-documentation-threshold, revision: 1 }, { id: planning.developer-documentation-language, revision: 1 }, { id: workflow-loop.execution-contract, revision: 1 }, { id: workflow-loop.model-roles, revision: 1 }, { id: workflow-loop.proportionate-prove, revision: 1 }, { id: workflow-loop.specification-state-ownership, revision: 1 }, { id: workflow-loop.git-prerequisite, revision: 1 }, { id: workflow-loop.yaml-checkpoint-validation, revision: 1 }, { id: workflow-loop.large-decision-ledger-access, revision: 2 } ] }, { item_index: 99, item_key: requirement:PLAN-003, verdict: covered, explanation: "The adaptive pair, manifest precondition, profile-artifact ownership and Lite-output decisions justify the exact planning boundaries and depth-scaled output; later separate design planning narrows UI output ownership.", requirement_ids: [ PLAN-003 ], source_refs: [ { id: workflow.adaptive-pair-scope, revision: 1 }, { id: specification.adaptive-depth, revision: 1 }, { id: specification.scope-state, revision: 1 }, { id: specification.profile-model, revision: 1 }, { id: planning.profile-artifact-ownership, revision: 1 }, { id: planning.scope-precondition, revision: 1 }, { id: planning.lite-output, revision: 1 }, { id: specification.current-bundle-manifest, revision: 1 }, { id: specification.profile-reference-loading, revision: 3 }, { id: specification.lite-inline-contract, revision: 1 }, { id: ui.separate-design-planning, revision: 1 } ] }, { item_index: 100, item_key: requirement:UI-001, verdict: covered, explanation: The Penpot shared-design decision and later separate manifest-driven design stage justify linked libraries/screens and verified snapshots; the current clarification makes undeclared design work skippable without discarding UI behavior., requirement_ids: [ UI-001 ], source_refs: [ { id: ui.penpot-project-design, revision: 1 }, { id: ui.separate-design-planning, revision: 1 }, { id: 0122a67c-c0d9-4813-859b-fddba7a07a6b, revision: 1 } ] }, { item_index: 101, item_key: requirement:PLAN-004, verdict: covered, explanation: "The separate-design-planning instruction directly supports the explicit stage, existing planning prerequisites, manifest eligibility, external Penpot reuse and no automatic next-stage execution.", requirement_ids: [ PLAN-004 ], source_refs: [ { id: ui.separate-design-planning, revision: 1 } ] }, { item_index: 102, item_key: requirement:STATE-001, verdict: covered, explanation: "The four-common-files decision and YAML-checkpoint decision justify the listed schemas, real parsing, cross-file checks, compatibility and keeping missing validation unverified.", requirement_ids: [ STATE-001 ], source_refs: [ { id: state.four-yaml-contracts, revision: 1 }, { id: workflow-loop.yaml-checkpoint-validation, revision: 1 } ] }, { item_index: 103, item_key: requirement:EXEC-001, verdict: covered, explanation: "The execution-loop and Git-prerequisite decisions support one authorized packet, real Git evidence, checks-before-completion and separately invoked optional reviews/commits; no automatic initialization or next packet follows.", requirement_ids: [ EXEC-001 ], source_refs: [ { id: workflow-loop.git-prerequisite, revision: 1 }, { id: workflow-loop.yaml-checkpoint-validation, revision: 1 }, { id: workflow-loop.large-decision-ledger-access, revision: 2 }, { id: workflow-loop.execution-contract, revision: 1 } ] }, { item_index: 104, item_key: requirement:EVAL-001, verdict: covered, explanation: "The approved original qualification plan and model-role source support the frozen matrix, fresh contexts, two stable passes and holdouts. Subsequent deferral/budget and fixture decisions remain campaign-specific, preserving restrictions and unverified status without universalizing them.", requirement_ids: [ EVAL-001 ], source_refs: [ { id: workflow-loop.proportionate-prove, revision: 1 }, { id: workflow-loop.specification-state-ownership, revision: 1 }, { id: workflow-loop.git-prerequisite, revision: 1 }, { id: workflow-loop.yaml-checkpoint-validation, revision: 1 }, { id: workflow-loop.large-decision-ledger-access, revision: 2 }, { id: workflow-loop.reader-available-local-validation, revision: 1 }, { id: workflow-loop.execution-contract, revision: 1 }, { id: workflow-loop.model-roles, revision: 1 }, { id: workflow-loop.claude-deferral, revision: 2 }, { id: workflow-loop.budget-checkpoint, revision: 2 } ] }, { item_index: 105, item_key: requirement:QUAL-001, verdict: covered, explanation: The fresh-reviewer choice supports isolated host-native challenge and evidence reconciliation; unavailable independence stops the workflow and an external CLI needs a separate request., requirement_ids: [ QUAL-001 ], source_refs: [ { id: quality.doubt-reviewer-isolation, revision: 1 } ] }, { item_index: 106, item_key: requirement:HOST-001, verdict: covered, explanation: Supported-host and observed common-format sources justify Codex/Claude directory-based skills and a common source that excludes incompatible host-only semantics., requirement_ids: [ HOST-001 ], source_refs: [ { id: compatibility.supported-hosts, revision: 1 }, { id: observed.agent-skills-core, revision: 1 }, { id: workflow-loop.model-roles, revision: 1 } ] }, { item_index: 107, item_key: requirement:HOST-002, verdict: covered, explanation: "The surface-selection decision supports local, marketplace, hosted and managed use, subject to the separate no-project-local-skills boundary.", requirement_ids: [ HOST-002 ], source_refs: [ { id: compatibility.v1-surfaces, revision: 1 }, { id: workflow-loop.model-roles, revision: 1 }, { id: operations.existing-copy-migration, revision: 3 } ] }, { item_index: 108, item_key: requirement:HOST-003, verdict: covered, explanation: The desktop-platform decision retains all three systems; use of the selected upstream runtime and hosts defines applicable architectures without a custom binary promise., requirement_ids: [ HOST-003 ], source_refs: [ { id: compatibility.desktop-platforms, revision: 1 } ] }, { item_index: 109, item_key: requirement:HOST-004, verdict: covered, explanation: "The client-version and pinned-tool decisions support documented verified versions and ongoing current-stable qualification through reviewed pins, without floating latest.", requirement_ids: [ HOST-004 ], source_refs: [ { id: compatibility.client-version-policy, revision: 1 }, { id: compatibility.skills-cli-version, revision: 1 } ] }, { item_index: 110, item_key: requirement:ARCH-001, verdict: covered, explanation: "The newer rendering/portability choices support one authoritative template source and isolated generated outputs, replacing independently edited variants or mixed runtime instructions.", requirement_ids: [ ARCH-001 ], source_refs: [ { id: observed.agent-skills-core, revision: 1 }, { id: distribution.installation-model, revision: 2 }, { id: architecture.skill-portability, revision: 2 }, { id: observed.skills-cli-shared-directory, revision: 2 }, { id: architecture.engineering-manual-form, revision: 2 } ] }, { item_index: 111, item_key: requirement:ARCH-002, verdict: covered, explanation: Host packaging differences and strict-rendering decisions support generated per-host bundles/manifests/catalog and validation against leakage and drift., requirement_ids: [ ARCH-002 ], source_refs: [ { id: observed.host-packaging-difference, revision: 1 }, { id: distribution.installation-model, revision: 2 }, { id: architecture.skill-portability, revision: 2 }, { id: observed.skills-cli-shared-directory, revision: 2 } ] }, { item_index: 112, item_key: requirement:ARCH-003, verdict: covered, explanation: The explicit canonical-source choice makes prompt-mcp only the initial source and excludes bidirectional synchronization and project copying., requirement_ids: [ ARCH-003 ], source_refs: [ { id: ownership.canonical-source, revision: 1 } ] }, { item_index: 113, item_key: requirement:INV-001, verdict: covered, explanation: The explicit-only decision requires the named host controls across global/plugin forms and forbids automatic companion invocation., requirement_ids: [ INV-001 ], source_refs: [ { id: observed.skill-context-disclosure, revision: 1 }, { id: invocation.explicit-only, revision: 1 } ] }, { item_index: 114, item_key: requirement:INV-002, verdict: covered, explanation: "The explicit-only requirement and version-floor decision justify refusing support where the mandatory activation control cannot be verified, rather than silently weakening it.", requirement_ids: [ INV-002 ], source_refs: [ { id: invocation.explicit-only, revision: 1 }, { id: compatibility.client-version-policy, revision: 1 } ] }, { item_index: 115, item_key: requirement:TOK-001, verdict: covered, explanation: The strict discovery-budget choice preserves all skills and descriptions within unmodified defaults and requires exact-client evidence., requirement_ids: [ TOK-001 ], source_refs: [ { id: observed.skill-context-disclosure, revision: 1 }, { id: quality.skill-refinement-budget, revision: 2 } ] }, { item_index: 116, item_key: requirement:TOK-002, verdict: covered, explanation: "The progressive-disclosure and active-only reference decisions justify bounded discovery, selected-body loading and conditional resources without unrelated or repeated preload.", requirement_ids: [ TOK-002 ], source_refs: [ { id: observed.skill-context-disclosure, revision: 1 }, { id: quality.skill-refinement-budget, revision: 2 }, { id: architecture.engineering-manual-form, revision: 2 }, { id: specification.profile-reference-loading, revision: 3 }, { id: specification.artifact-name-source, revision: 1 }, { id: workflow-loop.model-roles, revision: 1 }, { id: specification.lite-inline-contract, revision: 1 } ] }, { item_index: 117, item_key: requirement:TOOL-001, verdict: covered, explanation: "The later lifecycle-client/no-executable decisions select the established pinned npx tool and reject a second installer, wrapper or state model.", requirement_ids: [ TOOL-001 ], source_refs: [ { id: architecture.lifecycle-client, revision: 2 }, { id: interface.cli-name, revision: 2 }, { id: observed.skills-cli-contract, revision: 1 }, { id: compatibility.skills-cli-version, revision: 1 } ] }, { item_index: 118, item_key: requirement:TOOL-002, verdict: covered, explanation: The host-specific copy/repeat-add decision defines separate global replacement; the later rollback deferral supersedes older custom lifecycle expectations while list/remove remain supported., requirement_ids: [ TOOL-002 ], source_refs: [ { id: operations.managed-lifecycle, revision: 2 }, { id: architecture.lifecycle-client, revision: 2 }, { id: operations.update-policy, revision: 2 }, { id: release.channels, revision: 1 }, { id: operations.local-version-layout, revision: 2 }, { id: operations.existing-copy-migration, revision: 3 }, { id: interface.install-selection-default, revision: 2 }, { id: operations.rollback-support, revision: 1 }, { id: observed.skills-cli-contract, revision: 1 }, { id: observed.skills-cli-shared-directory, revision: 2 } ] }, { item_index: 119, item_key: requirement:TOOL-003, verdict: covered, explanation: "The recorded telemetry opt-out assumption preserves normative disablement, disclosure and no project telemetry without claiming control over deliberate third-party invocation.", requirement_ids: [ TOOL-003 ], source_refs: [ { id: security.skills-cli-telemetry, revision: 1 } ] }, { item_index: 120, item_key: requirement:DIST-001, verdict: covered, explanation: "The amended hybrid installation decision preserves global and native artifacts from one canonical signed release, with each target containing only its own values.", requirement_ids: [ DIST-001 ], source_refs: [ { id: distribution.installation-model, revision: 2 } ] }, { item_index: 121, item_key: requirement:DIST-002, verdict: covered, explanation: The layout-ownership and update decisions delegate storage to upstream and preserve global-only isolation with unchanged consuming projects., requirement_ids: [ DIST-002 ], source_refs: [ { id: observed.global-skill-locations, revision: 1 }, { id: operations.update-policy, revision: 2 }, { id: operations.local-version-layout, revision: 2 } ] }, { item_index: 122, item_key: requirement:DIST-003, verdict: covered, explanation: The chosen exclusive activation mode requires refusal of duplicates unless expressly overridden; explicit host inspection supplies that gate without recreating custom lifecycle enforcement., requirement_ids: [ DIST-003 ], source_refs: [ { id: distribution.activation-policy, revision: 1 } ] }, { item_index: 123, item_key: requirement:DIST-004, verdict: covered, explanation: The individual-selection decision remains supported for standalone skills; the later complete-bundle dependency decision legitimately restricts dependent workflows., requirement_ids: [ DIST-004 ], source_refs: [ { id: distribution.installation-granularity, revision: 1 }, { id: distribution.skill-dependencies, revision: 3 } ] }, { item_index: 124, item_key: requirement:DIST-005, verdict: covered, explanation: The newer dependent-workflow choice requires documented complete-bundle installation and catalog classification while excluding a custom resolver., requirement_ids: [ DIST-005 ], source_refs: [ { id: distribution.skill-dependencies, revision: 3 }, { id: architecture.engineering-manual-layout, revision: 2 } ] }, { item_index: 125, item_key: requirement:DIST-006, verdict: covered, explanation: "The complete-native-plugin choice and host-separation decisions justify a full catalog per host, matching release versions and no per-skill marketplace plugins.", requirement_ids: [ DIST-006 ], source_refs: [ { id: observed.host-packaging-difference, revision: 1 }, { id: architecture.skill-portability, revision: 2 }, { id: distribution.plugin-granularity, revision: 1 } ] }, { item_index: 126, item_key: requirement:DIST-007, verdict: covered, explanation: The Git-marketplaces-only choice supports immutable released sources and defers vendor-directory submission., requirement_ids: [ DIST-007 ], source_refs: [ { id: distribution.public-directory-scope, revision: 1 } ] }, { item_index: 127, item_key: requirement:INT-001, verdict: covered, explanation: The host-native-question decision preserves real answers and missing-answer handling; automatic-approval and direct-edit decisions preserve completion conditions and separate planning/implementation scope., requirement_ids: [ INT-001 ], source_refs: [ { id: compatibility.prompt-mcp-platform-gap, revision: 3 }, { id: specification.automatic-approval, revision: 1 }, { id: workflow-loop.execution-contract, revision: 1 }, { id: workflow-loop.model-roles, revision: 1 } ] }, { item_index: 128, item_key: requirement:MCP-001, verdict: covered, explanation: "The latest interaction decision retires Prompt MCP for every collection workflow, superseding the earlier integration model.", requirement_ids: [ MCP-001 ], source_refs: [ { id: compatibility.prompt-mcp-platform-gap, revision: 3 } ] }, { item_index: 129, item_key: requirement:MCP-002, verdict: covered, explanation: "The MCP-only large-journal decision is realized through the available approved Decision Ledger MCP specification, which defines multi-project stdio reads, bounded exact retrieval and no client-registration authority.", requirement_ids: [ MCP-002 ], source_refs: [ { id: workflow-loop.large-decision-ledger-access, revision: 2 } ] }, { item_index: 130, item_key: requirement:SEC-001, verdict: covered, explanation: "The explicit no-project-mutation source supports prohibiting default project-scope commands, unrelated writes and recursive skill discovery.", requirement_ids: [ SEC-001 ], source_refs: [ { id: operations.existing-copy-migration, revision: 3 } ] }, { item_index: 131, item_key: requirement:SEC-002, verdict: covered, explanation: "The signed-tags/checksums choice supports trusted tag authentication and checksum verification before use, with failure/unavailability blocking artifacts; it does not misrepresent npm integrity as signature verification.", requirement_ids: [ SEC-002 ], source_refs: [ { id: security.release-integrity, revision: 1 } ] }, { item_index: 132, item_key: requirement:SEC-003, verdict: covered, explanation: "The telemetry/source-integrity decisions and active security scope justify pinned supply-chain identities, least-privilege release permissions and no sensitive artifact/log disclosure or discovery-triggered execution.", requirement_ids: [ SEC-003 ], source_refs: [ { id: security.skills-cli-telemetry, revision: 1 }, { id: security.release-integrity, revision: 1 }, { id: release.publication-gate, revision: 1 }, { id: quality.engineering-standard, revision: 1 } ] }, { item_index: 133, item_key: requirement:REL-001, verdict: covered, explanation: "The SemVer and stable-only decisions justify one collection version, compatibility-sensitive change levels and no additional channel.", requirement_ids: [ REL-001 ], source_refs: [ { id: release.versioning-policy, revision: 2 }, { id: release.channels, revision: 1 } ] }, { item_index: 134, item_key: requirement:REL-002, verdict: covered, explanation: "The human-signed-tag/CI-publication choice supports signature verification and release validation before separately authorized publication, without automatic version invention.", requirement_ids: [ REL-002 ], source_refs: [ { id: security.release-integrity, revision: 1 }, { id: release.publication-gate, revision: 1 }, { id: distribution.hosting-provider, revision: 1 } ] }, { item_index: 135, item_key: requirement:REL-003, verdict: covered, explanation: The public-GitHub/MIT decisions and explicit no-extra-provenance-work answer justify the stated distribution policy; no independent legal conclusion is implied., requirement_ids: [ REL-003 ], source_refs: [ { id: distribution.repository-access, revision: 1 }, { id: distribution.license, revision: 1 }, { id: distribution.import-rights, revision: 1 }, { id: distribution.hosting-provider, revision: 1 } ] }, { item_index: 136, item_key: requirement:DOC-001, verdict: covered, explanation: "The documented lifecycle, profile, context, manual, interaction, publication and troubleshooting obligations explain the selected supported contracts; the documentation-language decision preserves consuming-repository conventions.", requirement_ids: [ DOC-001 ], source_refs: [ { id: planning.developer-documentation-threshold, revision: 1 }, { id: planning.developer-documentation-language, revision: 1 }, { id: specification.automatic-approval, revision: 1 }, { id: operations.managed-lifecycle, revision: 2 }, { id: architecture.lifecycle-client, revision: 2 }, { id: security.release-integrity, revision: 1 }, { id: compatibility.prompt-mcp-platform-gap, revision: 3 }, { id: distribution.activation-policy, revision: 1 }, { id: compatibility.client-version-policy, revision: 1 }, { id: distribution.skill-dependencies, revision: 3 }, { id: observed.skill-context-disclosure, revision: 1 }, { id: invocation.explicit-only, revision: 1 }, { id: quality.skill-refinement-budget, revision: 2 }, { id: quality.engineering-standard, revision: 1 }, { id: planning.symbol-level-architecture, revision: 1 }, { id: specification.adaptive-depth, revision: 1 }, { id: specification.profile-model, revision: 1 } ] }, { item_index: 137, item_key: requirement:ACC-001, verdict: covered, explanation: "The extraction, rendering, dependency, adaptive-scope and automatic-approval sources justify validation of complete portable skills, isolated generation and observable workflow boundaries.", requirement_ids: [ ACC-001 ], source_refs: [ { id: architecture.skill-portability, revision: 2 }, { id: distribution.skill-dependencies, revision: 3 }, { id: guidance.host-supplied-context, revision: 1 }, { id: specification.automatic-approval, revision: 1 }, { id: specification.adaptive-depth, revision: 1 }, { id: specification.profile-model, revision: 1 } ] }, { item_index: 138, item_key: requirement:ACC-002, verdict: covered, explanation: "The copy-isolation and repeat-add decisions justify testing actual pinned upstream installation, missing companions, replacement and per-agent list/removal without project writes.", requirement_ids: [ ACC-002 ], source_refs: [ { id: operations.update-policy, revision: 2 }, { id: observed.skills-cli-shared-directory, revision: 2 } ] }, { item_index: 139, item_key: requirement:ACC-003, verdict: covered, explanation: "The desktop-platform and no-project-mutation decisions justify isolated profile tests on Linux, macOS and Windows and unchanged consuming-project evidence.", requirement_ids: [ ACC-003 ], source_refs: [ { id: compatibility.desktop-platforms, revision: 1 } ] }, { item_index: 140, item_key: requirement:ACC-004, verdict: covered, explanation: "Explicit-only activation and host-native questions require actual host discovery/invocation and negative-prompt checks, with plugin namespace and validation behavior kept target-specific.", requirement_ids: [ ACC-004 ], source_refs: [ { id: invocation.explicit-only, revision: 1 } ] }, { item_index: 141, item_key: requirement:ACC-005, verdict: covered, explanation: "The signed-tag CI release decision justifies successful static/isolated checks, consistent immutable versions and integrity identities before release.", requirement_ids: [ ACC-005 ], source_refs: [ { id: release.publication-gate, revision: 1 } ] }, { item_index: 142, item_key: requirement:ACC-006, verdict: covered, explanation: "The selected supported surfaces justify separately authorized manual local, platform, marketplace, hosted and managed acceptance; deferred public directories and managed rollback remain excluded.", requirement_ids: [ ACC-006 ], source_refs: [ { id: compatibility.v1-surfaces, revision: 1 } ] }, { item_index: 143, item_key: requirement:ACC-007, verdict: covered, explanation: "The strict token-budget/refinement decisions justify exact size limits, complete unmodified-default discovery and instrumented routing/equivalence checks.", requirement_ids: [ ACC-007 ], source_refs: [ { id: quality.skill-refinement-budget, revision: 2 }, { id: guidance.host-supplied-context, revision: 1 } ] }, { item_index: 144, item_key: requirement:ACC-008, verdict: covered, explanation: "The shared-manual/dependency and engineering-standard decisions justify byte-identical authenticated resources, mixed-version denial and contextual application of principles.", requirement_ids: [ ACC-008 ], source_refs: [ { id: distribution.skill-dependencies, revision: 3 }, { id: quality.engineering-standard, revision: 1 }, { id: workflow-loop.execution-contract, revision: 1 } ] }, { item_index: 145, item_key: requirement:ACC-009, verdict: covered, explanation: "The symbol-level plan, adaptive profile/Lite and test/documentation decisions justify language-appropriate architecture, manifest-only artifacts, executable packet checks and conditional documentation validation.", requirement_ids: [ ACC-009 ], source_refs: [ { id: planning.symbol-level-architecture, revision: 1 }, { id: quality.test-first-verification, revision: 1 }, { id: planning.developer-documentation-threshold, revision: 1 }, { id: planning.developer-documentation-language, revision: 1 }, { id: specification.adaptive-depth, revision: 1 }, { id: specification.profile-model, revision: 1 }, { id: planning.scope-precondition, revision: 1 }, { id: planning.lite-output, revision: 1 }, { id: specification.profile-reference-loading, revision: 3 }, { id: specification.artifact-name-source, revision: 1 }, { id: workflow-loop.execution-contract, revision: 1 }, { id: workflow-loop.model-roles, revision: 1 }, { id: specification.lite-inline-contract, revision: 1 } ] }, { item_index: 146, item_key: requirement:ACC-010, verdict: covered, explanation: The fresh host-native reviewer decision justifies actual isolated review and explicit refusal to label same-context analysis as independent., requirement_ids: [ ACC-010 ], source_refs: [ { id: quality.doubt-reviewer-isolation, revision: 1 } ] }, { item_index: 147, item_key: profile:core, verdict: covered, explanation: "Core consumers are maintainers and explicitly invoking Codex/Claude users. ARCH-001/002 define deterministic rendering and leakage rejection; SKILL-004/MAN-001/STATE-001 define dependency/configuration validation; INT-001 and EXEC-001 define interaction cancellation, stale and repeated execution. Global command syntax/state/errors are delegated to the exact reviewed upstream tool rather than a new CLI, with TOOL-002/DIST-004/ACC-002 requiring tested documented behavior. The approved MCP-002 reference supplies bounded read/protocol/error contracts. Cross-platform isolation and acceptance are explicit; no additional repository runtime or separate retroactive artifact is warranted by the confirmed scope.", requirement_ids: [ ARCH-001, ARCH-002, SKILL-004, MAN-001, STATE-001, INT-001, EXEC-001, TOOL-001, TOOL-002, DIST-004, ACC-002, HOST-003, MCP-002 ], source_refs: [] }, { item_index: 148, item_key: profile:operations, verdict: covered, explanation: "Operations concern generated artifacts, global personal lifecycle and publication rather than a continuously served application. TOOL-002 and DIST-002 preserve independent per-host replacement and upstream state ownership; SCOPE-001 explicitly excludes managed rollback/retention/locks. DOC-001 requires version, permission and lifecycle troubleshooting; MAN-001/ACC-008 stop on missing/mixed dependencies, and SEC-002/REL-002 distinguish denied integrity checks from a releasable artifact. ACC-003/005/006 provide isolated and manual evidence. Capacity/SLOs and a new backup/rollback mechanism would add unsupported scope; the separate MCP reference already bounds its local process reads.", requirement_ids: [ TOOL-002, DIST-002, SCOPE-001, DOC-001, MAN-001, ACC-008, SEC-002, REL-002, ACC-003, ACC-005, ACC-006, MCP-002 ], source_refs: [] }, { item_index: 149, item_key: profile:security, verdict: covered, explanation: "The protected boundaries are consuming projects, personal host state, trusted released content and non-sensitive evidence. SEC-001/003 and ACC-003 prohibit project/global-test contamination and sensitive release/log disclosure; TOOL-003 disables normative telemetry. SEC-002/REL-002 require verified trust and deny use/publication on missing or failed integrity evidence. INV-001/002, DIST-003 and MAN-001 address unintended execution, duplicate activation and mixed dependency resources. MCP-002's available approved contract rejects unsafe paths, malformed/stale input and clarifies process-permission scope. No account service, stored-secret subsystem or additional authentication mechanism is established by this scope.", requirement_ids: [ SEC-001, SEC-002, SEC-003, ACC-003, TOOL-003, REL-002, INV-001, INV-002, DIST-003, MAN-001, MCP-002 ], source_refs: [] }, { item_index: 150, item_key: profile:cross-surface, verdict: covered, explanation: "The shared boundary is canonical skill identity/release to isolated Codex and Claude artifacts and their global/native activation. ARCH-001/002, DIST-001/003/006 and REL-001 preserve identity, target-specific names, versions and duplicate detection; TOOL-002/ACC-002 prove independent copied installation/replacement. MAN-001/ACC-008 reject missing or mixed-release dependencies, and INV-001/ACC-004 verify explicit activation versus excluded automatic activation. HOST-002/003 and ACC-006 name supported surfaces/platforms without asserting every Cartesian combination. Fixture-only HTTP/browser behavior remains in EVAL-001 campaign context, so it creates no additional application event/UI contract.", requirement_ids: [ ARCH-001, ARCH-002, DIST-001, DIST-003, DIST-006, REL-001, TOOL-002, ACC-002, MAN-001, ACC-008, INV-001, ACC-004, HOST-002, HOST-003, ACC-006, EVAL-001 ], source_refs: [] }, { item_index: 151, item_key: context:specification, verdict: covered, explanation: "The full non-requirement prose is consistent with the canonical, global-only, host-rendered and adaptive workflow requirements. Draft is correct during this independent review and does not contradict the future completion rule in INT-001. The confirmed Deep manifest activates core/operations/security/cross-surface for the collection and indexes historical planning documents, matching the explicit no-retrospective-artifacts decision. UI is inactive for this repository's own product interface; reusable UI/design workflow requirements remain valid conditional capabilities. The rationale's rollback concern does not reinstate explicitly excluded managed rollback, and summary scope creates no new lifecycle or publication authority.", requirement_ids: [ OUT-001, SCOPE-001, ARCH-001, TOOL-002, SPEC-001, PLAN-003, INT-001, UI-001, PLAN-004 ], source_refs: [ { id: specification.current-bundle-manifest, revision: 1 }, { id: ui.separate-design-planning, revision: 1 } ] } ]
