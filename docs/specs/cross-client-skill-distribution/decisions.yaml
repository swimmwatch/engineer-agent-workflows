    question:
      text: How should interview-driven skills behave on macOS and Windows while the current Prompt MCP dialog backend supports Linux only?
      kind: single
      options:
        - id: safe-native-fallback
          label: Safe host-native fallback (Recommended)
          description: Use Prompt MCP whenever callable; otherwise use the active host's bounded user-input mechanism, preserve the same ledger, and never infer an answer from cancellation or failure.
        - id: block-without-prompt-mcp
          label: Block without Prompt MCP
          description: Mark material decisions blocked on unsupported platforms and refuse to complete specifications or plans until Prompt MCP becomes available.
        - id: require-cross-platform-prompt-mcp
          label: Require cross-platform Prompt MCP first
          description: Treat a macOS and Windows Prompt MCP backend as an external prerequisite, preventing the workflow bundle from reaching v1 until that dependency exists.
    answer:
      selected_ids: []
      text: >-
        Ignore cross-platform Prompt MCP support for this project. The project is primarily for personal use; revisit the decision only if Prompt MCP is made cross-platform in the future.
    rationale: Cross-platform Prompt MCP implementation and delivery are excluded from v1; installer portability does not guarantee availability of external MCP dependencies on every host.
    last_tool_status: answered
    supersedes_revision: null
