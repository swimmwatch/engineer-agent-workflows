    workload: Both authored templates and all three generated distributions; actually packaged runtime/complete skill resources in fresh cwd/home without checkout, planning bundle or engineering-workflow MCP; missing/incompatible CaseRuntime or shared resources; supported/observed platform matrix.
    procedure: Run existing saved/generated-byte checks for explicit-only metadata, size bounds, declared substitutions, host leakage and shared-resource equality. Execute delivered package entry/discovery and real protocol negotiation from isolated packaged resources, not checkout imports. Verify standalone prerequisites and fail-closed manual verifier/missing-runtime paths without install/registration/fetch. Inspect compatible API/fallback choices and bounded portability fixtures; label them non-native.
    observation: Independent packaged application and standalone skills use one compatible canonical contract without a planning dependency or direct-storage fallback. Missing capabilities/shared bundle stop dependent work with a prerequisite, not reconstructed guidance or auto-install. Required three-OS/four-browser compatibility remains implemented; unrun combinations supported/unverified, no extra native gates. Packaging/fixture checks are not three-host or actual-model proof.
