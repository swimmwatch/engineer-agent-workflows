    workload: Real child commits but reply is lost; same-ID exact retry after later head moves; changed same-ID intent; two processes share stale expected revision.
    procedure: Enter actual commit/reply boundary, interrupt only reply collection, inspect original operation and replay exact request; synchronize competing real writers with finite owned barriers.
    observation: One effect/receipt; replay checked before stale CAS; changed intent conflicts; only one stale writer publishes; unknown effects never asserted unapplied.
