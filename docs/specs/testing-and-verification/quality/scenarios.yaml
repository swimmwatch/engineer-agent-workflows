    environment: E-CHROME
    evidence_kind: real_browser
    dependencies: [Q-006, Q-009]
    manual_gates: [G-DESIGN]
    workload: Actual UI fetch and SDK MCP case AND suite create/read/edit/rename/retire; invalid graphs/unknown oracle/unknown fields/version/operation; repeated create/lost reply, stale CAS, dirty/in-flight project switch and URL-only explicit library across fresh sessions.
    procedure: Perform each applicable mutation in UI and MCP, then retrieve exact revisions/digests from both. Compare visible invalid/unsaved/conflict feedback and bounded typed errors before effects. Induce busy/unavailable, cancellation and uncertain/applied outcomes at actual transport boundaries; inspect effect before exact same-intent replay. Old clients cannot erase newer required fields. Reopen explicit URL-only library; inspect missing context without default initialization.
    observation: Same canonical state and validation/error/effect semantics, no shadow store, coercion or unknown-operation success. Identical create/retry yields one effect; stale writer keeps proposed input and visible reconciliation path. No cross-project retarget/auto-save, hidden failure acknowledgment or loss of historical tested revisions. Field/relationship diagnostics remain bounded/redacted; cancellation never asserts rollback of unknown effects.
    threshold:
      {
        metric: UI_MCP_identity,
        unit: set,
        operator: set_equals,
        expected: same-project-library-case-revision-digest,
        provenance: requirement,
      }
    discrimination: Route UI to shadow storage, accept unknown/newer fields by dropping them, repeat a lost-effect create, save a suite into another project or discard unsaved conflict input; independent public readback/error/effect assertion must fail.
