    workload: Actual selected upstream renderer/notices; six outcomes, distinct variants/repetitions, FAIL then PASS, required blocked case; EACH prior attempt/earlier FAIL, original sanitized generation input, attachments and failed-generation/history chain.
    procedure: Generate from actual saved canonical run, open usable upstream view and prominently linked canonical denominator/gaps. Through actual UI/links follow every retained attempt/violation/input/attachment, complete all bounded public pages/byte portions and compare digests to original sanitized bytes. Repeat after agent MCP close and UI restart in Q-018; DB-only refs or existence checks do not satisfy inspectability.
    observation: Real upstream viewer, not a lookalike; full denominator remains honest despite green-looking charts/latest retry. Every earlier product FAIL and original retained input/attachment is actually inspectable through UI/links, including failed generations. Stable identity excludes temporary paths/secrets; unknown or missing historical files visibly unavailable, never silently dropped/reconstructed.
