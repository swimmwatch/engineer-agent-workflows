    workload: 1000 cases/100 suites, byte-pressure pages, all filters and Unicode portions; unrelated observation publication between EVERY continuation; malformed/query/ref-mismatched cursor, unavailable/incompatible pinned snapshot and corrupt retained authority/navigation.
    procedure: Enumerate all pages/portions and independently compare complete expected ID/revision/digest set and decode-key observer. Exercise exact query/source/ref bindings through current and retained snapshots, then negative cursor/snapshot cases without authorizing repair or silently restarting enumeration.
    observation: Final page appears once; available historical snapshot remains exact and current drift separate. Invalid cursor, stale/unavailable snapshot and corrupt source are explicit distinct errors, not current-data fallback. Targeted lookup decodes no unrelated bodies. Missing/stale/corrupt navigation cannot hide active cases or certify full coverage; limit response preserves references/denominator/continuation.
    threshold:
      {
        metric: complete_inventory_refs,
        unit: set,
        operator: set_equals,
        expected: frozen-expected-id-revision-digest-set,
        provenance: fixture,
      }
    discrimination: Stop one page early, repin current data, silently recover a missing snapshot or decode all bodies before filtering; exact set/portion/error/observer assertion must fail. Fixture scale establishes correctness, not performance.
