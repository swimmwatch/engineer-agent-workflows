    dependencies: [Q-001]
    manual_gates: []
    workload: Complete criterion-linked charter and saved definitions before script/launch; two fresh QA passes including FAIL/BLOCKED and unknown-oracle draft/stale; existing ready SUT; smoke-only budget exhaustion; one product diagnostic versus TWO correctable driver errors; deployment/auth change, uncertain POST and automation recommendation.
    procedure: Exercise delivered P10 flow using real temporary drivers outside SUT checkouts and real canonical storage. Trace criterion/oracle, risk/priority, preconditions/data, actions/expectations, requiredness, method, dependencies and cleanup to saved case revisions BEFORE driver digest/launch. Second fresh pass searches/reuses IDs. Observe no startup for a verified existing SUT; stop admission at caller budget. Correct and rerun two driver errors, read back possibly applied POST before replay, and reobserve affected checks after target/auth/source change.
    observation: Definitions for failed/blocked scenarios persist separately from results; missing oracle stays non-ready, never inferred from product behavior. Budget leaves remaining required cases NOT_RUN/INCOMPLETE without narrowing full scope. Default product diagnostic is at most one unless justified, not a cap on driver correction; known missing prerequisite is not relaunched. Automation recommendation cites IDs/revisions, layer, benefit/limits and verified existing entrypoint-to-covered-revisions; no accepted coverage, permanent tests or product fixes invented.
    threshold:
      {
        metric: driver_sequence,
        unit: trace,
        operator: accounts_for,
        expected: all-attempts-and-required-outputs,
        provenance: requirement,
      }
    discrimination: Skip saved definitions, create a second QA identity, reuse changed-target evidence, issue another known-unsafe POST or stop script repair after the product-repeat allowance; actual trace/ref/effect assertion must fail. Failed definition or result persistence remains explicit. Controlled flow is not actual-native/model proof.
  - id: Q-004
    state: planned
    requirement_ids: [MT-010, MT-011]
    producer: P10
    consumers: [P11, P12]
    source_ids:
