    workload: Actual hot-journal recovery need; crashed/unknown-owner guard; missing/corrupt/newer layout and derived navigation; explicit authorized same-intent recovery.
    procedure: Read through real readOnly boundary before recovery and compare owned bytes/rows/modes/sidecars; then authorize exact recovery/repair under fresh inspected state.
    observation: GET never opens writable, creates, repairs, steals lock by age or migrates; unknown recovery state stays explicit. Repair changes derivation only; canonical/history unchanged.
