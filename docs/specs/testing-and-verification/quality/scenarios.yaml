    procedure: Freeze through actual beginRun, retrieve entire selection and independently compare literal expected execution tuples and body refs; edit a definition afterward.
    observation: Exact-key dedup only, explicit repetitions preserved; all active non-ready positions remain blocked/in denominator. Subset never broadens; old run unchanged with visible drift. Missing library is an explicit population/location prerequisite, never an empty PASS, automatic QA invocation or invented definitions.
