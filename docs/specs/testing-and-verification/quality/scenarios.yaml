environments:
  - id: E-FIXTURE
    kind: fixture
    policy: Controlled fixtures and syntax/shape checks are simulation only; they are not native/client/model or real-memory evidence.
  - id: E-CORE
    kind: linux_native
    policy: Real temporary SQLite/core/transport processes on Linux; record exact Node/SQLite/SDK versions at future entry, unavailable metrics null with reasons.
  - id: E-CHROME
    kind: linux_chrome
    policy: Real Google Chrome on Linux in a fresh owned profile; Chromium alone is not equivalent evidence. Record actual browser version.
  - id: E-NATIVE
    kind: linux_native
    policy: Actual callable Harness/Claude/Codex on Linux with isolated fresh homes/contexts and separately authorized chosen models; record actual versions/permissions/models.
  - id: E-SUPPORT
    kind: supported_unverified
    policy: Implement Windows/macOS and desktop Chrome/Edge/Firefox/Safari on applicable OSes; unrun combinations remain supported/unverified, not additional native completion gates.
gates:
  - id: G-CLIENTS
    owner: User
    condition: Explicitly authorize each real client launch with fresh isolated home/context, target scope and permissions. No real profiles or implicit global registration.
  - id: G-MODELS
    owner: User
    condition: Explicitly authorize actual chosen models and trial budget. Host recommendations are advisory; missing permission blocks required trials without inventing consent.
  - id: G-RENDERER
    owner: User
    condition: Confirm the agreed renderer is already available or separately authorize exact acquisition/configuration. Missing Allure blocks actual rendering; never auto-install.
  - id: G-DESIGN
    owner: Separately invoked design-planning owner
    condition: Qualify the four declared shared/screen design outputs and P09 implementation before dependent UI checks. No Penpot action or invented design identity here.
checks:
  - id: Q-001
    state: planned
    requirement_ids:
