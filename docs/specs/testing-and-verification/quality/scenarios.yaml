    procedure: Send actual browser/fetch/MCP negative requests in owned roots with inert protected markers; inspect real bind address and production protected-open/effect observations.
    observation: Deny before protected bytes/effects, no markers in errors/logs, no remote wildcard listener; guessed ID/context/path never grants authority.
