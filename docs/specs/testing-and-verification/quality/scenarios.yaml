    workload: Actual P10 reporting on each authorized host, two distinct invocations; six outcomes, optional/required gaps and empty scope; Markdown save denied; product failure, clean run, failed library/report persistence and cleanup.
    procedure: Inspect actual P10 Markdown outputs from authorized native runs, independently read canonical summary/attempts and follow report/run/case-revision links. Check mode/target/build uncertainty, oracle, plan/presence inventory, expected/actual reproduction, script-health/repairs, intermittent findings, gaps/budget/available metrics, library maintenance/automation, cleanup and next owner. Use owned output roots; repeat invocation and deny the next report save without deleting old evidence.
    observation: Distinct invocation reports preserve earlier findings/user edits and sanitized linked evidence. Canonical FAILED wins for any product violation; otherwise required gaps/empty execution are INCOMPLETE, optional gaps limitations. Denied save gives available chat results and explicit incomplete persistence, never saved-report success. Clean stated scope explicitly says no bugs found and stops without source/workflow/checklist changes or automatic next packet.
    threshold:
      {
        metric: canonical_verdict,
        unit: boolean,
        operator: equals,
        expected: true,
        provenance: agreed_contract,
      }
    discrimination: Overwrite prior Markdown, omit an expected/actual case link, claim saved after denial, hide a required gap or auto-advance after clean output in an isolated delivery copy; actual report/chat/ref/inventory assertion must fail. Q-014 retains independent real-core verdict discrimination.
