    procedure: Use actual application operations and immutable body retrieval; compare IDs, revisions, provenance, membership/order, search and history before/after each valid or invalid mutation. Test lifecycle independently from readiness and verify denied/malformed updates leave the old coherent state.
    observation: One canonical identity/history, rejected invalid graph/content without silent repair or coercion. Rename retains suite/result references; failed runs never retire cases. Unknown oracle remains draft/stale; costs retain provenance. No title-based merge or expectation change for green; recommended/decided/old-revision automation is not implemented current coverage. Q-003 separately verifies QA maintenance and recommendation behavior.
