    state: observed
    provenance: repository
    fact: The source workflow hard-codes a local root, Python/backend conventions, Linux RAM/process checks and model aliases. Its facts script recognizes only selected AC/REQ identifier formats, scans backend changes and searches tests in the current checkout. These are source-specific mechanisms, not portable ecosystem contracts.
