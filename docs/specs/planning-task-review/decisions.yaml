    state: observed
    provenance: repository
    fact: Current test discipline permits recording a proof mutation and its failed checks in packet notes or handoff. The packet contract makes handoff current-only and incremental implementation replaces it after the current packet. Therefore a conforming handoff-only record is not guaranteed to remain available when a later packet is reviewed, especially without a Git commit. This observation does not change existing workflow behavior.
