    instruction:
      text: |-
        В проекте kap-app есть workflow для Claude Code, который запускает ревью пакетов задач, подготовленных в рамках планирования. Я хотел бы адаптировать и перенести его в наш проект. Можешь изучить, как он устроен и работает, что делает, и подготовить спецификацию по его адаптации к нашей экосистеме скиллов, MCP и workflow?

        Задавая уточняющие вопросы, давай адаптируем и спроектируем хороший workflow skill, который будет выполнять хорошую ревью задач.
      source: user
      kind: initial_request
