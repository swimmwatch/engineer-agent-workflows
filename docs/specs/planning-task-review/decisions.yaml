  - category: review-disposable-environments
    state: instructed
    provenance: user
    instruction:
      text: Я думаю, это слишком избыточно, и это будет очень долго растягивать. Мне кажется, не надо делать никакие безопасные слоты. Просто нужно сказать, чтобы делал безопасные в отдельном окружении, может, во временном. То есть, как-то копировал бы файлы, создавал бы отдельный workspace, и там делал бы проверки. Если вещь связана с базой данных, то надо отдельную базу данных создать, чтобы другие не затрагивали. То есть, временную базу данных, потом ее удалить. То есть, можно просто какие-то вещи создать и потом удалить.
      source: User amendment replaces the proposed execution-slot/queue admission mechanism with reviewer-owned isolated temporary workspaces and temporary test databases that are created and removed without affecting other work. It changes that part of the preceding amendment; early and independent later checks and the remaining agreed workflow scope are retained.
      kind: follow_up
