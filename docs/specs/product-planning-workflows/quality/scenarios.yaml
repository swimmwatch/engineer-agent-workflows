    setup: "Predeclared fixture answers, Lite CLI and multi-profile UI/API product documentation."
    action: "Separate author, reviewer, planner and Terra packet executor; supply actual upstream artifacts only."
    expected: "Capture real calls, selected reads, output versions and independent acceptance results."
    excluded: "No hidden expected verdicts, simulated consent treated real, or model trials in npm test/CI."
    prove: "Have an external checker classify trace evidence; don't claim regex-only behavioral pass."
    suite: "product-e2e"
    implemented: false
  - id: Q39
    packet: "P18"
    requirements:
      [
        "PWF-001",
        "PWF-002",
        "PWF-011",
        "PWF-012",
        "PWF-020",
        "PWF-022",
        "PWF-024",
        "PWF-025",
        "PWF-027",
        "PWF-031",
        "PWF-033",
      ]
    name: "Developer documentation handoff"
    setup: "Implemented and qualified runtime; documentation reader without feature-author history."
    action: "Reader follows fixture-only examples and answers store/pins/recovery/legacy questions."
    expected: "Examples match actual typed schemas and documented safeguards; limitations explicit."
    excluded: "No undocumented backup boundary, unsafe real-home commands or claims of unrun platform checks."
    prove: "Introduce one incorrect example in isolated review copy and ensure the check rejects it."
    suite: "product-documentation"
    implemented: false
  - id: Q40
    packet: "P20"
    requirements: ["PWF-035"]
    name: "Bounded non-reflecting workflow diagnostics"
    setup: "Invalid known fields, unknown malicious keys, Unicode values and enough issues to exceed count and byte budgets."
    action: "Call existing Zod-backed workflow scenarios and inspect protocol-2 errors."
    expected: "At most 20 closed issues and 8192 UTF-8 bytes retain kind, safe path/index, truncation and fixed recovery."
    excluded: "No answer, explanation, token, absolute path, stack, arbitrary key/value or product-schema contract rewrite."
    prove: "Temporarily reflect one sentinel input value and require the leak assertion to fail."
    suite: "workflow-diagnostics"
    implemented: false
  - id: Q41
    packet: "P20"
    requirements: ["PWF-035", "PWF-038"]
    name: "Saved option and indexed link recovery"
    setup: "One saved single-choice question and 20 current decisions plus duplicate, unknown, stale and foreign variants."
    action: "Submit an invalid option and 1/20/21-member link calls with a failing final member."
    expected: "Errors identify only saved options or the safe failing index/reference; rejected calls preserve bytes, versions and receipts."
    excluded: "No inferred answer, partial prefix write, skipped member or automatic refresh/retry."
    prove: "Temporarily commit one prefix member and require the atomicity assertion to fail."
    suite: "workflow-diagnostics"
    implemented: false
  - id: Q42
    packet: "P20"
    requirements: ["PWF-036"]
    name: "Supersession-aware warning compatibility"
    setup: "Linear revisions, two independent heads, two branches, two ambiguous IDs and explicit superseded rows."
    action: "Parse/query the same journals before and after warning correction."
    expected: "Linear or explicit supersession warns zero; each ambiguous ID warns once; selected current records stay compatible."
    excluded: "No predecessor rewrite, changed current-selection rule or acceptance of invalid supersedes links."
    prove: "Restore predecessor counting and require the linear-chain assertion to fail."
    suite: "workflow-diagnostics"
    implemented: false
  - id: Q43
    packet: "P20"
    requirements: ["PWF-037", "PWF-038"]
    name: "Document checkpoint and review lifecycle matrix"
    setup: "Missing/Draft/Approved status; full/followup pending, consistency, completed and stale review states; two clients."
    action: "Call check-state, read-only status and intentionally invalid lifecycle writes."
    expected: "Independent status/checkpoint fields and fixed recovery are accurate; only one eligible observation writes; stale writes conflict."
    excluded: "No MCP approval, semantic/authentication claim, status edit, blind retry or read-only receipt."
    prove: "Make read-only status record a receipt and require byte/version assertions to fail."
    suite: "workflow-diagnostics"
    implemented: false
  - id: Q44
    packet: "P21"
    requirements: ["PWF-039", "PWF-041"]
    name: "Single and batch verdict parity"
    setup: "Equal fully read full and eligible-followup inventories with covered, gap, conflict and non-behavioral verdicts."
    action: "Record one inventory with singles and one with 1/20-item batches."
    expected: "Saved semantic results, evidence enforcement and coverage agree; consistency remains separate."
    excluded: "No blanket verdict, inherited-item resubmission, premature completion or authenticated-reading claim."
    prove: "Bypass one shared evidence check in the batch path and require parity assertions to fail."
    suite: "review-batch"
    implemented: true
  - id: Q45
    packet: "P21"
    requirements: ["PWF-035", "PWF-039", "PWF-040"]
    name: "Batch bounds and atomic rejection"
    setup: "1/20/21 items, duplicate indexes, multibyte requests around 131072 compact-JSON bytes and a failing final member."
    action: "Submit each request and compare journal bytes, versions, verdicts and receipt counts."
    expected: "Only valid bounded batches commit once; every invalid batch is a no-write with safe zero-based diagnostics."
    excluded: "No partial prefix, skipped overlap, response-after-commit overflow or transport-limit change."
    prove: "Temporarily append a validated prefix and require unchanged-state assertions to fail."
    suite: "review-batch"
    implemented: true
  - id: Q46
    packet: "P21"
    requirements: ["PWF-038", "PWF-040"]
    name: "Exact replay restart and concurrency"
    setup: "Two stdio clients, one committed batch with lost response, server restart, overlap/reorder/contradictory retries."
    action: "Replay the exact original request, then use status and the returned context for subsequent writes."
    expected: "Exact replay returns one stored result; non-exact retries reject; observer reads are harmless and stale writes conflict."
    excluded: "No automatic rebase, overwrite, mixed existing/new success or replay beyond retained evidence."
    prove: "Disable stored-result replay and require duplicate-write or stale-recovery assertions to fail."
    suite: "review-batch"
    implemented: true
  - id: Q47
    packet: "P21"
    requirements: ["PWF-039", "PWF-040", "PWF-041"]
    name: "Measured write reduction and exact delivery"
    setup: "Equal 60-item inventories, synthetic 1000/10000-row histories and a display-compression adapter."
    action: "Compare 60 singles with three 20-item batches; measure commits, bytes, final size, receipts and elapsed time."
    expected: "Semantic outcomes agree and verdict commits are 60 versus 3; residual storage costs and unavailable exact text stay explicit."
    excluded: "No claimed fewer reads, authenticated understanding, universal latency target, compaction or real customer ledger."
    prove: "Substitute a display marker for exact text and require delivery evidence to remain unverified."
    suite: "review-batch"
    implemented: true
  - id: Q48
    packet: "P22"
    requirements: ["PWF-042"]
    name: "Enhanced final consistency gate"
    setup: "Enhanced and legacy full runs with detailed results, long complete specification and a later detailed-verdict change."
    action: "Attempt early completion/recording, consume final exact context, record conflict or consistency, then complete."
    expected: "Enhanced mode requires fresh whole-spec/verdict evidence; conflict yields gaps; legacy evidence remains readable."
    excluded: "No legacy migration, early receipt reuse, consistency in detailed batch or semantic-proof claim."
    prove: "Bypass final receipt/completion gate and require premature-completion assertion to fail."
    suite: "review-full-consistency"
    implemented: true
  - id: Q49
    packet: "P22"
    requirements: ["PWF-042", "PWF-041"]
    name: "Bounded reviewer progress and normative prose"
    setup: "Neutral synthetic source with public interface prose, conflicting lifecycle order and an illustrative example."
    action: "Use updated author/reviewer references in the existing P17 fresh-context trial; inspect all source portions and acknowledged writes."
    expected: "Saved progress advances per bounded group; final assessment considers cross-section obligations and does not invent a requirement from an example."
    excluded: "No hidden expected verdict hints, read-all backlog requirement, one-write-only restriction or regex semantic proof."
    prove: "Deterministic receipt/ordering checks distinguish early final recording; actual semantic trial absence stays unverified."
    suite: "review-full-consistency"
    implemented: false
  - id: Q50
    packet: "P23"
    requirements: ["PWF-043"]
    name: "Safe context-only correction"
    setup: "Latest completed Draft gaps review; one finding-linked baseline phrase changes while requirement/source meanings and scope stay unchanged."
    action: "Read changes exactly, start followup, recheck required closure and profiles, assess final consistency."
    expected: "Unaffected detailed verdicts retain parent attribution; fresh context assessment is mandatory."
    excluded: "No blanket inheritance, new scope via prose, removed obligation, source change or uncertain-impact pass."
    prove: "Bypass source-meaning guard or final consistency and require unsafe-inheritance test to fail."
    suite: "review-structured-changes"
    implemented: true
  - id: Q51
    packet: "P23"
    requirements: ["PWF-044"]
    name: "Structured navigation and exact evidence"
    setup: "Large synthetic report with long Unicode finding and before/after fields, many required/candidate keys."
    action: "Traverse summary and evidence cursors; compare reconstructed records to legacy text output."
    expected: "Typed finding keys and fixed reasons permit fix mapping; terminal exact read yields valid equivalent changes receipt within budgets."
    excluded: "No summary receipt, silent truncation, parsing partial JSON or mandatory server-code inspection."
    prove: "Issue receipt on summary/incomplete evidence and require followup authorization assertion to fail."
    suite: "review-structured-changes"
    implemented: true
  - id: Q52
    packet: "P23"
    requirements: ["PWF-043", "PWF-044"]
    name: "Change-report identity and fail-closed recovery"
    setup: "Foreign parent/project cursor, current source mutation, missing snapshot and incomplete fix mapping."
    action: "Continue reads or request inheritance while recording before/after durable digests and receipt counts."
    expected: "Stale/foreign/incomplete evidence rejects without writes; source uncertainty falls back to full independent review."
    excluded: "No mixed report versions, invented original content or successful accelerated semantic judgment from hashes."
    prove: "Bypass report/source identity comparison and require mixed-version assertion to fail."
    suite: "review-structured-changes"
    implemented: true
  - id: Q53
    packet: "P24"
    requirements: ["PWF-045", "PWF-021"]
    name: "Journal race versus semantic drift"
    setup: "Two independent stdio clients with a deterministic barrier around guarded dependency verification."
    action: "Record a verdict during an observer read; separately submit a stale mutation and change a real requirement/source."
    expected: "Classified failures distinguish read race/context from positively established semantic drift; saved verdict survives reopen."
    excluded: "No inconsistent read success, observer mutation, waived stale-write check or automatic write replay."
    prove: "Bypass read guard or mislabel byte-only drift as semantic and require assertion to fail."
    suite: "review-conflict-causes"
    implemented: true
  - id: Q54
    packet: "P24"
    requirements: ["PWF-045", "PWF-035"]
    name: "Safe unknown conflict classification"
    setup: "Unavailable coherent comparison plus malicious values, absolute paths and over-budget diagnostics."
    action: "Trigger enrichment and capture actual wire errors."
    expected: "Original failure persists with safe unknown cause when needed; closed diagnostics remain bounded and redacted."
    excluded: "No guessed semantic drift, leaked source/token/path or falsely reported successful recovery."
    prove: "Reflect one protected sentinel into cause/details and require leak test to fail."
    suite: "review-conflict-causes"
    implemented: true

