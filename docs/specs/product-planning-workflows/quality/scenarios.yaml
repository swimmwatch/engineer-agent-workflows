    packet: "P01"
    requirements:
      ["PWF-003", "PWF-011", "PWF-015", "PWF-018", "PWF-028", "PWF-030"]
    name: "Root defaults and legacy isolation"
    setup: "Unset/default, explicit absolute override, malformed override; untouched isolated home and legacy project."
    action: "Call capabilities/open; then explicitly initialize."
    expected: "Default/override resolves correctly; only initialize creates the dedicated store."
    excluded: "No startup argument support, implicit root creation, fallback after invalid override or legacy file change."
    prove: "Disable the lazy boundary and require the old-tool/no-create assertion to fail."
