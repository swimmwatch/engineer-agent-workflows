    setup: "Unicode/spaced fixture roots; links, hardlinks/junctions, case collisions, traversal and wrong owner."
    action: "Try safe and rejected product/document access on each target OS."
    expected: "Safe ordinary paths work; rejected calls preserve fixture and unrelated-file digests."
    excluded: "No POSIX-only flag equivalence or elevated fallback."
    prove: "Bypass one link/owner check and observe protected-file assertion fail."
    suite: "product-foundation"
    implemented: true
