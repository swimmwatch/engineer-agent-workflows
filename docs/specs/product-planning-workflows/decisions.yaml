2 }, { id: eb7d7aa2-5d2c-4f1a-b445-a41cf913f32b, revision: 3 } ] }, { item_index: 53, item_key: requirement:PWF-015, verdict: covered, explanation: "Stable owner-qualified IDs and exact source pins directly answer the requested cross-artifact identity and context requirements, preserving references through moves without title/path identity.", requirement_ids: [], source_refs: [ { id: c0c465d8-805c-4f37-b765-c88c19d037e7, revision: 2 }, { id: 57d5a867-9f8b-4014-9225-e25a92977947, revision: 2 } ] }, { item_index: 54, item_key: requirement:PWF-016, verdict: covered, explanation: "The requirement faithfully encodes one logical specification per independent task plus all requested lineage relations, while correctly treating packets, RED/GREEN steps and working copies as non-tasks.", requirement_ids: [], source_refs: [ { id: ea9e93d8-4f2c-4749-99d0-49e69e5d8d14, revision: 2 }, { id: b3fe5c8f-152e-4e57-bc07-f6cfcd63dc77, revision: 2 }, { id: c0c465d8-805c-4f37-b765-c88c19d037e7, revision: 2 }, { id: 18ee7d64-9e1e-4ec3-8320-1f7bf10a55ff, revision: 3 }, { id: 5a8d4951-74f2-457f-a697-2be83e3ccafd, revision: 3 } ] }, { item_index: 55, item_key: requirement:PWF-017, verdict: covered, explanation: "The scenario inventory covers each requested authoring, lookup, context, review, amendment and recovery use case through typed semantic operations and forbids generic YAML/JSON/file editing fallbacks.", requirement_ids: [], source_refs: [ { id: c0c465d8-805c-4f37-b765-c88c19d037e7, revision: 2 } ] }, { item_index: 56, item_key: requirement:PWF-018, verdict: covered, explanation: "The protocol contract preserves protocol 2, strict schemas, annotations, returned mutation contexts, bounded failures, old spec-only clients and no implicit Git/network effects.", requirement_ids: [], source_refs: [ { id: 1c9f596b-f2a9-413b-877f-e3b0644f7d96, revision: 2 }, { id: 923e148d-fa4c-4fce-813c-f99601a1b1c8, revision: 2 }, { id: 9454e6ee-65bb-4e6f-b398-063f8d487726, revision: 2 } ] }, { item_index: 57, item_key: requirement:PWF-019, verdict: covered, explanation: "The purpose-driven context contract supplies exact pins, required/optional inventories and continuations across selected members, and explicitly forbids summaries, full journals or product profile hints from replacing task scope.", requirement_ids: [], source_refs: [ { id: ea9e93d8-4f2c-4749-99d0-49e69e5d8d14, revision: 2 }, { id: c0c465d8-805c-4f37-b765-c88c19d037e7, revision: 2 } ] }, { item_index: 58, item_key: requirement:PWF-020, verdict: covered, explanation: "The version/evidence requirement preserves exact historical content outside Git, restart durability, predecessor provenance and conservative retention without copying entire journals or replacing missing evidence with current text.", requirement_ids: [], source_refs: [ { id: c0c465d8-805c-4f37-b765-c88c19d037e7, revision: 2 }, { id: a9ecaf21-8d40-448b-addd-83607c10f660, revision: 3 }, { id: 71ccb286-c3d0-4612-9ba9-e8bf1b0fad65, revision: 5 }, { id: fc969c47-5cd7-4097-aa6f-827a5dc38a3b, revision: 2 }, { id: e29ebc13-4cba-41d7-b663-4fef471a18cf, revision: 2 } ] }, { item_index: 59, item_key: requirement:PWF-021, verdict: covered, explanation: "The concurrency contract faithfully preserves read-only observers, coherent version-bound pages, exact replay recovery, true stale-write rejection and explicit reopen/inspection without transparent mutation retry.", requirement_ids: [], source_refs: [ { id: 7f47fe2e-a9aa-4173-8b98-f23f6ec69c91, revision: 3 }, { id: 1c9f596b-f2a9-413b-877f-e3b0644f7d96, revision: 2 }, { id: 923e148d-fa4c-4fce-813c-f99601a1b1c8, revision: 2 }, { id: 9454e6ee-65bb-4e6f-b398-063f8d487726, revision: 2 } ] }, { item_index: 60, item_key: requirement:PWF-022, verdict: covered, explanation: "The multi-file recovery requirement matches the chosen MCP-process interruption guarantee, preserves coherent prior state or explicit incomplete state and excludes power-loss/disk/hostile-edit promises.", requirement_ids: [], source_refs: [ { id: e9dc586b-5f77-4454-9bcb-8c6458c5ca57, revision: 3 }, { id: 477838f8-ad4c-4491-8bba-9b96b25cf603, revision: 3 }, { id: 7f47fe2e-a9aa-4173-8b98-f23f6ec69c91, revision: 3 }, { id: 1c9f596b-f2a9-413b-877f-e3b0644f7d96, revision: 2 } ] }, { item_index: 61, item_key: requirement:PWF-023, verdict: covered, explanation: "The isolated-draft contract faithfully implements reviewed activation in shared storage, preventing unfinished or stale candidates and partial members from becoming current.", requirement_ids: [], source_refs: [ { id: 1172a36d-2bdf-4d8b-aeb8-f8ef95d21b53, revision: 3 }, { id: 71ccb286-c3d0-4612-9ba9-e8bf1b0fad65, revision: 5 }, { id: 7f47fe2e-a9aa-4173-8b98-f23f6ec69c91, revision: 3 }, { id: e29ebc13-4cba-41d7-b663-4fef471a18cf, revision: 2 } ] }, { item_index: 62, item_key: requirement:PWF-024, verdict: covered, explanation: "The pinned-task rule preserves ordinary completion against exact started inputs, keeps future packets explicit and excludes new/unstarted work, commits and reviews from that permission.", requirement_ids: [], source_refs: [ { id: 496e88f7-b0dc-4bc8-b686-ca5f161d1905, revision: 3 }, { id: dd594f5b-9e12-4c42-96eb-2874257154ee, revision: 3 } ] }, { item_index: 63, item_key: requirement:PWF-025, verdict: covered, explanation: "The safety override implements the selected exception with a concrete issue, pause and user disposition, while allowing unaffected work and avoiding unsupported automatic risk inference.", requirement_ids: [], source_refs: [ { id: 496e88f7-b0dc-4bc8-b686-ca5f161d1905, revision: 3 }, { id: dd594f5b-9e12-4c42-96eb-2874257154ee, revision: 3 } ] }, { item_index: 64, item_key: requirement:PWF-026, verdict: covered, explanation: The direct-edit reconciliation rules preserve Markdown authority and user intent without treating arbitrary changes as consent or allowing unsafe text to bypass renewed review., requirement_ids: [], source_refs: [ { id: eb7d7aa2-5d2c-4f1a-b445-a41cf913f32b, revision: 3 }, { id: 8245c92f-abf0-4c2b-b3d1-9ee2ac0b6c9d, revision: 2 } ] }, { item_index: 65, item_key: requirement:PWF-027, verdict: covered, explanation: The legacy contract follows the explicit no-migration answer and observed compatibility boundary while keeping old standalone workflows working., requirement_ids: [], source_refs: [ { id: 804cd1e3-e197-4d16-b3cd-c0717801f91c, revision: 3 }, { id: 9454e6ee-65bb-4e6f-b398-063f8d487726, revision: 2 } ] }, { item_index: 66, item_key: requirement:PWF-028, verdict: covered, explanation: "The local-access contract preserves the shared-root and no-allowlist interaction, validates paths/bindings before writes and keeps process permissions as the trust boundary on all supported platforms.", requirement_ids: [], source_refs: [ { id: e9dc586b-5f77-4454-9bcb-8c6458c5ca57, revision: 3 }, { id: 4d15acd9-f64e-41ff-a7ef-6d24ec01152a, revision: 3 }, { id: 8245c92f-abf0-4c2b-b3d1-9ee2ac0b6c9d, revision: 2 } ] }, { item_index: 67, item_key: requirement:PWF-029, verdict: covered, explanation: "The provenance requirement applies existing consent, privacy and untrusted-content rules without inventing authentication or semantic identity from machine-local paths.", requirement_ids: [], source_refs: [ { id: 8245c92f-abf0-4c2b-b3d1-9ee2ac0b6c9d, revision: 2 } ] }, { item_index: 68, item_key: requirement:PWF-030, verdict: covered, explanation: "The scale contract preserves all observed source/revision/request/reply bounds, deterministic continuations and explicit failures while requiring measurements instead of latency claims.", requirement_ids: [], source_refs: [ { id: e9dc586b-5f77-4454-9bcb-8c6458c5ca57, revision: 3 }, { id: 923e148d-fa4c-4fce-813c-f99601a1b1c8, revision: 2 } ] }, { item_index: 69, item_key: requirement:PWF-031, verdict: covered, explanation: "The integration contract faithfully connects selected product evidence to one-task/one-spec planning and one-packet implementation while preserving separate design, review, commit and Penpot authority.", requirement_ids: [], source_refs: [ { id: ea9e93d8-4f2c-4749-99d0-49e69e5d8d14, revision: 2 }, { id: b3fe5c8f-152e-4e57-bc07-f6cfcd63dc77, revision: 2 }, { id: 5a8d4951-74f2-457f-a697-2be83e3ccafd, revision: 3 }, { id: 6c56266b-ba8e-4a62-9c69-b43d9d3a3e98, revision: 2 }, { id: 8245c92f-abf0-4c2b-b3d1-9ee2ac0b6c9d, revision: 2 } ] }, { item_index: 70, item_key: requirement:PWF-032, verdict: covered, explanation: "The reconciliation rule correctly distinguishes code, test, environment and product decisions and returns genuine product changes to their owner without rewriting PRD/TD to excuse code.", requirement_ids: [], source_refs: [ { id: ea9e93d8-4f2c-4749-99d0-49e69e5d8d14, revision: 2 } ] }, { item_index: 71, item_key: requirement:PWF-033, verdict: covered, explanation: "The evidence requirement makes success and material invalid/repeated/concurrent/interrupted/stale/recovery outcomes observable in fresh-context, cross-workspace flows and keeps model/security review separate.", requirement_ids: [], source_refs: [ { id: ea9e93d8-4f2c-4749-99d0-49e69e5d8d14, revision: 2 }, { id: 894a8a38-b926-446c-8373-0c962a19cc0d, revision: 2 } ] }, { item_index: 72, item_key: requirement:PWF-034, verdict: covered, explanation: "The metadata requirement addresses the tool audit with actionable contexts, refs, receipts, continuations, defaults and effects while remaining metadata-only and preserving runtime/API compatibility.", requirement_ids: [], source_refs: [ { id: 9c40e255-9786-495f-8fe4-4a6f53e0967d, revision: 1 } ] }, { item_index: 73, item_key: requirement:PWF-035, verdict: covered, explanation: The diagnostic requirement preserves protocol codes and strict size/redaction limits while giving actionable field/index/category information and keeping invalid batches atomic., requirement_ids: [], source_refs: [ { id: 3631e043-ab52-49bd-bb77-e1712c9dc6e2, revision: 2 }, { id: 821caa98-e5cd-4085-8b26-2a75492adb62, revision: 2 }, { id: 91400cb1-7c89-4e83-bbda-fe2ccf02f246, revision: 2 } ] }, { item_index: 74, item_key: requirement:PWF-036, verdict: covered, explanation: "The warning correction counts ambiguous decision heads rather than history rows while preserving append-only data, selected-record semantics and existing link validations.", requirement_ids: [], source_refs: [ { id: 3631e043-ab52-49bd-bb77-e1712c9dc6e2, revision: 2 }, { id: 821caa98-e5cd-4085-8b26-2a75492adb62, revision: 2 }, { id: 91400cb1-7c89-4e83-bbda-fe2ccf02f246, revision: 2 } ] }, { item_index: 75, item_key: requirement:PWF-037, verdict: covered, explanation: "The status contract separates Markdown state, mechanical checks, review coverage and approval observation and keeps the author, not MCP, responsible for the Draft-to-Approved transition.", requirement_ids: [], source_refs: [ { id: 3631e043-ab52-49bd-bb77-e1712c9dc6e2, revision: 2 }, { id: 821caa98-e5cd-4085-8b26-2a75492adb62, revision: 2 }, { id: 91400cb1-7c89-4e83-bbda-fe2ccf02f246, revision: 2 } ] }, { item_index: 76, item_key: requirement:PWF-038, verdict: covered, explanation: "The lifecycle diagnostics preserve full/followup modes, evidence ordering, stale/conflict precedence and non-mutating recovery guidance, including enhanced final consistency.", requirement_ids: [], source_refs: [ { id: 3631e043-ab52-49bd-bb77-e1712c9dc6e2, revision: 2 }, { id: 821caa98-e5cd-4085-8b26-2a75492adb62, revision: 2 }, { id: 91400cb1-7c89-4e83-bbda-fe2ccf02f246, revision: 2 } ] }, { item_index: 77, item_key: requirement:PWF-039, verdict: covered, explanation: The batch contract exactly matches the selected 20-item/131072-byte bounds and preserves each item's exact-read/freshness/evidence rules and the separate consistency/completion boundaries., requirement_ids: [], source_refs: [ { id: 3631e043-ab52-49bd-bb77-e1712c9dc6e2, revision: 2 }, { id: 8df3ea7a-70a4-473c-b95c-1bee668c8c11, revision: 3 }, { id: acacb0db-b792-4a27-9beb-b747cea8bb56, revision: 3 }, { id: 821caa98-e5cd-4085-8b26-2a75492adb62, revision: 2 }, { id: 91400cb1-7c89-4e83-bbda-fe2ccf02f246, revision: 2 } ] }, { item_index: 78, item_key: requirement:PWF-040, verdict: covered, explanation: "The atomic batch contract faithfully implements whole-batch rejection on overlap, one coherent commit, exact replay within the latest-64 window and explicit inspection after non-exact retries.", requirement_ids: [], source_refs: [ { id: 3631e043-ab52-49bd-bb77-e1712c9dc6e2, revision: 2 }, { id: 8df3ea7a-70a4-473c-b95c-1bee668c8c11, revision: 3 }, { id: 821caa98-e5cd-4085-8b26-2a75492adb62, revision: 2 }, { id: 91400cb1-7c89-4e83-bbda-fe2ccf02f246, revision: 2 } ] }, { item_index: 79, item_key: requirement:PWF-041, verdict: covered, explanation: "The exact-delivery and measurement contract requires lossless source reconstruction, equal semantic outcomes and actual byte/write/time observations without claiming reduced reading or machine-independent speed.", requirement_ids: [], source_refs: [ { id: 3631e043-ab52-49bd-bb77-e1712c9dc6e2, revision: 2 }, { id: acacb0db-b792-4a27-9beb-b747cea8bb56, revision: 3 }, { id: 821caa98-e5cd-4085-8b26-2a75492adb62, revision: 2 } ] }, { item_index: 80, item_key: requirement:PWF-042, verdict: covered, explanation: "The enhanced full-review contract directly addresses the validated missing whole-specification assessment, requires exact final context after acknowledged detailed verdicts, preserves legacy runs and keeps consistency separate from batching.", requirement_ids: [], source_refs: [ { id: 323f9850-4db4-42e4-8d41-1a739a1544c1, revision: 2 }, { id: add9a8a3-e7e6-45c0-8c21-754c88aeaa46, revision: 2 } ] }, { item_index: 81, item_key: requirement:PWF-043, verdict: covered, explanation: "The accelerated followup rule is appropriately narrow: only finding-linked non-requirement repairs with unchanged requirements, sources, scope and profiles can inherit evidence; uncertain or normative changes force a full review and fresh consistency.", requirement_ids: [], source_refs: [ { id: 323f9850-4db4-42e4-8d41-1a739a1544c1, revision: 2 }, { id: add9a8a3-e7e6-45c0-8c21-754c88aeaa46, revision: 2 } ] }, { item_index: 82, item_key: requirement:PWF-044, verdict: covered, explanation: "The structured change-report contract solves opaque navigation without replacing exact evidence, using stable finding/item keys, reason codes, counts and version-bound continuations while keeping legacy text readers compatible.", requirement_ids: [], source_refs: [ { id: 323f9850-4db4-42e4-8d41-1a739a1544c1, revision: 2 }, { id: add9a8a3-e7e6-45c0-8c21-754c88aeaa46, revision: 2 } ] }, { item_index: 83, item_key: requirement:PWF-045, verdict: covered, explanation: "The conflict-diagnostic contract distinguishes journal-only workflow races from proven semantic drift or uncertain comparisons without changing error codes, weakening stale-write guards or adding automatic retry.", requirement_ids: [], source_refs: [ { id: 323f9850-4db4-42e4-8d41-1a739a1544c1, revision: 2 }, { id: add9a8a3-e7e6-45c0-8c21-754c88aeaa46, revision: 2 } ] }, { item_index: 84, item_key: profile:core, verdict: covered, explanation: "The active core profile is materially covered by skill boundaries, host generation, public interfaces, configuration, deterministic output, compatibility, retries and recovery across PWF-001, PWF-003, PWF-004, PWF-017 through PWF-021, PWF-030, PWF-031 and PWF-034 through PWF-045.", requirement_ids: [ PWF-001, PWF-003, PWF-004, PWF-017, PWF-018, PWF-019, PWF-020, PWF-021, PWF-030, PWF-031, PWF-034, PWF-035, PWF-036, PWF-037, PWF-038, PWF-039, PWF-040, PWF-041, PWF-042, PWF-043, PWF-044, PWF-045 ], source_refs: [] }, { item_index: 85, item_key: profile:backend, verdict: covered, explanation: "The active backend profile is materially covered by typed MCP scenarios, strict schemas, protocol envelopes, bounded errors/paging, idempotent replay, conflicts, concurrency, interruption and recovery in PWF-017, PWF-018, PWF-021 through PWF-023, PWF-030 and PWF-034 through PWF-045.", requirement_ids: [ PWF-017, PWF-018, PWF-021, PWF-022, PWF-023, PWF-030, PWF-034, PWF-035, PWF-036, PWF-037, PWF-038, PWF-039, PWF-040, PWF-041, PWF-042, PWF-043, PWF-044, PWF-045 ], source_refs: [] }, { item_index: 86, item_key: profile:data, verdict: covered, explanation: "The active data profile is materially covered by multi-file ownership, registries, stable identities, relations, exact pins, retained revisions, isolated drafts, reconciliation and recoverable transitions in PWF-011 through PWF-016 and PWF-019 through PWF-027.", requirement_ids: [ PWF-011, PWF-012, PWF-013, PWF-014, PWF-015, PWF-016, PWF-019, PWF-020, PWF-021, PWF-022, PWF-023, PWF-024, PWF-025, PWF-026, PWF-027 ], source_refs: [] }, { item_index: 87, item_key: profile:security, verdict: covered, explanation: "The active security profile is materially covered by authority separation, native-answer provenance, root/path validation, traversal/link/collision rejection, least privilege, redaction, untrusted-content treatment and fail-closed abuse outcomes in PWF-001, PWF-004, PWF-025, PWF-026, PWF-028, PWF-029 and PWF-035.", requirement_ids: [ PWF-001, PWF-004, PWF-025, PWF-026, PWF-028, PWF-029, PWF-035 ], source_refs: [] }, { item_index: 88, item_key: context:specification, verdict: covered, explanation: "The exact current 64,825-character specification, confirmed manifest, all 45 requirement definitions, all 88 acknowledged detailed verdicts and four active-profile assessments are mutually consistent. The specification contains one unique PWF-001 through PWF-045 sequence with no unresolved cross-reference. Workflow ownership, external local product storage, one-task/one-specification lineage, review/activation ordering, retry/conflict semantics, safety override and planning exclusions agree across normative prose and requirements. The platform amendment is narrow and unambiguous: Linux, macOS and Windows remain supported with Node.js >=22.20.0, while completion qualification requires only one supported Linux/Node environment; absent macOS, Windows or alternate-Node results neither block completion nor count as executed evidence. No normative promise is left without an addressed requirement or authoritative contract reference, and no permission, prohibition, lifecycle order or public identifier contradicts another.", requirement_ids: [], source_refs: [] } ]
