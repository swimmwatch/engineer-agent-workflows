  - category: baseline.g01_amendment
    state: observed
    provenance: repository
    fact: The accepted session-report plan amendment requires G01 before P20/P21. P20 proposes bounded, non-sensitive validation and saved-question diagnostics; indexed all-or-nothing decision-link errors without a presumed selection bug; supersession-aware warnings retaining legacy current selection; separate observed document status and approval-checkpoint effects; and mode/lifecycle-specific review recovery without blind retries. P21 proposes a concrete atomic review-verdict batch with individual complete reads, unchanged full/followup eligibility and single-item rules, exact replay/restart recovery, write-count/byte measurements on equal 60-item workloads and bounded operations on synthetic 1,000/10,000-row histories. P19 retains metadata and exact-delivery guidance. The amendment excludes new context formats, transparent rebasing, CCr decoding, generic editors, compaction/migration, global setup, Claude trials and Penpot execution.
    evidence:
      - docs/specs/product-planning-workflows/tasks/plan.md:21
      - docs/specs/product-planning-workflows/tasks/20_workflow_diagnostics.md:21
      - docs/specs/product-planning-workflows/tasks/21_review_verdict_batches.md:22
      - docs/reports/workflow-session-bug-report-validation.md:1
    question: null
    answer: null
    id: 821caa98-e5cd-4085-8b26-2a75492adb62
    revision: 1
    supersedes_revision: null
  - category: baseline.g01_protocol_guards
    state: observed
    provenance: repository
    fact: Current single-verdict recording rejects an already recorded item and requires an item-bound complete-read receipt, explanatory evidence and valid source/requirement refs; gap/conflict needs a counterexample. Current mutation replay is exact serialized operation/input matching and retains the latest 64 successful receipts per file. Replay recovers the stored result without adding a receipt; semantic writes require current artifact/source guards. Workflow errors retain protocol 2, a 512-character message and at most 8192 UTF-8 JSON bytes of details. StdIO requests permit 2 MiB; structured/wire replies are bounded to 24/64 KiB. Ledger selection returns the latest non-explicitly-superseded revision; duplicate identity/revision pairs and broken supersedes links are rejected. The existing warning counts every non-superseded historical row, including predecessors consumed by a linear append-only chain. Review state normalizes status-only edits semantically and only observes author-made approval, without proving correctness or authenticating independence.
