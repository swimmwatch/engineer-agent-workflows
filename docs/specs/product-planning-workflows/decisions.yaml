    question:
      text: Confirm this exact scope proposal, or request a correction.
      kind: single_choice
      options:
        - id: confirm
          label: Confirm this proposal
        - id: change
          label: Change the proposal
    answer: null
    status: prepared
    scope:
      schema_version: 1
      depth: deep
      confirmed: false
      rationale:
        - "Scope: the complete proposed product workflow, Idea Refine -> Product Definition -> Technical Design -> Product Roadmap -> one task/one specification, with scenario MCP support and safe amendments."
        - PRD and Technical Design are separate multi-file artifacts from the first version; preserve task-level planning and implementation boundaries.
        - Deep depth is recommended because public tool contracts, source-version propagation, cross-file recovery and backwards compatibility affect persisted user data; this does not require extra artifacts without a concrete use.
        - "Confirmed platform support: Linux, macOS and Windows for MCP; retain the repository's Node.js >=22.20.0 runtime floor and separate Codex/Claude skill generation."
        - Planning will produce a reviewable MCP contract, storage schemas and observable quality/recovery scenarios; this specification invocation will not create those planning artifacts.
        - "Excluded: implementation, global installation or publication, external tracker synchronization, Penpot design work, and automatic conversion of legacy project bundles."
        - "Recommendation: keep the complete product lifecycle in scope; cost: more questions about integrity and compatibility than a creation-only first slice, with implementation sequencing left to separate planning."
      profiles:
        - id: core
          reason: Creation and coordination of product skills, selective context, and generated Codex/Claude bundles.
          state: active
        - id: backend
          reason: Versioned scenario-specific MCP tool inputs, results, errors, retries and compatibility.
          state: active
        - id: data
          reason: Multi-file PRD and Technical Design, structured registries and journals, stable IDs, snapshots, cross-file recovery and task-specification bindings.
          state: active
        - id: security
          reason: Filesystem access, safe path resolution, untrusted document content, provenance and protection against destructive or unauthorized writes.
          state: active
        - id: ui
          reason: No visual application UI or Penpot design is built; existing design-planning integration remains manifest-gated.
          state: not_applicable
        - id: events
          reason: No event broker or external asynchronous message contract is introduced.
          state: not_applicable
        - id: operations
          reason: No hosted deployment, service infrastructure or new SLO is introduced; process restart and file recovery are covered by MCP/data requirements.
          state: not_applicable
        - id: cross-surface
          reason: No new end-user UI/API journey is built; host bundle parity is covered by core and the shared MCP contract.
          state: not_applicable
      planning_artifacts:
        - contracts/mcp.md
        - contracts/schemas/data.schema.json
        - quality/scenarios.yaml
    revision: 1
    supersedes_revision: null
    question_origin:
      id: scope.manifest
