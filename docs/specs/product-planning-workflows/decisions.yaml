  - category: source.artifact_dependencies
    state: instructed
    provenance: user
    instruction:
      text: |-
        Учитывай следующие зависимости между артефактами:

        - Product Definition должен основываться на результатах, сформулированных в IDEA Refine.
        - Результаты Product Definition должны служить основой для Technical Design.
        - При подготовке каждого из этих артефактов агент должен задавать вопросы в соответствии с принципами Spec-Driven Development.

        Предложи:

        - какие артефакты необходимо сохранять;
        - какие сквозные идентификаторы следует использовать для согласования артефактов со спецификациями, PRD и Technical Design;
        - как обеспечить, чтобы MCP детерминированно находил нужные места, вносил изменения и корректно формировал контекст;
        - как агент должен собирать контекст для описания спецификаций и связанных материалов.

        Сохрани всё в Markdown-файле. Файл должен содержать полное описание того, что ты мне уже прислал, и того, что пришлёшь следующим сообщением. Сформируй все мысли в одном файле, чтобы затем на его основе сделать спецификацию в рамках наших скиллов.
