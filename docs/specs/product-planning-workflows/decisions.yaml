decisions:
  - category: source.product_request
    state: instructed
    provenance: user
    instruction:
      text: |-
        Предложи оптимальные варианты скиллов для создания PRD и описания technical design.

        Контекст:

        - Сейчас у нас есть скиллы для поэтапной разработки фичей.
        - Нет скилла, который позволяет начать проект, описать PRD и technical design, подобрать необходимые технологии и стек, а также запустить процесс исследований.
        - В дальнейшем скиллы по созданию спецификаций должны опираться на эти описания.

        Требования:

        - Учитывай, что продукт может развиваться в несколько этапов: MVP, последующие этапы MVP, Production и другие.
        - Предусмотри создание epics, user stories, пользовательских кейсов и других необходимых элементов.
        - Позволь глобально описывать продукт и план его развития.
        - Предусмотри последующее разбиение описаний на спецификации и задачи.
        - Каждая задача должна реализовывать свою спецификацию и при необходимости обновлять принятые решения в PRD и technical design.
        - Избегай сильного overengineering, но обеспечь плавный процесс перехода от глобального описания продукта к задачам и реализации.

        Исследование:

        - Поищи в интернете существующие подходы и аналоги, на которые мы уже опирались.
        - На основе исследования предложи оптимальный вариант структуры и набора скиллов.
      source: "Earlier user message in this conversation: request for product-level workflow research."
