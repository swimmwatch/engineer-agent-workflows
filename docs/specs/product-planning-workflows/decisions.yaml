    category: scope
    state: needs_user
    provenance: user
    question:
      text: Confirm this exact scope proposal, or request a correction.
      kind: single_choice
      options:
        - id: confirm
          label: Confirm this proposal
        - id: change
          label: Change the proposal
    answer: null
    status: prepared
    scope:
      schema_version: 1
      depth: deep
      confirmed: false
      rationale:
        - "Scope: the complete product workflow Idea Refine -> Product Definition -> Technical Design -> Product Roadmap -> one task/one specification, using scenario MCP tools."
        - "Confirmed amendment: one shared local directory outside working repositories stores the whole product layer (Idea, multi-file PRD, multi-file Technical Design, Roadmap and product decisions); product documents are not synchronized through Git branches."
        - Multiple local workspaces/branches use the same logical product; task specifications and plans remain in their working repositories and reference product versions.
        - The shared external-directory decision supersedes the earlier tentative use of Git for product-document history; no automatic Git commits or separate network service are in scope.
        - "Confirmed support: MCP on Linux, macOS and Windows, retaining Node.js >=22.20.0; shared skill sources generate distinct Codex and Claude bundles."
        - Deep is justified by public tool contracts, shared multi-writer state, bounded context, cross-file recovery and backwards compatibility; independent review applies to all four product artifacts.
        - Research before product readiness remains inside the interview; no independently executable pre-design research task. Existing task specifications are not enrolled or migrated.
        - Started tasks may finish against pinned earlier product requirements, except dangerous or incompatible changes require a question and pause; recovery guarantee covers process interruption, not sudden power loss.
        - "Planning artifacts: MCP contract, data schemas and quality/recovery scenarios. No implementation, global installation, package publication, tracker synchronization, UI/Penpot work or automatic migration."
        - "Recommendation: confirm this amended local shared-store scope; cost: the MCP must manage product revisions and concurrent amendments independently of Git, while cross-computer collaboration remains unsupported."
      profiles:
        - id: core
          reason: Product skills, host-specific generation, task context and multiple workspace bindings.
          state: active
        - id: backend
          reason: Scenario MCP contracts, results, errors, retries and shared-state concurrency.
          state: active
        - id: data
          reason: Shared external multi-file product state, stable references, version pinning, task bindings and recoverable updates.
          state: active
        - id: security
          reason: Local shared-store permissions, safe paths, untrusted input, provenance and preservation of unrelated user data.
          state: active
        - id: ui
          reason: No new visual UI or Penpot design; existing optional design-planning boundary is preserved.
          state: not_applicable
        - id: events
          reason: No broker or external event contract.
          state: not_applicable
        - id: operations
