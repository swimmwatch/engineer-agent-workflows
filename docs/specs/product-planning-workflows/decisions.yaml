e explicitly excluded semantic lint, decoder, read batching and model/platform expansion.", requirement_ids: [ PWF-042, PWF-043, PWF-044, PWF-045 ], source_refs: [ { id: add9a8a3-e7e6-45c0-8c21-754c88aeaa46, revision: 2 } ] }, { item_index: 38, item_key: source:9f94d288-bb5c-4da6-8018-e14dcad28dd2, verdict: covered, explanation: PWF-003 faithfully narrows mandatory qualification to one supported Linux/Node environment while retaining Linux/macOS/Windows product support and forbidding claims that unrun matrices passed., requirement_ids: [ PWF-003 ], source_refs: [ { id: 9f94d288-bb5c-4da6-8018-e14dcad28dd2, revision: 1 } ] }, { item_index: 39, item_key: requirement:PWF-001, verdict: covered, explanation: "The requirement is justified by the original product request, explicit specification invocation, three-skill choice and repository authority evidence; it preserves separate stage ownership and negative authorization boundaries.", requirement_ids: [], source_refs: [ { id: ea9e93d8-4f2c-4749-99d0-49e69e5d8d14, revision: 2 }, { id: 894a8a38-b926-446c-8373-0c962a19cc0d, revision: 2 }, { id: 1c57a930-30fb-4bae-a951-b421546d82b4, revision: 3 }, { id: 8245c92f-abf0-4c2b-b3d1-9ee2ac0b6c9d, revision: 2 } ] }, { item_index: 40, item_key: requirement:PWF-002, verdict: covered, explanation: "The required Idea -> Product Definition -> Technical Design -> Roadmap lineage, exact parent versions, stale-parent assessment and no pre-design task exception are faithful to the dependency and research sources.", requirement_ids: [], source_refs: [ { id: ea9e93d8-4f2c-4749-99d0-49e69e5d8d14, revision: 2 }, { id: c0c465d8-805c-4f37-b765-c88c19d037e7, revision: 2 }, { id: be61bd5b-f1df-4eb9-87c1-64c74826446e, revision: 3 } ] }, { item_index: 41, item_key: requirement:PWF-003, verdict: covered, explanation: "PWF-003 reconciles both platform instructions without contradiction: Linux/macOS/Windows and Node >=22.20 remain supported, while only one supported Linux/Node environment is mandatory f