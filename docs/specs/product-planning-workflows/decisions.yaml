      results: [ { item_index: 0, item_key: source:ea9e93d8-4f2c-4749-99d0-49e69e5d8d14, verdict: covered, explanation: "The product request is fully preserved across explicit skills and stage lineage, adaptive interviews, durable Idea/PRD/Technical Design/Roadmap artifacts, multi-file authority, one-task/one-specification traceability, bounded context, implementation reconciliation and observable end-to-end evidence. These requirements retain phased product evolution, research, epics/stories/use cases, technology selection and the negative authority boundaries.", requirement_ids: [ PWF-001, PWF-002, PWF-004, PWF-006, PWF-007, PWF-008, PWF-009, PWF-010, PWF-013, PWF-016, PWF-019, PWF-031, PWF-032, PWF-033 ], source_refs: [ { id: ea9e93d8-4f2c-4749-99d0-49e69e5d8d14, revision: 2 } ] }, { item_index: 1, item_key: source:b3fe5c8f-152e-4e57-bc07-f6cfcd63dc77, verdict: covered, explanation: PWF-016 requires exactly one logical specification for every independent task and forbids one specification from implementing two independent tasks; PWF-031 keeps that task specification as the input to its own planning and implementation flow., requirement_ids: [ PWF-016, PWF-031 ], source_refs: [ { id: b3fe5c8f-152e-4e57-bc07-f6cfcd63dc77, revision: 2 } ] }, { item_index: 2, item_key: source:c0c465d8-805c-4f37-b765-c88c19d037e7, verdict: covered, explanation: "The artifact dependency, questioning, saved-artifact, cross-ID, deterministic placement and bounded-context requests are represented by PWF-002, PWF-004, PWF-006 through PWF-008 and PWF-013 through PWF-020 without duplicating authority.", requirement_ids: [ PWF-002, PWF-004, PWF-006, PWF-007, PWF-008, PWF-013, PWF-014, PWF-015, PWF-016, PWF-017, PWF-019, PWF-020 ], source_refs: [ { id: c0c465d8-805c-4f37-b765-c88c19d037e7, revision: 2 } ] }, { item_index: 3, item_key: source:57d5a867-9f8b-4014-9225-e25a92977947, verdict: covered, explanation: "PWF-013 explicitly requires separate multi-file PRD and Technical Design sets, PWF-014 provides deterministic membership and placement, and PWF-015 preserves stable IDs through moves and splits.", requirement_ids: [ PWF-013, PWF-014, PWF-015 ], source_refs: [ { id: 57d5a867-9f8b-4014-9225-e25a92977947, revision: 2 } ] }, { item_index: 4, item_key: source:894a8a38-b926-446c-8373-0c962a19cc0d, verdict: covered, explanation: PWF-004 explicitly selects synchronous request_user_input and excludes its asynchronous counterpart and Prompt MCP; PWF-001 and PWF-033 retain specification/review boundaries., requirement_ids: [ PWF-001, PWF-004, PWF-033 ], source_refs: [ { id: 894a8a38-b926-446c-8373-0c962a19cc0d, revision: 2 } ] }, { item_index: 5, item_key: source:e9dc586b-5f77-4454-9bcb-8c6458c5ca57, verdict: covered, explanation: "The original Linux/macOS/Windows product support survives. PWF-003 applies the later amendment only to mandatory qualification, while PWF-022, PWF-028 and PWF-030 preserve cross-platform recovery, path-safety and deterministic behavior.", requirement_ids: [ PWF-003, PWF-022, PWF-028, PWF-030 ], source_refs: [ { id: e9dc586b-5f77-4454-9bcb-8c6458c5ca57, revision: 3 } ] }, { item_index: 6, item_key: source:scope.manifest, verdict: covered, explanation: "The specification matches the confirmed Deep scope, active core/backend/data/security profiles, shared external product store, cross-platform behavior, four-artifact review, in-interview research, pinned-task safety exception, declared planning artifacts and explicit exclusions.", requirement_ids: [], source_refs: [ { id: scope.manifest, revision: 4 } ] }, { item_index: 7, item_key: source:1c57a930-30fb-4bae-a951-b421546d82b4, verdict: covered, explanation: "PWF-001 requires the selected three separate product skills; PWF-006 through PWF-009 give Idea, PRD, Technical Design and Roadmap distinct durable ownership.", requirement_ids: [ PWF-001, PWF-006, PWF-007, PWF-008, PWF-009 ], source_refs: [ { id: 1c57a930-30fb-4bae-a951-b421546d82b4, revision: 3 } ] }, { item_index: 8, item_key: source:18ee7d64-9e1e-4ec3-8320-1f7bf10a55ff, verdict: covered, explanation: PWF-011 and PWF-012 represent one logical product shared by several local workspaces; PWF-016 preserves one task/spec identity across working copies., requirement_ids: [ PWF-011, PWF-012, PWF-016 ], source_refs: [ { id: 18ee7d64-9e1e-4ec3-8320-1f7bf10a55ff, revision: 3 } ] }, { item_index: 9, item_key: source:eb7d7aa2-5d2c-4f1a-b445-a41cf913f32b, verdict: covered, explanation: "PWF-013 makes Markdown the semantic authority, PWF-014 deterministically maps elements to members, and PWF-026 reconciles direct edits without silently granting readiness.", requirement_ids: [ PWF-013, PWF-014, PWF-026 ], source_refs: [ { id: eb7d7aa2-5d2c-4f1a-b445-a41cf913f32b, revision: 3 } ] }, { item_index: 10, item_key: source:1172a36d-2bdf-4d8b-aeb8-f8ef95d21b53, verdict: covered, explanation: PWF-005 requires review of all four artifacts and PWF-023 prevents unchecked drafts from becoming shared current state., requirement_ids: [ PWF-005, PWF-023 ], source_refs: [ { id: 1172a36d-2bdf-4d8b-aeb8-f8ef95d21b53, revision: 3 } ] }, { item_index: 11, item_key: source:be61bd5b-f1df-4eb9-87c1-64c74826446e, verdict: covered, explanation: "PWF-002 preserves the required artifact lineage and PWF-010 implements the selected in-interview-only research boundary, including no renamed spike or implementation exception.", requirement_ids: [ PWF-002, PWF-010 ], source_refs: [ { id: be61bd5b-f1df-4eb9-87c1-64c74826446e, revision: 3 } ] }, { item_index: 12, item_key: source:804cd1e3-e197-4d16-b3cd-c0717801f91c, verdict: covered, explanation: PWF-027 directly preserves the decision not to enroll or migrate existing specifications and keeps legacy absence of product metadata non-failing., requirement_ids: [ PWF-027 ], source_refs: [ { id: 804cd1e3-e197-4d16-b3cd-c0717801f91c, revision: 3 } ] }, { item_index: 13, item_key: source:477838f8-ad4c-4491-8bba-9b96b25cf603, verdict: covered, explanation: "PWF-022 gives recoverable process-interruption checkpoints and explicitly excludes sudden power loss, disk failure and hostile filesystem mutation from the guarantee.", requirement_ids: [ PWF-022 ], source_refs: [ { id: 477838f8-ad4c-4491-8bba-9b96b25cf603, revision: 3 } ] }, { item_index: 14, item_key: source:a9ecaf21-8d40-448b-addd-83607c10f660, verdict: covered, explanation: The earlier Git suggestion is expressly superseded by the later separate shared-store instruction and shared-directory answer. PWF-011 removes Git product storage while PWF-020 preserves the underlying retention intent in MCP-managed state., requirement_ids: [ PWF-011, PWF-020 ], source_refs: [ { id: a9ecaf21-8d40-448b-addd-83607c10f660, revision: 3 } ] }, { item_index: 15, item_key: source:496e88f7-b0dc-4bc8-b686-ca5f161d1905, verdict: covered, explanation: PWF-024 permits ordinary completion against pinned inputs; PWF-025 preserves the later selected exception for dangerous or incompatible changes., requirement_ids: [ PWF-024, PWF-025 ], source_refs: [ { id: 496e88f7-b0dc-4bc8-b686-ca5f161d1905, revision: 3 } ] }, { item_index: 16, item_key: source:71ccb286-c3d0-4612-9ba9-e8bf1b0fad65, verdict: covered, explanation: "PWF-011, PWF-012, PWF-020 and PWF-023 faithfully implement the clarified requirement to keep shared product history outside repositories and Git, with no automatic commits.", requirement_ids: [ PWF-011, PWF-012, PWF-020, PWF-023 ], source_refs: [ { id: 71ccb286-c3d0-4612-9ba9-e8bf1b0fad65, revision: 5 } ] }, { item_index: 17, item_key: source:dd594f5b-9e12-4c42-96eb-2874257154ee, verdict: covered, explanation: PWF-024 and PWF-025 implement the selected safety exception rather than unconditional old-version completion., requirement_ids: [ PWF-024, PWF-025 ], source_refs: [ { id: dd594f5b-9e12-4c42-96eb-2874257154ee, revision: 3 } ] }, { item_index: 18, item_key: source:84d0ba65-eaa8-4a33-94be-4f400350f129, verdict: not_applicable, explanation: "This source is explicitly classified as a conversational request for an explanation, has no requirement links and selects no product or commit policy. Later answered sources establish the actual storage choice.", requirement_ids: [], source_refs: [ { id: 84d0ba65-eaa8-4a33-94be-4f400350f129, revision: 2 } ] }, { item_index: 19, item_key: source:4d15acd9-f64e-41ff-a7ef-6d24ec01152a, verdict: covered, explanation: "PWF-011 stores the product layer in a shared local directory, PWF-012 binds multiple workspaces, and PWF-028 constrains path resolution without promising cross-computer collaboration.", requirement_ids: [ PWF-011, PWF-012, PWF-028 ], source_refs: [ { id: 4d15acd9-f64e-41ff-a7ef-6d24ec01152a, revision: 3 } ] }, { item_index: 20, item_key: source:5a8d4951-74f2-457f-a697-2be83e3ccafd, verdict: covered, explanation: "PWF-011 moves the whole product layer to shared storage, PWF-013 preserves distinct document authorities, PWF-016 links tasks/specifications and PWF-031 keeps task-local plans and design artifacts in workspaces.", requirement_ids: [ PWF-011, PWF-013, PWF-016, PWF-031 ], source_refs: [ { id: 5a8d4951-74f2-457f-a697-2be83e3ccafd, revision: 3 } ] }, { item_index: 21, item_key: source:7f47fe2e-a9aa-4173-8b98-f23f6ec69c91, verdict: covered, explanation: "PWF-005 requires independent review before readiness, PWF-023 isolates candidates until activation, PWF-021 preserves read-only observers and PWF-022 makes interrupted activation recoverable.", requirement_ids: [ PWF-005, PWF-021, PWF-022, PWF-023 ], source_refs: [ { id: 7f47fe2e-a9aa-4173-8b98-f23f6ec69c91, revision: 3 } ] }, { item_index: 22, item_key: source:6c56266b-ba8e-4a62-9c69-b43d9d3a3e98, verdict: covered, explanation: PWF-003 preserves distinct generated bundles and Node >=22.20.0 while separating product support from mandatory qualification; PWF-031 preserves existing workflow ownership., requirement_ids: [ PWF-003, PWF-031 ], source_refs: [ { id: 6c56266b-ba8e-4a62-9c69-b43d9d3a3e98, revision: 2 } ] }, { item_index: 23, item_key: source:1c9f596b-f2a9-413b-877