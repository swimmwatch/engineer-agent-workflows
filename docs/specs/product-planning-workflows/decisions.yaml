ary and existing single-file limitations: coherent prior state or explicit incomplete state, named checkpoints and compatible resume, with no power-loss guarantee.", requirement_ids: [], source_refs: [ { id: e9dc586b-5f77-4454-9bcb-8c6458c5ca57, revision: 3 }, { id: 477838f8-ad4c-4491-8bba-9b96b25cf603, revision: 3 }, { id: 7f47fe2e-a9aa-4173-8b98-f23f6ec69c91, revision: 3 }, { id: 1c9f596b-f2a9-413b-877f-e3b0644f7d96, revision: 2 } ] }, { item_index: 61, item_key: requirement:PWF-023, verdict: covered, explanation: "The isolated-draft and checked-activation behavior directly implements the user's 'after review' choice and shared-store amendment while preventing unfinished text, stale bases or partial files from becoming current.", requirement_ids: [], source_refs: [ { id: 1172a36d-2bdf-4d8b-aeb8-f8ef95d21b53, revision: 3 }, { id: 71ccb286-c3d0-4612-9ba9-e8bf1b0fad65, revision: 5 }, { id: 7f47fe2e-a9aa-4173-8b98-f23f6ec69c91, revision: 3 }, { id: e29ebc13-4cba-41d7-b663-4fef471a18cf, revision: 2 } ] }, { item_index: 62, item_key: requirement:PWF-024, verdict: covered, explanation: "The requirement faithfully encodes the ordinary pinned-version completion choice and keeps packet authorization, task scope, commits and reviews separate; it does not extend stale rules to unstarted or new tasks.", requirement_ids: [], source_refs: [ { id: 496e88f7-b0dc-4bc8-b686-ca5f161d1905, revision: 3 }, { id: dd594f5b-9e12-4c42-96eb-2874257154ee, revision: 3 } ] }, { item_index: 63, item_key: requirement:PWF-025, verdict: covered, explanation: "The requirement captures the explicitly selected safety/incompatibility exception with a concrete pause-and-question outcome, visible uncertainty and unaffected-work continuation without claiming automatic domain-risk inference.", requirement_ids: [], source_refs: [ { id: 496e88f7-b0dc-4bc8-b686-ca5f161d1905, revision: 3 }, { id: dd594f5b-9e12-4c42-96eb-2874257154ee, revision: 3 } ] }, { item_index: 64, item_key: requirement:PWF-026, verdict: covered, explanation: "The direct-edit behavior preserves Markdown authority and existing provenance boundaries: drift is reconciled rather than silently approved, ambiguous user text is not overwritten and requirement changes receive renewed review.", requirement_ids: [], source_refs: [ { id: eb7d7aa2-5d2c-4f1a-b445-a41cf913f32b, revision: 3 }, { id: 8245c92f-abf0-4c2b-b3d1-9ee2ac0b6c9d, revision: 2 } ] }, { item_index: 65, item_key: requirement:PWF-027, verdict: covered, explanation: The requirement directly preserves the no-legacy-migration answer and observed old-client boundary while allowing new product-linked tasks only through versioned capabilities., requirement_ids: [], source_refs: [ { id: 804cd1e3-e197-4d16-b3cd-c0717801f91c, revision: 3 }, { id: 9454e6ee-65bb-4e6f-b398-063f8d487726, revision: 2 } ] }, { item_index: 66, item_key: requirement:PWF-028, verdict: covered, explanation: "The path-safety contract is supported by the local shared-root choice, cross-platform support and repository authority evidence; it preserves no disk scan/allowlist, process permissions as trust boundary and fail-closed redacted outcomes.", requirement_ids: [], source_refs: [ { id: e9dc586b-5f77-4454-9bcb-8c6458c5ca57, revision: 3 }, { id: 4d15acd9-f64e-41ff-a7ef-6d24ec01152a, revision: 3 }, { id: 8245c92f-abf0-4c2b-b3d1-9ee2ac0b6c9d, revision: 2 } ] }, { item_index: 67, item_key: requirement:PWF-029, verdict: covered, explanation: The provenance and data-minimization rules faithfully apply existing authority/privacy guidance to the product store without claiming authentication or allowing document content to execute actions., requirement_ids: [], source_refs: [ { id: 8245c92f-abf0-4c2b-b3d1-9ee2ac0b6c9d, revision: 2 } ] }, { item_index: 68, item_key: requirement:PWF-030, verdict: covered, explanation: "The bounded-scale requirement preserves the observed limits, cross-platform deterministic behavior and explicit overflow outcomes; the 10,000-line scenario measures behavior without inventing a latency promise.", requirement_ids: [], source_refs: [ { id: e9dc586b-5f77-4454-9bcb-8c6458c5ca57, revision: 3 }, { id: 923e148d-fa4c-4fce-813c-f99601a1b1c8, revision: 2 } ] }, { item_index: 69, item_key: requirement:PWF-031, verdict: covered, explanation: "The task integration requirement faithfully connects product context to the existing one-task/one-specification workflow, preserves one authority for shared rules and keeps planning, design, implementation, reviews and commits in their established separately authorized stages.", requirement_ids: [], source_refs: [ { id: ea9e93d8-4f2c-4749-99d0-49e69e5d8d14, revision: 2 }, { id: b3fe5c8f-152e-4e57-bc07-f6cfcd63dc77, revision: 2 }, { id: 5a8d4951-74f2-457f-a697-2be83e3ccafd, revision: 3 }, { id: 6c56266b-ba8e-4a62-9c69-b43d9d3a3e98, revision: 2 }, { id: 8245c92f-abf0-4c2b-b3d1-9ee2ac0b6c9d, revision: 2 } ] }, { item_index: 70, item_key: requirement:PWF-032, verdict: covered, explanation: "The implementation-finding classification and owner-directed reconciliation follow the original workflow goal: correct code against correct checks, return genuine product choices to the owning artifact and never rewrite product intent merely to rationalize code.", requirement_ids: [], source_refs: [ { id: ea9e93d8-4f2c-4749-99d0-49e69e5d8d14, revision: 2 } ] }, { item_index: 71, item_key: requirement:PWF-033, verdict: covered, explanation: The observable success/failure/concurrency/recovery and fresh-context evidence directly implement the original product-workflow and specification-invocation requests without making model trials or independent reviews implicit gates., requirement_ids: [], source_refs: [ { id: ea9e93d8-4f2c-4749-99d0-49e69e5d8d14, revision: 2 }, { id: 894a8a38-b926-446c-8373-0c962a19cc0d, revision: 2 } ] }, { item_index: 72, item_key: requirement:PWF-034, verdict: covered, explanation: "The discovery metadata requirement faithfully addresses the tool-description audit without changing runtime behavior: it makes references, contexts, receipts, continuations, effects and defaults actionable and requires metadata/contract/runtime agreement.", requirement_ids: [], source_refs: [ { id: 9c40e255-9786-495f-8fe4-4a6f53e0967d, revision: 1 } ] }, { item_index: 73, item_key: requirement:PWF-035, verdict: covered, explanation: "The diagnostic contract is supported by the session report and protocol baseline: it preserves error codes and limits, adds only bounded safe field/index/category details, rejects whole invalid batches and prevents payload/secret leakage or automatic retries.", requirement_ids: [], source_refs: [ { id: 3631e043-ab52-49bd-bb77-e1712c9dc6e2, revision: 2 }, { id: 821caa98-e5cd-4085-8b26-2a75492adb62, revision: 2 }, { id: 91400cb1-7c89-4e83-bbda-fe2ccf02f246, revision: 2 } ] }, { item_index: 74, item_key: requirement:PWF-036, verdict: covered, explanation: "The warning rule is a narrow correction justified by the observed append-only chain behavior: it counts ambiguous heads per ID while retaining selected-record behavior and all invalid-link/duplicate protections.", requirement_ids: [], source_refs: [ { id: 3631e043-ab52-49bd-bb77-e1712c9dc6e2, revision: 2 }, { id: 821caa98-e5cd-4085-8b26-2a75492adb62, revision: 2 }, { id: 91400cb1-7c89-4e83-bbda-fe2ccf02f246, revision: 2 } ] }, { item_index: 75, item_key: requirement:PWF-037, verdict: covered, explanation: "The status requirement faithfully separates document text, mechanical checks, review coverage and durable approval observation, preserves author ownership and read-only status, and explicitly denies semantic/authentication claims.", requirement_ids: [], source_refs: [ { id: 3631e043-ab52-49bd-bb77-e1712c9dc6e2, revision: 2 }, { id: 821caa98-e5cd-4085-8b26-2a75492adb62, revision: 2 }, { id: 91400cb1-7c89-4e83-bbda-fe2ccf02f246, revision: 2 } ] }, { item_index: 76, item_key: requirement:PWF-038, verdict: covered, explanation: "The lifecycle diagnostic requirement preserves modes, evidence gates and whole-spec consistency, gives a non-mutating next action, and keeps true conflicts/stale inputs blocking rather than enabling transparent retries.", requirement_ids: [], source_refs: [ { id: 3631e043-ab52-49bd-bb77-e1712c9dc6e2, revision: 2 }, { id: 821caa98-e5cd-4085-8b26-2a75492adb62, revision: 2 }, { id: 91400cb1-7c89-4e83-bbda-fe2ccf02f246, revision: 2 } ] }, { item_index: 77, item_key: requirement:PWF-039, verdict: covered, explanation: "The bounded batch requirement exactly implements the selected 20-item/131,072-byte limits, retains per-item receipts/evidence and single-call compatibility, and excludes completion and whole-spec consistency from batching.", requirement_ids: [], source_refs: [ { id: 3631e043-ab52-49bd-bb77-e1712c9dc6e2, revision: 2 }, { id: 8df3ea7a-70a4-473c-b95c-1bee668c8c11, revision: 3 }, { id: acacb0db-b792-4a27-9beb-b747cea8bb56, revision: 3 }, { id: 821caa98-e5cd-4085-8b26-2a75492adb62, revision: 2 }, { id: 91400cb1-7c89-4e83-bbda-fe2ccf02f246, revision: 2 } ] }, { item_index: 78, item_key: requirement:PWF-040, verdict: covered, explanation: "The atomic/replay contract faithfully implements the selected reject-overlap policy, coherent preflight and exact-request recovery while preserving latest-64 receipts, true stale conflicts, crash-lock handling and no power-loss promise.", requirement_ids: [], source_refs: [ { id: 3631e043-ab52-49bd-bb77-e1712c9dc6e2, revision: 2 }, { id: 8df3ea7a-70a4-473c-b95c-1bee668c8c11, revision: 3 }, { id: 821caa98-e5cd-4085-8b26-2a75492adb62, revision: 2 }, { id: 91400cb1-7c89-4e83-bbda-fe2ccf02f246, revision: 2 } ] }, { item_index: 79, item_key: requirement:PWF-041, verdict: covered, explanation: "The requirement faithfully preserves the report's exact-delivery limitation and selected batch bounds while measuring only actual write reduction. It explicitly excludes reduced reading/semantic judgment claims, compaction, migration, global setup, Claude and Penpot, and retains all platform/scope boundaries.", requirement_ids: [], source_refs: [ { id: 3631e043-ab52-49bd-bb77-e1712c9dc6e2, revision: 2 }, { id: acacb0db-b792-4a27-9beb-b747cea8bb56, revision: 3 }, { id: 821caa98-e5cd-4085-8b26-2a75492adb62, revision: 2 } ] }, { item_index: 80, item_key: requirement:PWF-042, verdict: covered, explanation: "The enhanced full-review requirement directly addresses the validated missing final consistency assessment, keeps exact complete reads and detailed verdicts distinct, preserves legacy runs and requires acknowledged writes rather than inferred progress.", requirement_ids: [], source_refs: [ { id: 323f9850-4db4-42e4-8d41-1a739a1544c1, revision: 2 }, { id: add9a8a3-e7e6-45c0-8c21-754c88aeaa46, revision: 2 } ] }, { item_index: 81, item_key: requirement:PWF-043, verdict: covered, explanation: "The corrections-only rule faithfully implements the chosen local recheck plus whole-spec consistency boundary: only finding-linked non-requirement/context repairs with unchanged sources/scope can inherit evidence; uncertain or normative changes require a full review.", requirement_ids: [], source_refs: [ { id: 323f9850-4db4-42e4-8d41-1a739a1544c1, revision: 2 }, { id: add9a8a3-e7e6-45c0-8c21-754c88aeaa46, revision: 2 } ] }, { item_index: 82, item_key: requirement:PWF-044, verdict: covered, explanation: "The structured navigation requirement directly answers the opaque change-report finding while retaining exact paginated evidence, stable finding keys, version-bound receipts and the legacy text interface without treating previews as proof.", requirement_ids: [], source_refs: [ { id: 323f9850-4db4-42e4-8d41-1a739a1544c1, revision: 2 }, { id: add9a8a3-e7e6-45c0-8c21-754c88aeaa46, revision: 2 } ] }, { item_index: 83, item_key: requirement:PWF-045, verdict: covered, explanation: "The conflict classification requirement addresses the verified journal-only race without weakening optimistic concurrency: it preserves top-level codes and read consistency, reports uncertainty when comparison is unavailable and requires explicit reopen/inspection before resume.", requirement_ids: [], source_refs: [ { id: 323f9850-4db4-42e4-8d41-1a739a1544c1, revision: 2 }, { id: add9a8a3-e7e6-45c0-8c21-754c88aeaa46, revision: 2 } ] }, { item_index: 84, item_key: profile:core, verdict: covered, explanation: "The core profile is materially covered by explicit skill/consumer boundaries, typed public interfaces, configuration and host generation rules, deterministic behavior, compatibility and repeat/recovery acceptance in PWF-001, PWF-003, PWF-004, PWF-017 through PWF-021, PWF-030, PWF-031 and PWF-034 through PWF-045.", requirement_ids: [ PWF-001, PWF-003, PWF-004, PWF-017, PWF-018, PWF-019, PWF-020, PWF-021, PWF-030, PWF-031, PWF-034, PWF-035, PWF-036, PWF-037, PWF-038, PWF-039, PWF-040, PWF-041, PWF-042, PWF-043, PWF-044, PWF-045 ], source_refs: [] }, { item_index: 85, item_key: profile:backend, verdict: covered, explanation: "The backend profile is materially covered by scenario-specific MCP operations, strict schemas, protocol envelopes, success/error contracts, bounded paging, retries, idempotent replay, conflicts, concurrency, interruption and recovery in PWF-017, PWF-018, PWF-021 through PWF-023, PWF-030 and PWF-034 through PWF-045.", requirement_ids: [ PWF-017, PWF-018, PWF-021, PWF-022, PWF-023, PWF-030, PWF-034, PWF-035, PWF-036, PWF-037, PWF-038, PWF-039, PWF-040, PWF-041, PWF-042, PWF-043, PWF-044, PWF-045 ], source_refs: [] }, { item_index: 86, item_key: profile:data, verdict: covered, explanation: "The data profile is materially covered by multi-file ownership, registry/identity invariants, task relations, exact source pins, retained revisions, concurrent drafts, fail-closed history reads, direct-edit reconciliation and recoverable multi-file transitions in PWF-011 through PWF-016 and PWF-019 through PWF-027.", requirement_ids: [ PWF-011, PWF-012, PWF-013, PWF-014, PWF-015, PWF-016, PWF-019, PWF-020, PWF-021, PWF-022, PWF-023, PWF-024, PWF-025, PWF-026, PWF-027 ], source_refs: [] }, { item_index: 87, item_key: profile:security, verdict: covered, explanation: "The security profile is materially covered by authority separation, native-answer provenance, path/root validation, least-privilege process permissions, traversal/link/collision rejection, sensitive-data redaction, untrusted-content treatment, fail-closed unsupported capabilities and observable abuse tests in PWF-001, PWF-004, PWF-025, PWF-026, PWF-028, PWF-029 and PWF-035.", requirement_ids: [ PWF-001, PWF-004, PWF-025, PWF-026, PWF-028, PWF-029, PWF-035 ], source_refs: [] } ]
