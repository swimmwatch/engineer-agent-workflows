    reason: No visual interface or design changes.
    state: not_applicable
  - id: backend
    reason: Existing MCP operations and schemas are preserved; no new HTTP/RPC service contract.
    state: not_applicable
  - id: events
    reason: No event delivery or asynchronous message contract change.
    state: not_applicable
  - id: data
    reason: No storage schema, migration, retention or persistent cache change.
    state: not_applicable
  - id: operations
    reason: No deployment, installation, scheduling or new operational service; performance evidence stays within existing isolated qualification.
    state: not_applicable
  - id: security
    reason: Existing integrity, ownership, privacy and authorization controls are preserved as core acceptance constraints; no new security mechanism.
    state: not_applicable
  - id: cross-surface
    reason: Shared source remains portable to Codex and Claude Code with existing generation; no new cross-client interaction or architecture.
    state: not_applicable
