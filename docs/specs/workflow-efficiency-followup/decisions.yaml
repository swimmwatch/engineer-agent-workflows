      proposals:
        - id: serial-existing-protocol
          packet_id: P01
          requirement_ids:
            - WFE-001
            - WFE-004
            - WFE-006
            - WFE-007
            - WFE-008
          sources:
            - path: docs/specs/workflow-efficiency-followup/tasks/plan.md
              heading: Shared technical boundary
              text: |+
                ## Shared technical boundary

                This Standard/core plan implements WFE-001 through WFE-007 within WFE-008's separately authorized planning boundary. The approved behavior remains in `../spec.md`; no additional profile contract, public API, dependency, persistent cache or configuration is introduced.

                Use the existing public MCP operations and their returned opaque context, references, cursors and read receipts. Keep server integrity validation, completion checks, ownership and recovery semantics intact. Optimize consumer progression and instructions at their existing ownership points. Do not move server validation into an agent-side cache.

                Before the first implementation edit, retain a private content-addressed baseline of the affected source and generated bundles, including the already present response-budget correction. Preserve that correction identically in baseline and candidate: it is not this workstream's speed improvement. Record staged, tracked and untracked state without resetting unrelated work. Freeze fixture inputs, observation rules and quality oracles before comparison; protect evidence from later edits. Private capture paths and transcripts must not enter committed reports.

                Controlled workflow evidence observes actual tool operations and exact delivered source portions. Record actor/context identity, source identity/version/revision and requested portion identity; each reuse observation must refer to a complete prior delivery to the same actor that still has the exact text. Record each check's purpose, input identity and owning transition. Synthetic protocol verdicts establish protocol behavior only. Actual agent behavior requires a fresh-context controlled agent run with raw trace provenance; text matching and scripted assertions are supporting checks, not substitutes.

                Keep required native qualification for the changed implementation snapshot: Linux, macOS 15 and Windows 2025, each on Node.js 22.20.0 and 24.14.0. Generated Codex and Claude Code artifacts must pass existing structural checks; do not claim live Claude behavior from generation. Use existing runners and isolated stores/homes. A missing required runner, exact input, model trace or native result leaves qualification incomplete. Running remote CI, installing tools, committing or publishing needs its own existing authority; this plan grants none.

                Bindings are the algorithms, ownership, existing public operation signatures and the bounded evidence semantics stated here and in each packet's `Technical proposal`. Private helper names and equivalent statement organization remain flexible. Every packet must recheck the pinned specification and its managed technical agreement before and after execution. Each implementation invocation executes only its named packet, updates the checklist/current handoff, and stops.

              digest: d37d302dbeedc65a4845b046fb33740c2910a886b2b028b0030f4e1defef8935
            - path: docs/specs/workflow-efficiency-followup/tasks/01_serial_review.md
              heading: Technical proposal
              text: |+
                ## Technical proposal

                Requirements: WFE-001, WFE-004, WFE-006, WFE-007, WFE-008. The shared technical boundary in `plan.md` is binding.

                Change the existing `finish` loop in `scripts/benchmark-roadmap-retirement.mjs` and `completeReview` in `packages/engineer-agent-workflow-mcp/test-support/product-review-fixture.mjs`. Reuse `product_review_get_batch` / `readProductReviewBatch` with `pending_only: true` / `pendingOnly: true`, exact start review identity and a local scan index initialized from start. Exhaust every returned item's continuation with its own item index/cursor, form the verdict only from its final complete receipt, and wait for successful recording before advancing to the batch's returned scan index. A retained index may refer to the just-completed item; the next pending-only read skips its acknowledged verdict. Never substitute a continuation portion's coverage index for the batch scan index. An empty pending page with null next index terminates traversal without recording an empty batch. Preserve fresh consistency consumption/recording and authoritative completion after traversal. Do not add a replacement polling call or change public response/default semantics.

                Keep recovery/observer status operations. Lost acknowledgements, conflicts, changed scope or resume invalidate local progression; follow the existing supported status/recovery path and documented exact-replay rules, otherwise stop affected writes. In particular, the refresh and post-submit observations in `scripts/qualify-roadmap-retirement.mjs` serve separate process handoffs and remain intact. The already non-polling `scripts/benchmark-product-review.mjs` needs regression observation, not a speculative rewrite. No change to `src/product/review.ts` or storage is planned.

                Use existing `benchmarkRetirement`, `fixture` and `createSharedStdioHarness` for discriminating checks in the existing product review/retirement efficiency tests. Observe actual public MCP call names, complete response bytes and final outcomes. Cover full/recheck/followup traversal, multiple batches, incomplete items, retained indices, already recorded/inherited items, terminal pending scans and preserved recovery/consistency. Preserve controlled baseline runs before consumer changes. Candidate advancement-status calls must be zero and total public calls lower than the equivalent baseline; disclose any terminal scan. Prove the absence assertion by reintroducing one advancement-status call, and prove skipped-continuation/premature-completion rejection at the affected boundary. No general client library or benchmark framework is needed.

              digest: 872cf689b3e22863b5d9b520aa14ccd2cfc0c77a76c696b9ed5b311560cae53d
          digest: 8afbebc44b82ea99f0207fb12bbc81f68d79a7c3c1bbbc88f05b33c6b33ff0b6
