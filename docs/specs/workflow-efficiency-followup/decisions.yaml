        text: "Какой вариант выбрать для P01 (serial-existing-protocol: существующие next_item_index + pending_only без лишнего status), P02 (bounded-guidance-and-traces: уточнение shared guidance и проверки трасс), P03 (existing-qualification-paths: сравнение вызовов/времени, реальные трассы агента и шесть native-проверок) и P04 (existing-developer-docs: обновление docs/product-workflows.md после проверки)?"
        kind: single_choice
        options:
          - id: accept
            label: Принять P01–P04
            description: Использовать существующий протокол, уточнить инструкции, проверить эффект и описать подтверждённое поведение.
          - id: revise
            label: Изменить подход
            description: Уточнить технические решения перед завершением плана.
        option_bindings:
          - option_id: accept
            proposal_ids:
              - serial-existing-protocol
