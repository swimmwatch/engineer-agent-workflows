    fact: "The user-supplied global 'Context Gathering And Delegation' rule delegates bounded multi-step searches across unfamiliar files/sources only when benefit exceeds dispatch/verification overhead and runtime rules permit, including any requirement for independent parallel work. Known files, short checks and existing evidence use direct lookup. Start one scout; add another only for substantial independent work. Model defaults apply to scouts, not reviewers/implementers. Missing delegation/settings causes one disclosure and bounded local research; do not substitute user-visible tasks or nested CLI sessions. Prefer fresh context; pass exact question, roots/sources, facts, applicable instructions, scope, stopping condition and quick/medium/thorough search depth distinct from reasoning. Scouts inspect only: no edits, external mutations or child agents; restrict tools when supported. Preserve RTK, CodeGraph, source verification and required instruction reads; narrow from files to symbols/usages and passages, reuse analogues where useful. Stop when answered or blocked. Return evidence paths/symbols/line ranges or links and gaps, normally within 300 words, distinguishing facts/hypotheses and retaining decisive excerpts and caveats. The main agent owns decisions, edits and validation, reads decisive passages without repeating the whole search, reuses scouts for targeted follow-ups and claims savings only with measurement. Original model defaults are replaced by the user's latest explicit model-policy answer; the rest of this baseline rule is preserved subject to the agreed task-scoped invocation."
    evidence:
      - Host-supplied global AGENTS.md, Context Gathering And Delegation, lines 158-190; exact current block inspected read-only in this session.
