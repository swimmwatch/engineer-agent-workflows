rationale:
  - One specification covers all nine issues, as explicitly selected by the user, with distinct repository and external-environment acceptance.
  - Deep is warranted by public MCP contract evolution, persisted review reuse, recovery from unknown mutation outcomes and an external compression boundary.
  - Retain Codex and Claude Code packaging, Node.js >=22.20.0 and the documented Linux x64 local-development verification boundary; no new platform support.
  - Cover fixes 1–2 and regression protection; review after pass; complete draft record reads; actionable diagnostics; scenario client; explicit source/verdict hashes; architecture checkpoints; lossless transport/restore verification.
  - "Planning artifacts: contracts/mcp.md and quality/scenarios.yaml. Existing canonical data schemas remain authoritative; do not duplicate them."
  - Specification first; implementation, global installation/configuration, commits and publication excluded. External Headroom changes require their own owner and evidence; repository checks alone cannot establish their completion.
