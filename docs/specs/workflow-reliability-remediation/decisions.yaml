  - category: reported-issues
    state: instructed
    provenance: user
    instruction:
      text: |-
        Две ошибки действительно блокировали работу и уже исправлены. Остальные пункты — неудобства инструментов, диагностики и выполнения скиллов.

        1. **Валидатор отклонял корректные ссылки на решения PRD.**
        Для источников `decision` допустим пустой `element_ids`, но валидатор требовал элементы у всех источников. В результате Technical Design получал `SOURCE_CHANGED` при корректном PRD.
        **Исправлено:** проверка разделена по `source_kind`, добавлены отрицательные регрессионные случаи.

        2. **Принятая архитектура требовала предварительного Roadmap.**
        `accepted_target` без этапа отклонялся сообщением `Accepted Technical Design targets require at least one named stage`. При этом порядок скиллов предполагает Technical Design перед Roadmap. Подмена принятого решения состоянием `hypothesis` искажала смысл.
        **Исправлено:** разрешена общая архитектура продукта с `global: true, stage_refs: []`.
        Оба исправления находятся в рабочем дереве. Сборка и 5 профильных тестов прошли. Коммит, публикация и глобальная установка не выполнялись.

        3. **Маленькая правка после успешного ревью требует повторить всё ревью.**
        Замена одного символа в Mermaid-схеме потребовала заново проверить 119 блоков и итоговую согласованность. `followup` разрешён только после завершённого ревью с `gaps`.
        **Предложение:** отдельный режим повторной проверки после успешного ревью — с проверкой изменённых блоков, неизменности остальных источников и общей согласованности. Независимого рецензента сохранить.

        4. **Не хватало удобного чтения сохранённых черновых свидетельств.**
        Запись research/decision подтверждалась, но читатели закреплённых ready-источников не подходили для проверки тела черновой записи. Приходилось сохранять ответы MCP и разбирать доступные сценарии.
        **Предложение:** явный read-only сценарий чтения записи по кандидату, идентификатору и ревизии, с полным содержимым и продолжениями.

        5. **Диагностика недостаточно помогает исправить вызов.**
        Я передал незарегистрированный `subject: Architecture` вместо `Overview` и `limit: 100` при максимуме 50. Это мои ошибки вызова. Но сообщения и описание инструментов могли сразу показывать допустимые документы, поле ошибки и диапазон значения.
        **Предложение:** конкретные структурированные диагностики и примеры корректных вызовов.

        6. **Слишком много ручной работы с контекстами и продолжениями.**
        После мутаций нужно передавать новый opaque context; после работы рецензента контекст автора уже нельзя считать актуальным. Понадобился отдельный клиент для последовательных вызовов, сохранения результатов и восстановления состояния.
        **Предложение:** штатный клиент для workflow-сценариев, который ведёт контекст, пагинацию, повторные запросы и контроль полноты. Также полезна диагностика фактически запущенной версии MCP после исправлений.

        7. **Название `object_sha256` неоднозначно.**
        В итоговой согласованности это хеш сохранённого verdict, а не исходного документа. При новом ревью изменились все 119 таких хешей, хотя почти все источники остались прежними. Пришлось отдельно устанавливать семантику поля.
        **Предложение:** явно различать хеш источника и хеш verdict в названиях и документации.

        8. **На первом проходе я недостаточно явно согласовал технологии и показал архитектуру.**
        Это ошибка моего выполнения; не доказанный дефект скилла. Вам пришлось отдельно запросить выбор технологий, схему компонентов и владение базой данных.
        **Предложение для скилла:** контрольный список перед ревью архитектурной задачи: материальные технологические решения, границы компонентов, потоки данных, владельцы состояния и неподтверждённые интеграции.

        9. **Сжатие вывода мешало работать с контрактами инструментов.**
        Headroom иногда заменял данные маркерами `<<ccr:…>>`; усечение больших выводов ломало разбор JSON. Это проблема окружения, отдельно от инженерного MCP.
        **Предложение:** сохранять без потерь схемы инструментов, контексты, cursors, ссылки, хеши и receipts; сжимать пояснительный текст, предоставляя надёжное получение оригинала.
      source: "User-provided report: verbatim prose excerpts; file-link annotations omitted to avoid persisting personal machine paths. Repository references are recorded separately as verified facts."
