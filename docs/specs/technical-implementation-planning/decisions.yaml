schema_version: 1
spec_slug: technical-implementation-planning
decisions:
  - category: planning.technical-agreement
    state: instructed
    provenance: user
    instruction:
      text: |-
        Я хотел бы доработать наш скилл планирования, который мы используем после составления спецификации. Меня не устраивает, что при планировании агент задаёт мало вопросов, особенно об реализации. Хочется, чтобы он подробнее обсуждал, какую архитектуру выбрать, какие классы создать и какие паттерны использовать. Сначала агент должен самостоятельно обдумать варианты решений, а затем спросить пользователя, какой вариант реализации выбрать. Так нужно поступать для каждой задачи, которую предстоит реализовать.

        План должен описывать этапы реализации. Чтобы заранее понимать, как именно будет устроено решение, агенту нужно уточнять архитектуру и способы реализации, а затем фиксировать согласованные детали в задачах плана. При использовании скилла incremental implementation агент должен реализовывать конкретные решения, согласованные на этапе планирования.

        Иными словами, вызов скилла планирования должен подразумевать описание реализации на уровне классов, функций и других технических деталей. Подумай, как этого добиться без лишних усложнений и затягивания разработки, чтобы при планировании мы согласовывали техническую реализацию кода и продукта.
      source: Direct user message invoking spec-driven-development in this chat.
      kind: initial_request
    related_decisions: []
    requirement_ids: []
    question: null
    answer: null
    id: fbf5c9c5-b251-41d6-8013-2c5e56426162
    revision: 1
